<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080604">
<title>廻リ視 — 体験の前に</title>
<!--
  Quest 自身が :8090 で配る来場者用の面。PC とウェブ卓は経由しない。
  注意書きは HMD の TitleNotice と同文。外部 CDN と Web フォントは使わない。
  博士の静止画は ./asset/doctor.jpg。GET /status の実値で反映を判定する。
-->
<style>
  :root {
    color-scheme: dark;
    --bg: #080604;
    --ink: #f2e8d7;
    --muted: #c4b8a5;
    --faint: #817669;
    --line: rgba(242, 232, 215, .2);
    --line-strong: rgba(242, 232, 215, .42);
    --red: #a82229;
    --red-deep: #611419;
    --gold: #e7cf9f;
    --error: #e1847e;
    --serif: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "Noto Serif JP", "Noto Serif CJK JP", Georgia, serif;
    --sans: "Segoe UI", "Helvetica Neue", Arial, "Noto Sans JP", "Hiragino Sans", sans-serif;
    --ease: cubic-bezier(.16, 1, .3, 1);
  }
  * { box-sizing: border-box; }
  html { min-height: 100%; background: var(--bg); }
  body {
    min-height: 100%;
    margin: 0;
    background:
      radial-gradient(circle at 26% 18%, rgba(107, 53, 30, .11), transparent 32rem),
      var(--bg);
    color: var(--ink);
    font: 16px/1.55 var(--serif);
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }
  button, input { font: inherit; }
  button, label {
    touch-action: manipulation;
    -webkit-tap-highlight-color: rgba(168, 34, 41, .22);
  }
  button { color: inherit; }
  button:focus-visible, input:focus-visible, [role="button"]:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 4px;
  }
  .skip {
    position: fixed;
    z-index: 20;
    left: 12px;
    top: 12px;
    padding: 10px 14px;
    background: var(--ink);
    color: var(--bg);
    transform: translateY(-160%);
    transition: transform .2s var(--ease);
  }
  .skip:focus { transform: none; }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .stage {
    position: relative;
    min-height: 100svh;
    display: grid;
    grid-template-columns: minmax(540px, 52%) minmax(0, 48%);
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas:
      "header portrait"
      "content portrait"
      "footer footer";
    overflow: clip;
  }
  .title-view {
    position: absolute;
    z-index: 10;
    inset: 0;
    min-height: 100svh;
    display: grid;
    grid-template-columns: minmax(0, 52%) minmax(0, 48%);
    align-items: center;
    overflow: hidden;
    cursor: pointer;
    background:
      linear-gradient(90deg, rgba(8, 6, 4, .48), rgba(8, 6, 4, .08) 65%),
      url("./asset/entrance-doll-v1.png") 76% center / cover no-repeat;
    transition: opacity .58s var(--ease), transform .58s var(--ease);
  }
  .title-view[hidden] { display: none; }
  .title-view::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: #050403;
    opacity: 0;
    transition: opacity .58s var(--ease);
  }
  .title-view.is-leaving { opacity: 0; transform: scale(1.008); }
  .title-view.is-leaving::before { opacity: .72; }
  .title-lockup {
    position: relative;
    z-index: 1;
    grid-column: 1;
    width: min(82%, 620px);
    margin-left: max(42px, env(safe-area-inset-left));
    padding-block: max(34px, env(safe-area-inset-top)) max(34px, env(safe-area-inset-bottom));
    transition: opacity .5s var(--ease), transform .5s var(--ease);
  }
  .title-view.is-leaving .title-lockup { opacity: 0; transform: translateY(-8px); }
  .title-brand span { color: #a82229; }
  .title-brand {
    margin: 10px 0 22px;
    font-size: clamp(72px, 11vw, 154px);
    font-weight: 400;
    line-height: .95;
    letter-spacing: .12em;
    text-shadow: 0 4px 30px rgba(0, 0, 0, .62);
    white-space: nowrap;
  }
  .title-rule {
    width: min(100%, 430px);
    height: 1px;
    display: block;
    margin-bottom: 28px;
    background: linear-gradient(90deg, var(--gold), rgba(231, 207, 159, .08));
    transform-origin: left center;
    transition: opacity .5s var(--ease), transform .5s var(--ease);
  }
  .title-view.is-leaving .title-rule { opacity: 0; transform: scaleX(.35); }
  .title-start {
    min-width: min(100%, 300px);
    min-height: 68px;
    display: inline-flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    gap: 2px;
    padding: 12px 20px 12px 54px;
    position: relative;
    border: 1px solid var(--line-strong);
    background: rgba(8, 6, 4, .72);
    color: var(--ink);
    cursor: pointer;
    text-align: left;
    transition: background-color .24s var(--ease), border-color .24s var(--ease), transform .24s var(--ease);
  }
  .title-start::before {
    content: "";
    position: absolute;
    left: 21px;
    width: 17px;
    height: 17px;
    border: 1px solid var(--gold);
    background: var(--red-deep);
    transform: rotate(45deg);
  }
  .title-start:hover { border-color: var(--gold); background: rgba(97, 20, 25, .32); }
  .title-start:active { transform: translateY(1px); }
  .title-start[disabled] { cursor: wait; opacity: .58; }
  .title-start-main { font-size: 18px; letter-spacing: .08em; }
  .title-start-alt { color: var(--muted); font: 11px/1.4 var(--sans); letter-spacing: .04em; }
  .stage.is-title { height: 100svh; overflow: clip; }
  .stage.is-title .topbar, .stage.is-title .content, .stage.is-title .footer { visibility: hidden; }
  .topbar {
    grid-area: header;
    z-index: 2;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    padding: max(20px, env(safe-area-inset-top)) 38px 12px max(38px, env(safe-area-inset-left));
  }
  .brand {
    margin: 0;
    font-size: clamp(17px, 1.8vw, 23px);
    font-weight: 500;
    letter-spacing: .32em;
    white-space: nowrap;
  }
  .brand::after {
    content: "";
    display: block;
    width: 54px;
    height: 5px;
    margin-top: 7px;
    background: repeating-linear-gradient(120deg, var(--red) 0 5px, transparent 5px 9px);
  }
  .connection {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 44px;
    color: var(--muted);
    font: 11px/1.3 var(--sans);
    letter-spacing: .08em;
    text-align: right;
    border: 0;
    background: transparent;
    cursor: pointer;
  }
  .connection-dot {
    width: 8px;
    height: 8px;
    flex: 0 0 8px;
    border: 1px solid currentColor;
    transform: rotate(45deg);
  }
  .connection[data-state="online"] { color: var(--gold); }
  .connection[data-state="online"] .connection-dot { background: currentColor; }
  .connection[data-state="offline"] { color: var(--error); }
  .staff-label { margin-left: 6px; padding-left: 12px; border-left: 1px solid var(--line); color: var(--muted); }

  .portrait {
    grid-area: portrait;
    position: relative;
    min-width: 0;
    min-height: 0;
    margin: 0;
    background: #0d0907;
    overflow: hidden;
  }
  .portrait img, .portrait video {
    width: 100%;
    height: 100%;
    min-height: 560px;
    display: block;
    object-fit: cover;
    object-position: 95% center;
    filter: saturate(.84) contrast(1.04) brightness(.92);
  }
  .portrait video[hidden] { display: none; }
  .stage:not(.is-briefing) #doctorImage,
  .stage:not(.is-briefing) #doctorVideo,
  .stage.is-briefing #entranceImage { display: none; }
  #entranceImage { object-position: 79% center; }
  .portrait::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(90deg, var(--bg) 0, rgba(8, 6, 4, .22) 12%, transparent 35%),
      linear-gradient(180deg, rgba(8, 6, 4, .18), transparent 25%, transparent 70%, rgba(8, 6, 4, .7));
  }

  .content {
    grid-area: content;
    position: relative;
    z-index: 2;
    width: min(100%, 760px);
    min-width: 0;
    padding: 8px 42px 28px max(38px, env(safe-area-inset-left));
    align-self: center;
  }
  .stage.is-briefing .content {
    width: 100%;
    height: 100%;
    align-self: stretch;
  }
  h1 {
    margin: 0 0 20px;
    font-size: clamp(27px, 3vw, 42px);
    font-weight: 500;
    line-height: 1.18;
    letter-spacing: .12em;
    text-wrap: balance;
    scroll-margin-top: 24px;
  }
  .notice {
    margin-bottom: 22px;
    padding: 14px 0 15px;
    border-top: 1px solid var(--line-strong);
    border-bottom: 1px solid var(--line);
  }
  .eyebrow {
    display: block;
    margin-bottom: 7px;
    color: var(--gold);
    font: 11px/1.3 var(--sans);
    text-transform: uppercase;
    letter-spacing: .22em;
  }
  .notice-body {
    margin: 0;
    max-width: 44em;
    color: var(--ink);
    font-size: clamp(16px, 1.45vw, 19px);
    line-height: 1.65;
    letter-spacing: .025em;
    white-space: pre-line;
    overflow-wrap: anywhere;
  }
  .system-note {
    margin: -8px 0 18px;
    padding: 10px 12px;
    border-left: 2px solid var(--gold);
    background: rgba(231, 207, 159, .07);
    color: var(--ink);
    font-size: 15px;
  }

  .surface {
    transition: opacity .34s var(--ease), transform .34s var(--ease);
  }
  .surface:not(.is-active) {
    position: absolute;
    inset: 8px 42px 28px max(38px, env(safe-area-inset-left));
    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;
  }
  .surface[hidden] { display: none; }
  .settings { margin: 0; }
  fieldset {
    min-width: 0;
    margin: 0;
    padding: 0 0 17px;
    border: 0;
  }
  fieldset + fieldset {
    padding-top: 15px;
    border-top: 1px solid var(--line);
  }
  legend {
    width: 100%;
    margin: 0 0 9px;
    padding: 0;
    color: var(--muted);
    font: 12px/1.3 var(--sans);
    letter-spacing: .16em;
  }
  .choices {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }
  .choices.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .choice {
    position: relative;
    min-width: 0;
    min-height: 54px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid transparent;
    border-bottom-color: var(--line-strong);
    background: rgba(242, 232, 215, .02);
    cursor: pointer;
    transition:
      color .25s var(--ease),
      background-color .25s var(--ease),
      border-color .25s var(--ease),
      transform .25s var(--ease);
  }
  .choice:hover {
    border-color: var(--line-strong);
    background: rgba(242, 232, 215, .055);
  }
  .choice:active { transform: translateY(1px); }
  .choice::after {
    content: "";
    position: absolute;
    left: -1px;
    top: 12px;
    bottom: 12px;
    width: 3px;
    background: var(--red);
    transform: scaleY(0);
    transition: transform .35s var(--ease);
  }
  .choice:has(input:checked)::after { transform: scaleY(1); }
  .choice:focus-within { outline: 2px solid var(--gold); outline-offset: 3px; }
  .choice input {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    overflow: hidden;
  }
  .choice-text {
    min-width: 0;
    font-size: clamp(16px, 1.55vw, 20px);
    line-height: 1.2;
    letter-spacing: .035em;
    overflow-wrap: anywhere;
  }
  .choice-mark {
    width: 16px;
    height: 16px;
    margin-left: auto;
    flex: 0 0 16px;
    display: grid;
    place-items: center;
    border: 1px solid transparent;
    color: transparent;
    font: 11px/1 var(--sans);
    transform: rotate(45deg);
    transition:
      color .25s var(--ease),
      background-color .25s var(--ease),
      border-color .25s var(--ease);
  }
  .choice-mark::before { content: ""; width: 7px; height: 4px; border: solid currentColor; border-width: 0 0 1px 1px; transform: rotate(-90deg); }
  .choice:has(input:checked) {
    border-bottom-color: var(--gold);
    background: linear-gradient(100deg, rgba(168, 34, 41, .20), rgba(242, 232, 215, .035));
    color: #fff9ee;
  }
  .choice input:checked ~ .choice-mark {
    border-color: var(--gold);
    background: var(--red-deep);
    color: var(--ink);
  }
  .relief-description {
    min-height: 3.25em;
    margin: 9px 0 0 2px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-line;
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity .28s var(--ease), transform .28s var(--ease);
  }
  .relief-description.is-visible { opacity: 1; transform: none; }

  .result { padding-top: 2px; }
  .result-state {
    display: grid;
    grid-template-columns: 38px minmax(0, 1fr);
    gap: 12px 14px;
    align-items: center;
    margin-bottom: 22px;
  }
  .status-glyph {
    grid-row: 1 / span 2;
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border: 1px solid var(--line-strong);
    color: var(--ink);
    font: 17px/1 var(--sans);
    transform: rotate(45deg);
  }
  .status-glyph span { transform: rotate(-45deg); }
  .result[data-tone="ok"] .status-glyph {
    border-color: var(--gold);
    background: rgba(231, 207, 159, .11);
    color: var(--gold);
  }
  .result[data-tone="error"] .status-glyph {
    border-color: var(--error);
    color: var(--error);
  }
  .result-title {
    margin: 0;
    font-size: clamp(22px, 2.4vw, 32px);
    font-weight: 500;
    line-height: 1.25;
    letter-spacing: .07em;
    overflow-wrap: anywhere;
  }
  .result-detail {
    margin: 0;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.5;
    overflow-wrap: anywhere;
  }
  .values {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  .values th, .values td {
    padding: 11px 10px;
    border-bottom: 1px solid var(--line);
    text-align: left;
    overflow-wrap: anywhere;
  }
  .values thead th {
    color: var(--muted);
    font: 11px/1.3 var(--sans);
    letter-spacing: .12em;
  }
  .values thead th:first-child { width: 29%; }
  .values tbody th {
    color: var(--muted);
    font: 12px/1.3 var(--sans);
    font-weight: 400;
    letter-spacing: .08em;
  }
  .values td {
    color: var(--ink);
    font-size: clamp(16px, 1.7vw, 21px);
    font-variant-numeric: tabular-nums;
  }
  .result-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 20px;
  }
  .stage.is-result-ready .result,
  .stage.is-result-ready .portrait,
  .stage.is-result-ready .footer { cursor: pointer; }
  .secondary, .retry, .briefing-control {
    min-height: 50px;
    padding: 10px 17px;
    border: 1px solid var(--line-strong);
    background: rgba(242, 232, 215, .035);
    font-size: 16px;
    letter-spacing: .06em;
    cursor: pointer;
    transition:
      color .25s var(--ease),
      background-color .25s var(--ease),
      border-color .25s var(--ease),
      transform .25s var(--ease);
  }
  .secondary:hover, .retry:hover, .briefing-control:hover {
    border-color: var(--gold);
    background: rgba(242, 232, 215, .08);
  }
  .secondary:active, .retry:active, .briefing-control:active { transform: translateY(1px); }
  .secondary[disabled], .briefing-control[disabled] { cursor: default; opacity: .42; }
  .retry {
    border-color: var(--red);
    background: rgba(168, 34, 41, .16);
  }

  .briefing {
    height: 100%;
    min-height: 0;
    align-self: stretch;
    display: grid;
    grid-template-rows: auto minmax(190px, 1fr) auto;
    gap: 15px;
  }
  .briefing[hidden] { display: none; }
  .briefing[data-portrait="true"] { grid-template-rows: minmax(170px, 1fr) auto; }
  .briefing[data-portrait="true"] .briefing-copy { align-self: center; padding-block: 24px; }
  .briefing[data-portrait="true"] .briefing-title { font-size: clamp(28px, 3.6vw, 48px); line-height: 1.4; }
  .briefing[data-portrait="true"] .briefing-caption { margin-top: 20px; font-size: 17px; }
  .briefing-copy { min-width: 0; }
  .briefing-chapter {
    display: grid;
    grid-template-columns: auto auto minmax(28px, 1fr) auto;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    color: var(--gold);
    font: 11px/1.3 var(--sans);
    letter-spacing: .18em;
    transform-origin: left center;
  }
  .briefing-chapter-number, .briefing-cue-number { font-variant-numeric: tabular-nums; }
  .briefing-chapter-number {
    padding-left: 9px;
    border-left: 2px solid var(--gold);
    font-size: 20px;
    line-height: 1;
    letter-spacing: .08em;
  }
  .briefing-chapter .eyebrow { margin: 0; font-size: 12px; }
  .briefing-chapter-line {
    height: 1px;
    background: linear-gradient(90deg, var(--line-strong), rgba(242, 232, 215, .04));
    transform-origin: left center;
  }
  .briefing.is-chapter-changing .briefing-chapter { animation: chapter-copy-in .38s var(--ease); }
  .briefing.is-chapter-changing .briefing-chapter-line { animation: chapter-line-in .38s var(--ease); }
  @keyframes chapter-copy-in {
    from { opacity: 0; transform: translateX(var(--chapter-shift, 9px)); }
    to { opacity: 1; transform: none; }
  }
  @keyframes chapter-line-in {
    from { opacity: 0; transform: scaleX(.2); }
    to { opacity: 1; transform: none; }
  }
  .briefing-title {
    margin: 0;
    font-size: clamp(23px, 2.5vw, 34px);
    font-weight: 500;
    line-height: 1.22;
    letter-spacing: .07em;
    text-wrap: balance;
    overflow-wrap: anywhere;
  }
  .briefing-caption {
    margin: 7px 0 0;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.5;
    overflow-wrap: anywhere;
  }
  .briefing-visual {
    position: relative;
    min-width: 0;
    min-height: 190px;
    margin: 0;
    overflow: hidden;
    border-top: 1px solid var(--line-strong);
    border-bottom: 1px solid var(--line);
    background: #0d0907;
  }
  .briefing-image {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    opacity: 0;
    transform: scale(.995);
    transition: opacity .38s var(--ease), transform .38s var(--ease);
  }
  .briefing-visual[hidden] { display: none; }
  .briefing-image.is-visible { opacity: 1; transform: none; }
  .briefing-image[hidden] { display: none; }
  .briefing-intro {
    height: 100%;
    min-height: 190px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: clamp(24px, 5vw, 64px);
    background:
      linear-gradient(120deg, rgba(168, 34, 41, .13), transparent 42%),
      radial-gradient(circle at 82% 28%, rgba(231, 207, 159, .09), transparent 32%);
  }
  .briefing-intro[hidden] { display: none; }
  .briefing-role {
    margin: 0 0 10px;
    color: var(--gold);
    font: 11px/1.4 var(--sans);
    letter-spacing: .22em;
    text-transform: uppercase;
  }
  .briefing-intro-text {
    margin: 0;
    max-width: 28em;
    font-size: clamp(17px, 1.8vw, 22px);
    line-height: 1.7;
    text-wrap: balance;
    overflow-wrap: anywhere;
  }
  .briefing-progress {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    align-items: center;
    gap: 12px;
    color: var(--muted);
    font: 12px/1.3 var(--sans);
    font-variant-numeric: tabular-nums;
    letter-spacing: .1em;
  }
  .briefing-progress progress {
    width: 100%;
    height: 3px;
    border: 0;
    border-radius: 0;
    overflow: hidden;
    background: var(--line);
    color: var(--gold);
  }
  .briefing-progress progress::-webkit-progress-bar { background: var(--line); }
  .briefing-progress progress::-webkit-progress-value { background: var(--gold); }
  .briefing-progress progress::-moz-progress-bar { background: var(--gold); }
  .stage.is-briefing .briefing, .stage.is-briefing .portrait, .stage.is-briefing .subtitle {
    cursor: pointer;
    touch-action: manipulation;
  }

  .footer {
    grid-area: footer;
    position: relative;
    z-index: 3;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: end;
    gap: 30px;
    min-height: 126px;
    padding:
      20px
      max(38px, env(safe-area-inset-right))
      max(26px, env(safe-area-inset-bottom))
      max(38px, env(safe-area-inset-left));
    background: linear-gradient(180deg, transparent, rgba(8, 6, 4, .94) 43%);
  }
  .subtitle {
    justify-self: center;
    align-self: center;
    width: min(100%, 760px);
    min-height: 3.2em;
    position: relative;
    text-align: center;
    font-size: clamp(16px, 1.65vw, 21px);
    line-height: 1.6;
    letter-spacing: .04em;
    text-wrap: balance;
    text-shadow: 0 2px 14px #000;
  }
  .subtitle-reserve { visibility: hidden; }
  .subtitle-typed { position: absolute; inset: 0; }
  .primary {
    min-height: 62px;
    max-width: 320px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 13px;
    padding: 12px 19px;
    border: 1px solid var(--line-strong);
    background: rgba(8, 6, 4, .72);
    font-size: clamp(16px, 1.55vw, 20px);
    line-height: 1.25;
    letter-spacing: .08em;
    text-align: left;
    cursor: pointer;
    transition:
      color .28s var(--ease),
      background-color .28s var(--ease),
      border-color .28s var(--ease),
      transform .28s var(--ease);
  }
  .primary::before {
    content: "";
    width: 19px;
    height: 19px;
    flex: 0 0 19px;
    border: 1px solid var(--gold);
    background: var(--red-deep);
    transform: rotate(45deg);
  }
  .primary:hover {
    border-color: var(--gold);
    background: rgba(97, 20, 25, .36);
  }
  .primary:active { transform: translateY(1px); }
  .primary[disabled] { cursor: wait; opacity: .52; }
  .primary[hidden] { display: none; }
  .briefing-controls {
    min-width: 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 8px;
  }
  .briefing-controls[hidden] { display: none; }
  .briefing-control {
    min-height: 48px;
    padding: 9px 14px;
    font-size: 14px;
    line-height: 1.3;
    letter-spacing: .04em;
  }
  .briefing-control[data-action="toggle"] { border-color: var(--gold); }
  .briefing-replay { margin-left: auto; }

  .staff-dialog {
    width: min(92vw, 520px);
    max-height: min(86vh, 700px);
    padding: 26px;
    border: 1px solid var(--line-strong);
    background: #0d0a07;
    color: var(--ink);
    box-shadow: 0 28px 80px rgba(0, 0, 0, .7);
    overscroll-behavior: contain;
  }
  .staff-dialog::backdrop { background: rgba(0, 0, 0, .72); }
  .staff-dialog h2 {
    margin: 0 42px 18px 0;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: .08em;
  }
  .staff-close {
    position: absolute;
    top: 15px;
    right: 15px;
    width: 44px;
    height: 44px;
    border: 1px solid var(--line);
    background: transparent;
    cursor: pointer;
  }
  .staff-summary {
    min-height: 8em;
    margin: 0 0 16px;
    padding: 14px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    color: var(--muted);
    font: 13px/1.8 ui-monospace, Consolas, monospace;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .staff-message {
    min-height: 1.6em;
    margin: 10px 0;
    color: var(--gold);
    font: 13px/1.6 var(--sans);
  }
  .staff-clear {
    min-height: 48px;
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--red);
    background: rgba(168, 34, 41, .14);
    color: var(--ink);
    cursor: pointer;
  }
  .staff-clear[disabled] { opacity: .45; cursor: default; }

  @media (max-width: 980px) {
    .stage { grid-template-columns: minmax(500px, 58%) minmax(0, 42%); }
    .topbar { padding-left: 26px; padding-right: 22px; }
    .content { padding-left: 26px; padding-right: 28px; }
    .surface:not(.is-active) { left: 26px; right: 28px; }
    .choice { padding-inline: 9px; }
    .footer { padding-left: 26px; padding-right: 26px; }
    .briefing-control { padding-inline: 11px; }
  }

  @media (max-aspect-ratio: 4/5), (max-width: 720px) {
    .stage {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto clamp(190px, 30vh, 330px) auto auto;
      grid-template-areas:
        "header"
        "portrait"
        "content"
        "footer";
      overflow: visible;
    }
    .title-view {
      position: fixed;
      grid-template-columns: minmax(0, 1fr);
      align-items: end;
      background:
        linear-gradient(180deg, rgba(8, 6, 4, .08) 0 34%, rgba(8, 6, 4, .92) 72%, var(--bg) 100%),
        url("./asset/entrance-doll-v1.png") 76% 26% / cover no-repeat;
    }
    .title-lockup {
      grid-column: 1;
      width: auto;
      margin: 0;
      padding:
        32px
        max(24px, env(safe-area-inset-right))
        max(36px, env(safe-area-inset-bottom))
        max(24px, env(safe-area-inset-left));
    }
    .title-brand { font-size: clamp(64px, 18vw, 112px); }
    .topbar {
      padding:
        max(15px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        12px
        max(20px, env(safe-area-inset-left));
    }
    .portrait img, .portrait video {
      min-height: 0;
      object-position: 54% 31%;
    }
    .portrait::after {
      background: linear-gradient(180deg, rgba(8, 6, 4, .15), transparent 46%, var(--bg));
    }
    .content {
      width: 100%;
      padding:
        8px
        max(24px, env(safe-area-inset-right))
        26px
        max(24px, env(safe-area-inset-left));
    }
    .stage.is-briefing .content { height: auto; }
    .stage.is-briefing { grid-template-rows: auto clamp(120px, 18svh, 210px) minmax(0, 1fr) auto; }
    .stage.is-briefing .content { padding-bottom: 16px; }
    .stage.is-briefing .footer { padding-top: 12px; gap: 10px; }
    .surface:not(.is-active) {
      inset:
        0
        max(24px, env(safe-area-inset-right))
        0
        max(24px, env(safe-area-inset-left));
    }
    h1 { margin-bottom: 16px; }
    .notice { margin-bottom: 18px; }
    .footer {
      grid-template-columns: minmax(0, 1fr);
      gap: 14px;
      min-height: 0;
      padding:
        18px
        max(24px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(24px, env(safe-area-inset-left));
      background: var(--bg);
    }
    .subtitle {
      justify-self: stretch;
      min-height: 3.2em;
    }
    .primary {
      width: 100%;
      max-width: none;
      justify-self: stretch;
    }
    .briefing {
      height: auto;
      grid-template-rows: auto minmax(150px, 30svh) auto;
    }
    .briefing-controls { justify-content: stretch; }
    .briefing-control { flex: 1 1 calc(50% - 8px); }
    .briefing-replay { flex-basis: 100%; margin-left: 0; }
  }

  @media (max-width: 500px) {
    .brand { font-size: 16px; }
    .connection { max-width: 46%; font-size: 10px; }
    .stage { grid-template-rows: auto 180px auto auto; }
    .content {
      padding-left: max(18px, env(safe-area-inset-left));
      padding-right: max(18px, env(safe-area-inset-right));
    }
    .surface:not(.is-active) {
      left: max(18px, env(safe-area-inset-left));
      right: max(18px, env(safe-area-inset-right));
    }
    h1 { font-size: 27px; }
    .notice-body { font-size: 16px; line-height: 1.58; }
    .choices {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
    }
    .choice { min-height: 62px; padding: 10px 5px; justify-content: center; gap: 5px; flex-wrap: wrap; }
    .choice-mark { position: absolute; bottom: -1px; right: -1px; width: 9px; height: 3px; transform: none; border: 0; }
    .choice-mark::before { content: none; }
    .choice input:checked ~ .choice-mark { width: 100%; background: var(--gold); }
    .relief-description { min-height: 3.2em; }
    .values th, .values td { padding-inline: 6px; }
    .values thead th:first-child { width: 26%; }
    .footer {
      padding-left: max(18px, env(safe-area-inset-left));
      padding-right: max(18px, env(safe-area-inset-right));
    }
    .stage.is-briefing { grid-template-rows: auto 110px auto auto; }
    .briefing { grid-template-rows: auto minmax(145px, 24svh) auto; gap: 10px; }
    .briefing-visual { min-height: 145px; }
    .title-brand { font-size: clamp(54px, 19vw, 82px); }
    .title-start { width: 100%; }
    .briefing-chapter { grid-template-columns: auto minmax(0, auto) minmax(20px, 1fr) auto; gap: 7px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      scroll-behavior: auto !important;
      transition-duration: .01ms !important;
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
    }
  }
  /* With no reference image, the doctor occupies the central frame. */
  .stage.is-briefing.is-doctor-only {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(420px, 1fr) auto;
    grid-template-areas: "header" "content" "footer";
  }
  .stage.is-doctor-only .portrait { grid-area: content; }
  .stage.is-doctor-only .content { height: 100%; }
  .stage.is-doctor-only .portrait img,
  .stage.is-doctor-only .portrait video {
    position: absolute;
    left: 50%;
    width: auto;
    max-width: none;
    height: 100%;
    max-height: 680px;
    bottom: 0;
    mask-image: linear-gradient(180deg, transparent, #000 12%, #000 85%, transparent);
    min-height: 0;
    transform: translateX(-70%);
  }
  .stage.is-doctor-only .portrait::after {
    background: linear-gradient(180deg, rgba(8, 6, 4, .35), transparent 30%, transparent 65%, var(--bg));
  }
  .stage.is-doctor-only .briefing { height: 100%; grid-template-rows: auto 1fr auto; }
  .stage.is-doctor-only .briefing-copy { align-self: start; padding-block: 10px; width: min(100%, 360px); }
  .stage.is-doctor-only .briefing-title {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
  }
  .stage.is-doctor-only .briefing-caption { margin-top: 8px; font-size: 14px; }
  .stage.is-doctor-only .briefing-progress { grid-row: 3; }
</style>
</head>
<body>
<a class="skip" href="#main" hidden>設定へ移動</a>
<div class="stage is-title">
  <section class="title-view is-active" id="titleView" aria-labelledby="titleBrand">
    <div class="title-lockup">
      <h1 class="title-brand" id="titleBrand" translate="no">廻リ<span>視</span></h1>
      <span class="title-rule" aria-hidden="true"></span>
      <button class="title-start" id="titleStart" type="button" aria-label="タップして始める。Tap to begin. Touchez pour commencer.">
        <span class="title-start-main">タップして始める</span>
        <span class="title-start-alt"><span lang="en">Tap to begin</span> · <span lang="fr">Touchez pour commencer</span></span>
      </button>
    </div>
  </section>
  <header class="topbar">
    <p class="brand" translate="no">廻リ視</p>
    <button class="connection" id="staffToggle" data-state="checking" type="button" aria-haspopup="dialog" aria-label="スタッフ情報を開く">
      <span class="connection-dot" aria-hidden="true"></span>
      <span id="connectionText" role="status" aria-live="polite">接続を確認中…</span>
      <span class="staff-label" id="staffLabel">スタッフ</span>
    </button>
  </header>

  <figure class="portrait" aria-hidden="true">
    <img id="entranceImage" src="./asset/entrance-doll-v1.png" alt="" width="1672" height="941" draggable="false" fetchpriority="high">
    <img id="doctorImage" src="./asset/doctor.jpg" alt="" width="1672" height="941" draggable="false">
    <video id="doctorVideo" playsinline preload="metadata" hidden></video>
  </figure>

  <main class="content" id="main">
    <section class="surface settings" id="settingsView" aria-labelledby="pageTitle" aria-hidden="true" hidden inert>
      <h1 id="pageTitle">体験の前に</h1>
      <div class="notice" id="notice">
        <span class="eyebrow" id="noticeLabel">注意</span>
        <p class="notice-body" id="noticeBody"></p>
      </div>
      <p class="system-note" id="restartNotice" role="status" hidden></p>

      <form class="settings" id="settingsForm">
        <fieldset>
          <legend id="languageLegend">言語</legend>
          <div class="choices">
            <label class="choice">
              <input type="radio" name="lang" value="ja" checked>
              <span class="choice-text">日本語</span>
              <span class="choice-mark" aria-hidden="true"></span>
            </label>
            <label class="choice">
              <input type="radio" name="lang" value="en">
              <span class="choice-text">English</span>
              <span class="choice-mark" aria-hidden="true"></span>
            </label>
            <label class="choice">
              <input type="radio" name="lang" value="fr">
              <span class="choice-text">Français</span>
              <span class="choice-mark" aria-hidden="true"></span>
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend id="reliefLegend">ホラー軽減</legend>
          <div class="choices two">
            <label class="choice">
              <input type="radio" name="relief" value="off" checked>
              <span class="choice-text" id="reliefOff">なし</span>
              <span class="choice-mark" aria-hidden="true"></span>
            </label>
            <label class="choice">
              <input type="radio" name="relief" value="on">
              <span class="choice-text" id="reliefOn">あり</span>
              <span class="choice-mark" aria-hidden="true"></span>
            </label>
          </div>
          <p class="relief-description" id="reliefDesc" aria-hidden="true"></p>
        </fieldset>
      </form>
    </section>

    <section class="surface result" id="resultView" aria-labelledby="resultTitle" aria-hidden="true" hidden inert>
      <div class="result-state" role="status" aria-live="polite" aria-atomic="true">
        <div class="status-glyph" aria-hidden="true"><span id="resultGlyph">…</span></div>
        <h2 class="result-title" id="resultTitle" tabindex="-1">送信中</h2>
        <p class="result-detail" id="resultDetail"></p>
      </div>
      <table class="values">
        <thead>
          <tr>
            <th scope="col"><span class="sr-only" id="itemHeading">項目</span></th>
            <th scope="col" id="selectedHeading">選んだ設定</th>
            <th scope="col" id="headsetHeading">ヘッドセット</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row" id="resultLanguageLabel">言語</th>
            <td id="selectedLanguage">日本語</td>
            <td id="headsetLanguage">—</td>
          </tr>
          <tr>
            <th scope="row" id="resultReliefLabel">ホラー軽減</th>
            <td id="selectedRelief">なし</td>
            <td id="headsetRelief">—</td>
          </tr>
        </tbody>
      </table>
      <div class="result-actions">
        <button class="retry" id="retryBtn" type="button" hidden>もう一度送る</button>
        <button class="retry" id="briefingRetryBtn" type="button" hidden>説明資料を再読み込み</button>
        <button class="secondary" id="briefingStartBtn" type="button" hidden>博士からの説明へ</button>
        <button class="secondary" id="editBtn" type="button" hidden>設定を変える</button>
      </div>
    </section>

    <section class="surface briefing" id="briefingView" role="button" tabindex="0" aria-labelledby="briefingTitle" aria-describedby="briefingAdvanceHint" aria-hidden="true" hidden inert>
      <span class="sr-only" id="briefingAdvanceHint">次の文へ進む</span>
      <div class="briefing-copy">
        <div class="briefing-chapter">
          <span class="briefing-chapter-number" id="briefingChapterNumber"></span>
          <span class="eyebrow" id="briefingEyebrow"></span>
          <span class="briefing-chapter-line" aria-hidden="true"></span>
          <span class="briefing-cue-number" id="briefingCueNumber"></span>
        </div>
        <h2 class="briefing-title" id="briefingTitle" tabindex="-1"></h2>
        <p class="briefing-caption" id="briefingCaption"></p>
      </div>
      <figure class="briefing-visual">
        <img class="briefing-image" id="briefingImage" alt="" draggable="false" width="1600" height="900" hidden>
        <div class="briefing-intro" id="briefingIntro" hidden>
          <p class="briefing-role" id="briefingRole"></p>
          <p class="briefing-intro-text" id="briefingIntroText"></p>
        </div>
      </figure>
      <div class="briefing-progress">
        <span id="sceneCounter"></span>
        <progress id="sceneProgress" value="0" max="1"></progress>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="subtitle" id="subtitle" aria-hidden="true">
      <span class="subtitle-reserve" id="subtitleReserve"></span>
      <span class="subtitle-typed"><span id="subtitleTyped"></span></span>
    </div>
    <p class="sr-only" id="subtitleAnnouncement" role="status" aria-live="polite" aria-atomic="true"></p>
    <button class="primary" id="sendBtn" type="submit" form="settingsForm">
      <span id="submitLabel">この設定で始める</span>
    </button>
    <div class="briefing-controls" id="briefingControls" hidden>
      <button class="briefing-control" id="briefingToggle" data-action="toggle" type="button" aria-pressed="false">AUTO OFF</button>
      <button class="briefing-control" id="briefingPrevious" type="button">前の文</button>
      <button class="briefing-control" id="briefingNext" type="button">次の文</button>
      <button class="briefing-control" id="briefingSettings" type="button">設定に戻る</button>
      <button class="briefing-control briefing-replay" id="briefingReplay" type="button" hidden>もう一度説明を見る</button>
    </div>
  </footer>
</div>

<dialog class="staff-dialog" id="staff">
  <button class="staff-close" id="staffClose" type="button" aria-label="閉じる">×</button>
  <h2>スタッフ情報</h2>
  <div class="staff-summary" id="staffSummary">読み込み中…</div>
  <p class="staff-message" id="staffMessage" role="status" aria-live="polite"></p>
  <button class="staff-clear" id="clearBtn" type="button">予約を取り消す</button>
</dialog>

  const LANG_NAME = { ja: '日本語', en: 'English', fr: 'Français' };
  const BRIEFING_LANGS = Object.keys(LANG_NAME);
  const $ = (id) => document.getElementById(id);
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');

  let surfaceTimer = null;

  function setText(id, text) {

  function setSubtitle(text, key) {
    if (state.subtitleKey === key) return;
    state.subtitleKey = key;
    $('subtitleReserve').textContent = text;
    $('subtitleAnnouncement').textContent = text;
    $('subtitleTyped').textContent = text;

  function syncViewChrome(view) {
    $('sendBtn').hidden = view !== 'edit';
    $('briefingControls').hidden = view !== 'briefing';
    const stage = document.querySelector('.stage');
    stage.classList.toggle('is-title', view === 'title');
    stage.classList.toggle('is-briefing', view === 'briefing');
    if (view !== 'result') stage.classList.remove('is-result-ready');
    if (view !== 'briefing') stage.classList.remove('is-doctor-only');
    document.querySelector('.footer').classList.toggle('is-briefing', view === 'briefing');
    document.querySelector('.topbar').inert = view === 'title';
    document.querySelector('.footer').inert = view === 'title';
    document.querySelector('.skip').hidden = view === 'title';
  }

  function setSurface(view, focusTarget) {
    const surfaces = { title: $('titleView'), edit: $('settingsView'), result: $('resultView'), briefing: $('briefingView') };
    const current = surfaces[view];
    syncViewChrome(view);
    if (state.view === view && !current.hidden) {
      if (view === 'title') {
        current.classList.remove('is-leaving');
        $('titleStart').disabled = false;
        state.titleTransitioning = false;
      }
      if (focusTarget) focusTarget.focus();
      return;
    }
    if (surfaceTimer) clearTimeout(surfaceTimer);
    const oldSurface = surfaces[state.view];
    const newSurface = surfaces[view];
    for (const surface of Object.values(surfaces)) {
      if (surface !== oldSurface && surface !== newSurface) {
        surface.hidden = true;
        surface.inert = true;
        surface.classList.remove('is-active');
        surface.setAttribute('aria-hidden', 'true');
      }
    }
    state.view = view;
    oldSurface.classList.remove('is-active');
    oldSurface.setAttribute('aria-hidden', 'true');
    oldSurface.inert = true;
    newSurface.hidden = false;
    newSurface.removeAttribute('aria-hidden');
    newSurface.inert = false;
    if (view === 'title') {
      newSurface.classList.remove('is-leaving');
      $('titleStart').disabled = false;
      state.titleTransitioning = false;
    }
    void newSurface.offsetWidth;
    newSurface.classList.add('is-active');
    surfaceTimer = setTimeout(() => { oldSurface.hidden = true; }, reducedMotion.matches ? 0 : 360);
    if (focusTarget) focusTarget.focus();
  }

  function beginFromTitle() {
    if (state.view !== 'title' || state.titleTransitioning) return;
    state.titleTransitioning = true;
    $('titleStart').disabled = true;
    const finish = () => {
      titleTimer = null;
      setSurface('edit', document.querySelector(`input[name="lang"][value="${state.lang}"]`));
      $('titleView').hidden = true;
      render();
    };
    if (reducedMotion.matches) {
      finish();
      return;
    }
    $('titleView').classList.add('is-leaving');
    titleTimer = setTimeout(finish, 600);
  }

  function resetVisitorSession(restarted = false) {
    if (titleTimer) clearTimeout(titleTimer);
    titleTimer = null;
    state.sent = null;
    state.ui = 'idle';
    state.appliedSeen = false;
    state.leftWaitAfterApplied = false;
    state.restartMessage = restarted;
    resetBriefingSession();
    setDraft('ja', false);
    setFormDisabled(false);
    setSurface('title');
    render();

  function setFormDisabled(disabled) {
    $('settingsForm').querySelectorAll('input, button').forEach((control) => { control.disabled = disabled; });
    $('sendBtn').disabled = disabled;

    document.querySelector(`input[name="lang"][value="${lang}"]`).checked = true;

    $('reliefLegend').textContent = t.relief;

    $('briefingRetryBtn').textContent = t.briefing.retry;
    $('briefingStartBtn').textContent = t.briefing.start;
    $('briefingPrevious').textContent = t.briefing.previous;
    $('briefingNext').textContent = t.briefing.next;

    $('briefingReplay').textContent = t.briefing.replay;
    $('briefingAdvanceHint').textContent = t.briefing.advance;

    $('resultReliefLabel').textContent = t.relief;
    $('connectionText').textContent = t.connection[state.connection];
    $('restartNotice').textContent = t.restarted;
    $('restartNotice').hidden = !state.restartMessage;
    if (state.view === 'title') setSubtitle('', 'title');
    if (state.view === 'edit') setSubtitle(t.ask, `ask:${state.lang}`);

  function renderReliefDescription() {
    $('reliefDesc').classList.toggle('is-visible', state.relief);
    $('reliefDesc').setAttribute('aria-hidden', String(!state.relief));
  }

  function isRecord(value) {
    return value != null && typeof value === 'object' && !Array.isArray(value);
  }

  function validAssetFilename(value) {
    return typeof value === 'string'
      && /^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(value)
      && !value.includes('..');
  }

  function validLocalizedText(value) {
    return isRecord(value)
      && BRIEFING_LANGS.every((lang) => typeof value[lang] === 'string' && value[lang].trim().length > 0);
  }

  function validateBriefingData(data) {
    if (!isRecord(data) || data.schemaVersion !== 1 || !Array.isArray(data.scenes) || data.scenes.length === 0) {
      throw new Error('invalid briefing root');
    }
    const ids = new Set();
    for (const scene of data.scenes) {
      if (!isRecord(scene) || typeof scene.id !== 'string' || scene.id.trim().length === 0 || ids.has(scene.id)) {
        throw new Error('invalid briefing scene id');
      }
      ids.add(scene.id);
      if (!validAssetFilename(scene.image)
        || !validLocalizedText(scene.alt)
        || !validLocalizedText(scene.eyebrow)
        || !validLocalizedText(scene.title)
        || !validLocalizedText(scene.caption)
        || !isRecord(scene.cues)) {
        throw new Error(`invalid briefing scene: ${scene.id}`);
      }
      for (const lang of BRIEFING_LANGS) {
        const cues = scene.cues[lang];
        if (!Array.isArray(cues) || cues.length === 0 || cues.some((cue) => (
          !isRecord(cue)
          || typeof cue.text !== 'string'
          || cue.text.trim().length === 0
          || !Number.isFinite(cue.durationMs)
          || cue.durationMs <= 0
        ))) {
          throw new Error(`invalid briefing cues: ${scene.id}/${lang}`);
        }
      }
      for (const mediaType of ['audio', 'video']) {
        if (scene[mediaType] == null) continue;
        if (!isRecord(scene[mediaType])
          || Object.entries(scene[mediaType]).some(([lang, filename]) => (
            !BRIEFING_LANGS.includes(lang) || !validAssetFilename(filename)
          ))) {
          throw new Error(`invalid briefing ${mediaType}: ${scene.id}`);
        }
      }
    }
    return data;
  }

  function assetPath(filename) {
    return `./asset/${encodeURIComponent(filename)}`;
  }

  function preloadBriefingImage(filename) {
    return new Promise((resolve, reject) => {
      const image = new Image();
      let settled = false;
      let timeout = null;
      const finish = (callback) => {
        if (settled) return;
        settled = true;
        clearTimeout(timeout);
        image.onload = null;
        image.onerror = null;
        callback();
      };
      image.onload = () => finish(resolve);
      image.onerror = () => finish(() => reject(new Error(`image failed: ${filename}`)));
      timeout = setTimeout(() => finish(() => reject(new Error(`image timeout: ${filename}`))), 6000);
      image.src = assetPath(filename);
    });
  }

  async function loadBriefingData() {
    if (state.view === 'briefing' || state.briefing.loadState === 'loading' && briefingController) return;
    state.briefing.loadState = 'loading';
    state.briefing.data = null;
    if (state.view === 'result') renderResult();
    const controller = new AbortController();
    briefingController = controller;
    try {
      const data = validateBriefingData(await fetchWithTimeout(
        './asset/briefing-v1.json',
        { cache: 'no-store' },
        controller,
        false,
      ));
      await Promise.all([...new Set(data.scenes.map((scene) => scene.image))].map(preloadBriefingImage));
      if (briefingController !== controller) return;
      state.briefing.data = data;
      state.briefing.loadState = 'ready';
    } catch (error) {
      if (briefingController !== controller) return;
      console.warn('briefing failed', error);
      state.briefing.loadState = 'error';
      state.briefing.data = null;
    } finally {
      if (briefingController === controller) briefingController = null;
    }
    if (state.view === 'result') renderResult();
  }

  function currentBriefingScene() {
    return state.briefing.data?.scenes[state.briefing.sceneIndex] || null;
  }

  function currentBriefingCue() {
    return currentBriefingScene()?.cues[state.lang]?.[state.briefing.cueIndex] || null;
  }

  function clearBriefingTimer() {
    if (briefingTimer) clearTimeout(briefingTimer);
    briefingTimer = null;
  }

  function clearBriefingMediaTimer() {
    if (briefingMediaTimer) clearTimeout(briefingMediaTimer);
    briefingMediaTimer = null;
  }

  function briefingPositions() {
    if (!state.briefing.data) return [];
    return state.briefing.data.scenes.flatMap((scene, sceneIndex) => (
      scene.cues[state.lang].map((cue, cueIndex) => ({ sceneIndex, cueIndex, cue }))
    ));
  }

  function currentBriefingPosition() {
    const positions = briefingPositions();
    return positions.findIndex((position) => (
      position.sceneIndex === state.briefing.sceneIndex && position.cueIndex === state.briefing.cueIndex
    ));
  }

  function cueStartMs(scene, cueIndex) {
    return scene.cues[state.lang]
      .slice(0, cueIndex)
      .reduce((total, cue) => total + cue.durationMs, 0);
  }

  function stopBriefingMediaWindow() {
    clearBriefingMediaTimer();
    state.briefing.mediaWindowActive = false;
    briefingMedia?.pause();
  }

  function stopBriefingMedia() {
    briefingMediaToken += 1;
    stopBriefingMediaWindow();
    if (briefingMedia) {
      briefingMedia.onerror = null;
      briefingMedia.onloadedmetadata = null;
      briefingMedia.ontimeupdate = null;
      briefingMedia.onended = null;
      briefingMedia.pause();
      if (briefingMedia === $('doctorVideo')) {
        briefingMedia.removeAttribute('src');
        briefingMedia.load();
      }
    }
    briefingMedia = null;
    briefingMediaSceneId = '';
    $('doctorVideo').hidden = true;
    $('doctorImage').hidden = false;
  }

  function setBriefingAuto(enabled, restartMedia = false) {
    const allowed = enabled
      && state.view === 'briefing'
      && !state.briefing.ended
      && state.briefing.pauseReasons.size === 0;
    state.briefing.auto = allowed;
    clearBriefingTimer();
    if (allowed) {
      if (restartMedia) startBriefingMediaWindow();
      const cue = currentBriefingCue();
      if (cue && !briefingMedia) briefingTimer = setTimeout(() => moveBriefing(1, 'auto'), cue.durationMs);
    }
    renderBriefingControls();
  }

  function handleBriefingMediaFailure() {
    if (state.view !== 'briefing' || state.briefing.mediaFailed) return;
    state.briefing.mediaFailed = true;
    setBriefingAuto(false);
    stopBriefingMedia();
    renderBriefingControls();
  }

  function configureBriefingMedia(scene) {
    if (briefingMediaSceneId === scene.id && briefingMedia) return;
    stopBriefingMedia();
    state.briefing.mediaFailed = false;
    const videoFilename = scene.video?.[state.lang];
    const audioFilename = scene.audio?.[state.lang];
    if (videoFilename) {
      const video = $('doctorVideo');
      video.src = assetPath(videoFilename);
      video.hidden = false;
      $('doctorImage').hidden = true;
      video.onerror = handleBriefingMediaFailure;
      video.load();
      briefingMedia = video;
    } else if (audioFilename) {
      const audio = new Audio(assetPath(audioFilename));
      audio.preload = 'auto';
      audio.onerror = handleBriefingMediaFailure;
      briefingMedia = audio;
    }
    briefingMediaSceneId = briefingMedia ? scene.id : '';
  }

  function startBriefingMediaWindow() {
    stopBriefingMediaWindow();
    if (!briefingMedia
      || state.briefing.mediaFailed
      || state.briefing.ended
      || state.briefing.pauseReasons.size > 0) return;
    const scene = currentBriefingScene();
    const cue = currentBriefingCue();
    if (!scene || !cue) return;
    const startSec = cueStartMs(scene, state.briefing.cueIndex) / 1000;
    const endSec = startSec + cue.durationMs / 1000;
    const media = briefingMedia;
    const token = ++briefingMediaToken;
    state.briefing.mediaWindowActive = true;
    const reachBoundary = () => {
      if (briefingMedia !== media || briefingMediaToken !== token) return;
      if (state.briefing.auto) moveBriefing(1, 'auto');
      else stopBriefingMediaWindow();
    };
    media.ontimeupdate = () => {
      if (state.briefing.mediaWindowActive && media.currentTime >= endSec - .03) reachBoundary();
    };
    media.onended = () => {
      if (briefingMedia !== media || briefingMediaToken !== token) return;
      if (media.currentTime >= endSec - .03) reachBoundary();
      else handleBriefingMediaFailure();
    };
    const playSegment = () => {
      if (briefingMedia !== media || briefingMediaToken !== token || !state.briefing.mediaWindowActive) return;
      clearBriefingMediaTimer();
      try {
        media.currentTime = startSec;
      } catch (error) {
        handleBriefingMediaFailure();
        return;
      }
      const attempt = media.play();
      if (attempt?.catch) attempt.catch(() => {
        if (briefingMedia === media && briefingMediaToken === token) handleBriefingMediaFailure();
      });
    };
    if (media.readyState >= 1) playSegment();
    else {
      media.onloadedmetadata = playSegment;
      briefingMediaTimer = setTimeout(handleBriefingMediaFailure, 6000);
    }
  }

  function setBriefingPause(reason, paused) {
    if (paused) {
      state.briefing.pauseReasons.add(reason);
      setBriefingAuto(false);
      stopBriefingMediaWindow();
    } else {
      state.briefing.pauseReasons.delete(reason);
    }
    renderBriefingControls();
  }

  function renderBriefingControls() {
    const scene = currentBriefingScene();
    if (!scene) return;
    const t = T[state.lang].briefing;
    const positions = briefingPositions();
    const position = currentBriefingPosition();
    const complete = state.briefing.ended || position === positions.length - 1;
    $('briefingToggle').textContent = state.lang === 'ja'
      ? `オート ${state.briefing.auto ? 'ON' : 'OFF'}`
      : (state.briefing.auto ? t.autoOn : t.autoOff);
    $('briefingToggle').setAttribute('aria-label', $('briefingToggle').textContent);
    $('briefingToggle').setAttribute('aria-pressed', String(state.briefing.auto));
    $('briefingToggle').disabled = state.briefing.ended || state.briefing.pauseReasons.size > 0;
    $('briefingToggle').hidden = complete;
    $('briefingPrevious').disabled = position <= 0;
    $('briefingNext').disabled = state.briefing.ended || positions.length === 0;
    $('briefingNext').hidden = complete;
    $('briefingReplay').hidden = !complete;
  }

  function renderBriefingScene() {
    const scene = currentBriefingScene();
    if (!scene) return;
    const t = T[state.lang].briefing;
    const sceneTotal = state.briefing.data.scenes.length;
    const cues = scene.cues[state.lang];
    const positions = briefingPositions();
    const position = currentBriefingPosition();
    setText('briefingChapterNumber', String(state.briefing.sceneIndex + 1).padStart(2, '0'));
    setText('briefingEyebrow', scene.eyebrow[state.lang]);
    setText('briefingCueNumber', `${state.briefing.cueIndex + 1} / ${cues.length}`);
    setText('briefingTitle', scene.title[state.lang]);
    setText('briefingCaption', scene.caption[state.lang]);
    document.title = `廻リ視 — ${scene.title[state.lang]}`;
    $('briefingRole').textContent = t.role;
    $('briefingIntroText').textContent = scene.caption[state.lang];
    const intro = scene.image === 'doctor.jpg';
    document.querySelector('.stage').classList.toggle('is-doctor-only', intro);
    if (intro) setText('briefingEyebrow', scene.title[state.lang]);
    $('briefingView').dataset.portrait = String(intro);
    document.querySelector('.briefing-visual').hidden = intro;
    $('briefingIntro').hidden = !intro;
    const image = $('briefingImage');
    const wasHidden = image.hidden;
    image.hidden = intro;
    if (!intro) {
      image.alt = scene.alt[state.lang];
      const source = assetPath(scene.image);
      if (image.getAttribute('src') !== source || wasHidden) {
        image.classList.remove('is-visible');
        image.onload = () => image.classList.add('is-visible');
        image.src = source;
        if (image.complete) requestAnimationFrame(() => image.classList.add('is-visible'));
      }
    }
    $('sceneCounter').textContent = `${state.briefing.sceneIndex + 1} / ${sceneTotal} · ${state.briefing.cueIndex + 1} / ${cues.length}`;
    $('sceneProgress').max = Math.max(1, positions.length);
    $('sceneProgress').value = state.briefing.ended ? positions.length : position + 1;
    $('sceneProgress').setAttribute('aria-label', t.progress);
    renderBriefingControls();
  }

  function beginBriefingCue() {
    const scene = currentBriefingScene();
    const cue = currentBriefingCue();
    if (!scene || !cue) return;
    clearBriefingTimer();
    setSubtitle(cue.text, `briefing:${scene.id}:${state.lang}:${state.briefing.cueIndex}`);
    renderBriefingScene();
    startBriefingMediaWindow();
    if (state.briefing.auto) setBriefingAuto(true);
  }

  function playChapterTransition(direction) {
    if (chapterTimer) clearTimeout(chapterTimer);
    state.briefing.chapterChanging = true;
    const view = $('briefingView');
    view.classList.remove('is-chapter-changing');
    view.style.setProperty('--chapter-shift', direction < 0 ? '-9px' : '9px');
    void view.offsetWidth;
    view.classList.add('is-chapter-changing');
    chapterTimer = setTimeout(() => {
      chapterTimer = null;
      state.briefing.chapterChanging = false;
      view.classList.remove('is-chapter-changing');
      const pending = state.briefing.pendingMove;
      state.briefing.pendingMove = 0;
      if (pending) moveBriefing(pending, 'queued');
    }, reducedMotion.matches ? 0 : 380);
  }

  function moveBriefing(delta, source = 'control') {
    if (state.view !== 'briefing' || !state.briefing.data || delta === 0) return false;
    const direction = delta < 0 ? -1 : 1;
    const userMove = source !== 'auto' && source !== 'queued';
    if (state.briefing.chapterChanging && userMove) {
      if (!state.briefing.pendingMove) state.briefing.pendingMove = direction;
      return false;
    }
    const now = performance.now();
    if (userMove && state.briefing.lastMoveAt && now - state.briefing.lastMoveAt < 150) return false;
    if (userMove) state.briefing.lastMoveAt = now;
    const positions = briefingPositions();
    const current = currentBriefingPosition();
    if (current < 0) return false;
    if (state.briefing.ended && direction > 0) return false;
    const target = current + direction;
    if (target < 0) return false;
    if (target >= positions.length) {
      finishBriefing();
      return true;
    }
    const next = positions[target];
    const changedChapter = next.sceneIndex !== state.briefing.sceneIndex;
    state.briefing.sceneIndex = next.sceneIndex;
    state.briefing.cueIndex = next.cueIndex;
    state.briefing.ended = false;
    if (changedChapter) configureBriefingMedia(currentBriefingScene());
    beginBriefingCue();
    if (changedChapter) playChapterTransition(direction);
    return true;
  }

  function finishBriefing() {
    setBriefingAuto(false);
    stopBriefingMediaWindow();
    state.briefing.ended = true;
    renderBriefingScene();
  }

  function stopBriefingPlayback() {
    clearBriefingTimer();
    clearBriefingMediaTimer();
    if (chapterTimer) clearTimeout(chapterTimer);
    chapterTimer = null;
    stopBriefingMedia();
    state.briefing.pauseReasons.clear();
    state.briefing.sceneIndex = 0;
    state.briefing.cueIndex = 0;
    state.briefing.ended = false;
    state.briefing.auto = false;
    state.briefing.mediaFailed = false;
    state.briefing.mediaWindowActive = false;
    state.briefing.chapterChanging = false;
    state.briefing.pendingMove = 0;
    state.briefing.lastMoveAt = 0;
    $('briefingView').classList.remove('is-chapter-changing');
  }

  function resetBriefingSession() {
    stopBriefingPlayback();
    state.briefing.triggered = false;
  }

  function returnToSettings() {
    state.ui = 'idle';
    stopBriefingPlayback();
    setFormDisabled(false);
    setSurface('edit', document.querySelector(`input[name="lang"][value="${state.lang}"]`));
    render();
  }

  function startBriefing() {
    if (state.briefing.triggered || state.briefing.loadState !== 'ready' || !state.briefing.data) return;
    state.briefing.triggered = true;
    stopBriefingPlayback();
    if (document.hidden) state.briefing.pauseReasons.add('hidden');
    if ($('staff').open) state.briefing.pauseReasons.add('staff');
    if (state.connection !== 'online') state.briefing.pauseReasons.add('offline');
    setSurface('briefing');
    configureBriefingMedia(currentBriefingScene());
    beginBriefingCue();
    $('briefingView').focus();
  }

  function canAdvanceFromResult() {
    return state.view === 'result'
      && !state.briefing.triggered
      && state.briefing.loadState === 'ready'
      && Boolean(state.briefing.data)
      && resultKey() === 'applied';
  }

  function advanceFromResult() {
    if (!canAdvanceFromResult()) return;
    startBriefing();
  }

  function resultKey() {
    if (state.ui === 'sending' || state.ui === 'fail') return state.ui;
    if (state.connection !== 'online' || !state.status) return 'noserver';
    const actual = state.status;
    const sent = state.sent;
    if (sent && sent.seq > 0 && actual.lang === sent.lang && actual.relief === sent.relief && actual.appliedSeq >= sent.seq) return 'applied';
    if (actual.phase === 'RUN' || actual.phase === 'END') return 'later';
    return 'waiting';
  }

  function renderResult() {
    if (!state.sent) return;
    const t = T[state.lang];
    const key = resultKey();
    const briefingBlocked = key === 'applied' && state.briefing.loadState !== 'ready';
    const copy = briefingBlocked
      ? t.briefing[state.briefing.loadState === 'error' ? 'error' : 'loading']
      : t.post[key];
    const actual = state.connection === 'online' ? state.status : null;
    const glyph = briefingBlocked
      ? (state.briefing.loadState === 'error' ? '×' : '…')
      : { sending: '…', waiting: '…', later: '⌛', applied: '✓', fail: '×', noserver: '?' }[key];
    const tone = briefingBlocked
      ? (state.briefing.loadState === 'error' ? 'error' : 'wait')
      : (key === 'applied' ? 'ok' : (key === 'fail' || key === 'noserver' ? 'error' : 'wait'));
    $('resultView').dataset.tone = tone;
    setText('resultGlyph', glyph);
    setText('resultTitle', copy[0]);
    setText('resultDetail', copy[1]);
    $('selectedLanguage').textContent = LANG_NAME[state.sent.lang];
    $('selectedRelief').textContent = state.sent.relief ? t.reliefOn : t.reliefOff;
    $('headsetLanguage').textContent = actual && actual.lang ? (LANG_NAME[actual.lang] || actual.lang) : '—';
    $('headsetRelief').textContent = actual && typeof actual.relief === 'boolean' ? (actual.relief ? t.reliefOn : t.reliefOff) : '—';
    $('retryBtn').hidden = key !== 'fail';
    $('briefingRetryBtn').hidden = !(key === 'applied' && state.briefing.loadState === 'error');
    $('briefingStartBtn').hidden = briefingBlocked || key !== 'applied';
    $('editBtn').hidden = key === 'sending';
    document.querySelector('.stage').classList.toggle('is-result-ready', !briefingBlocked && key === 'applied');
    setFormDisabled(key === 'sending');
    const speechKey = briefingBlocked ? state.briefing.loadState : key;
    setSubtitle(t.postSpeech[speechKey], `result:${state.lang}:${speechKey}`);
  }

  function renderConnection() {
    $('staffToggle').dataset.state = state.connection;
    setText('connectionText', T[state.lang].connection[state.connection]);
  }

  function renderStaff() {
    const status = state.connection === 'online' ? state.status : null;
    if (!status) {
      $('staffSummary').textContent = `接続先: ${location.host}\n応答: なし\n受信回数: —\n反映回数: —\n現在設定: —\n予約: —`;
      $('clearBtn').disabled = true;
      return;
    }
    const pending = status.pending
      ? `${LANG_NAME[status.pending.lang]} / ホラー軽減 ${status.pending.relief ? 'あり' : 'なし'} / 受理 ${status.pending.seq}`
      : 'なし';
    $('staffSummary').textContent =
      `接続先: ${location.host}\n`
      + `画面: ${status.phase} / ${status.titleStage}\n`
      + `受信回数: ${status.received}\n`
      + `反映回数: ${status.applyCount}\n`
      + `現在設定: ${LANG_NAME[status.lang]} / ホラー軽減 ${status.relief ? 'あり' : 'なし'}\n`
      + `予約: ${pending}`;
    $('clearBtn').disabled = state.clearing || state.ui === 'sending' || status.pending == null;
  }

  function render() {
    renderText();
    renderReliefDescription();
    renderConnection();
    renderStaff();
    if (state.view === 'result') renderResult();
    if (state.view === 'briefing') renderBriefingScene();
  }

  function observeVisitorCycle(status) {
    if (!state.sent) return;
    const applied = state.sent.seq > 0
      && status.lang === state.sent.lang
      && status.relief === state.sent.relief
      && status.appliedSeq >= state.sent.seq;
    if (applied) state.appliedSeen = true;
    if (state.appliedSeen && status.pending == null && status.titleStage !== 'Wait') {
      state.leftWaitAfterApplied = true;
    }
    if (!state.leftWaitAfterApplied || status.titleStage !== 'Wait') return;
    resetVisitorSession();
  }

  function validSequence(value, allowZero = true) {
    return Number.isSafeInteger(value) && value >= (allowZero ? 0 : 1);
  }

  function validateStatus(status) {
    if (!status || typeof status !== 'object') return false;
    const pendingValid = status.pending == null || (
      typeof status.pending === 'object'
      && Object.hasOwn(LANG_NAME, status.pending.lang)
      && typeof status.pending.relief === 'boolean'
      && validSequence(status.pending.seq, false)
    );
    return status && status.ok === true
      && Object.hasOwn(LANG_NAME, status.lang)
      && typeof status.relief === 'boolean'
      && typeof status.phase === 'string'
      && typeof status.titleStage === 'string'
      && validSequence(status.appliedSeq)
      && validSequence(status.applyCount)
      && validSequence(status.received)
      && pendingValid;
  }

  async function fetchWithTimeout(path, options = {}, controller = new AbortController(), requireOkField = true) {
    const timeout = setTimeout(() => controller.abort(), 6000);
    try {
      const response = await fetch(path, { ...options, signal: controller.signal });
      const json = await response.json();
      if (!response.ok || requireOkField && json?.ok !== true) throw new Error(`HTTP ${response.status}`);
      return json;
    } finally {
      clearTimeout(timeout);
    }
  }

  async function post(path, body) {
    return await fetchWithTimeout(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: body == null ? '' : JSON.stringify(body),
    });
  }

  async function send() {
    if (state.ui === 'sending') return;
    if (pollController) pollController.abort();
    resetBriefingSession();
    state.sent = { lang: state.lang, relief: state.relief, seq: 0 };
    state.restartMessage = false;
    state.appliedSeen = false;
    state.leftWaitAfterApplied = false;
    state.ui = 'sending';
    setSurface('result', $('resultTitle'));
    render();
    try {
      const response = await post('./set', { lang: state.sent.lang, relief: state.sent.relief });
      if (response.ok !== true || !validSequence(response.seq, false)) throw new Error('invalid set response');
      state.sent.seq = response.seq;
      state.ui = 'sent';
      if (pollInFlight) await pollInFlight;
      await poll();
    } catch (error) {
      console.warn('set failed', error);
      if (error.name === 'AbortError' || error instanceof TypeError) state.connection = 'offline';
      state.ui = 'fail';
    }
    render();
  }

  function poll() {
    if (pollInFlight) return pollInFlight;
    if (state.ui === 'sending') return Promise.resolve();
    pollController = new AbortController();
    pollInFlight = (async () => {
      try {
        const status = await fetchWithTimeout('./status', { cache: 'no-store' }, pollController);
        if (!validateStatus(status)) throw new Error('invalid status response');
        if (state.lastReceived != null && status.received < state.lastReceived) {
          resetVisitorSession(true);
        }
        state.lastReceived = status.received;
        state.status = status;
        state.connection = 'online';
        if (state.view === 'briefing') setBriefingPause('offline', false);
        observeVisitorCycle(status);
      } catch (error) {
        state.connection = 'offline';
        if (state.view === 'briefing') setBriefingPause('offline', true);
      }
      renderConnection();
      renderStaff();
      if (state.view === 'result') renderResult();
    })().finally(() => {
      pollInFlight = null;
      pollController = null;
    });
    return pollInFlight;
  }

  $('settingsForm').addEventListener('submit', (event) => {
    event.preventDefault();
    send();
  });
  $('settingsForm').addEventListener('change', (event) => {
    if (event.target.name === 'lang') {
      state.lang = event.target.value;
      render();
    }
    if (event.target.name === 'relief') {
      state.relief = event.target.value === 'on';
      renderReliefDescription();
    }
  });
  $('titleStart').addEventListener('click', beginFromTitle);
  $('titleView').addEventListener('click', beginFromTitle);
  $('editBtn').addEventListener('click', () => {
    returnToSettings();
  });
  $('retryBtn').addEventListener('click', send);
  $('briefingRetryBtn').addEventListener('click', loadBriefingData);
  $('briefingStartBtn').addEventListener('click', advanceFromResult);
  document.querySelector('.stage').addEventListener('click', (event) => {
    if (!canAdvanceFromResult() || event.target.closest('button, a, input, select, textarea, dialog')) return;
    if (event.target.closest('#resultView, .portrait, .footer')) advanceFromResult();
  });
  $('briefingToggle').addEventListener('click', () => {
    if (state.briefing.ended) return;
    setBriefingAuto(!state.briefing.auto, true);
  });
  $('briefingPrevious').addEventListener('click', () => {
    moveBriefing(-1, 'control');
  });
  $('briefingNext').addEventListener('click', () => {
    moveBriefing(1, 'control');
  });
  $('briefingSettings').addEventListener('click', returnToSettings);
  $('briefingReplay').addEventListener('click', () => {
    stopBriefingPlayback();
    if (document.hidden) state.briefing.pauseReasons.add('hidden');
    if ($('staff').open) state.briefing.pauseReasons.add('staff');
    if (state.connection !== 'online') state.briefing.pauseReasons.add('offline');
    configureBriefingMedia(currentBriefingScene());
    beginBriefingCue();
    $('briefingView').focus();
  });
  $('staffToggle').addEventListener('click', () => {
    $('staffMessage').textContent = '';
    renderStaff();
    if (state.view === 'briefing') setBriefingPause('staff', true);
    $('staff').showModal();
  });
  $('staffClose').addEventListener('click', () => $('staff').close());
  $('staff').addEventListener('close', () => setBriefingPause('staff', false));
  $('clearBtn').addEventListener('click', async () => {
    if (state.clearing || state.ui === 'sending') return;
    state.clearing = true;
    $('clearBtn').disabled = true;
    $('staffMessage').textContent = '予約を取り消しています…';
    try {
      const response = await post('./clear');
      if (response.ok !== true) throw new Error('invalid clear response');
      state.sent = null;
      state.ui = 'idle';
      state.appliedSeen = false;
      state.leftWaitAfterApplied = false;
      resetBriefingSession();
      setFormDisabled(false);
      setSurface('edit');
      $('staffMessage').textContent = '予約の取消を送信しました。';
      await poll();
    } catch (error) {
      $('staffMessage').textContent = '予約を取り消せませんでした。通信を確認してください。';
    } finally {
      state.clearing = false;
      renderStaff();
    }
  });
  reducedMotion.addEventListener?.('change', () => {
    if (state.titleTransitioning && reducedMotion.matches) {
      if (titleTimer) clearTimeout(titleTimer);
      titleTimer = null;
      setSurface('edit', document.querySelector(`input[name="lang"][value="${state.lang}"]`));
      render();
    }
  });
  document.addEventListener('visibilitychange', () => {
    setBriefingPause('hidden', document.hidden);
  });
  document.addEventListener('keydown', (event) => {
    if (state.view !== 'briefing' || $('staff').open || event.repeat || event.altKey || event.ctrlKey || event.metaKey) return;
    const editable = event.target.closest?.('input, select, textarea');
    if (event.key === 'ArrowLeft' && !editable) {
      event.preventDefault();
      moveBriefing(-1, 'keyboard');
    }
    if (event.key === 'ArrowRight' && !editable) {
      event.preventDefault();
      moveBriefing(1, 'keyboard');
    }
    if ((event.key === 'Enter' || event.key === ' ') && event.target === $('briefingView')) {
      event.preventDefault();
      moveBriefing(1, 'keyboard');
    }
  });
  function isBriefingAdvanceTarget(target) {
    if (state.view !== 'briefing' || $('staff').open || !(target instanceof Element)) return false;
    if (target.closest('button, a, input, select, textarea, label, dialog')) return false;
    return Boolean(target.closest('#briefingView, .portrait, #subtitle'));
  }
  document.addEventListener('pointerdown', (event) => {
    if (!event.isPrimary || !isBriefingAdvanceTarget(event.target)) {
      pointerGesture = null;
      return;
    }
    pointerGesture = {
      pointerId: event.pointerId,
      x: event.clientX,
      y: event.clientY,
      scrollX: window.scrollX,
      scrollY: window.scrollY,
    };
  });
  document.addEventListener('pointerup', (event) => {
    const start = pointerGesture;
    pointerGesture = null;
    if (!start || start.pointerId !== event.pointerId || !isBriefingAdvanceTarget(event.target)) return;
    const moved = Math.hypot(event.clientX - start.x, event.clientY - start.y);
    const scrolled = Math.hypot(window.scrollX - start.scrollX, window.scrollY - start.scrollY);
    if (moved <= 14 && scrolled <= 4) moveBriefing(1, 'pointer');
  });
  document.addEventListener('pointercancel', () => { pointerGesture = null; });
  setSurface('title');
  render();
  loadBriefingData();
  poll();
  setInterval(poll, 2000);
})();
</script>
</body>
</html>
