<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#090807">
<link rel="preload" as="image" href="./asset/entrance-doll-v1.png">
<link rel="preload" as="image" href="./asset/title-logo-v2.png">
<title>廻リ視 — 体験の前に</title>
<!--
  Quest 自身が :8090 で配る来場者用の面。PC とウェブ卓は経由しない。
  注意書きは HMD の TitleNotice と同文。外部 CDN と Web フォントは使わない。
  博士の静止画は ./asset/doctor.jpg。GET /status の実値で反映を判定する。
-->
<style>
  :root {
    color-scheme: dark;
    --bg: #090807; --panel: #12100e; --ink: #f2ecdf; --muted: #c2b8a8; --faint: #968c7e;
    --line: rgba(232,220,196,.17); --line-strong: rgba(232,220,196,.38);
    --red: #a83239; --red-deep: #641c22; --gold: #d7c29b; --error: #f0a49a;
    --serif: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "Noto Serif JP", Georgia, serif;
    --sans: "Segoe UI", "Helvetica Neue", Arial, "Noto Sans JP", "Hiragino Sans", sans-serif;
    --ease: cubic-bezier(.2,.8,.2,1); --gutter: clamp(24px,4.2vw,76px); --doctor-anchor: 70%;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { min-height: 100%; background: var(--bg); }
  body { margin: 0; color: var(--ink); font: 16px/1.6 var(--serif); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
  button, input { font: inherit; }
  button { color: inherit; cursor: pointer; }
  button, label { touch-action: manipulation; -webkit-tap-highlight-color: rgba(168,50,57,.18); }
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 5px; }
  button:disabled { opacity: .4; cursor: default; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
  .skip { position: fixed; z-index: 30; left: 16px; top: 12px; padding: 10px 18px; color: var(--bg); background: var(--ink); transform: translateY(-180%); }
  .skip:focus { transform: none; }
  .stage { isolation: isolate; position: relative; display: grid; grid-template-rows: auto 1fr auto; min-height: 100svh; overflow: clip; background: var(--bg); }
  .stage::after { content: ""; position: absolute; z-index: 8; pointer-events: none; inset: 14px; border: 1px solid rgba(232,220,196,.07); }
  .topbar { position: relative; z-index: 4; display: flex; align-items: center; gap: 36px; min-height: 88px; padding: max(20px,env(safe-area-inset-top)) var(--gutter) 16px; }
  .brand { width: 104px; margin: 0; line-height: 1; white-space: nowrap; }
  .brand img { display: block; width: 100%; height: auto; }
  .brand::after { content: ""; display: block; width: 22px; height: 2px; margin-top: 11px; background: var(--red); }
  .journey { display: flex; align-items: center; gap: 25px; margin: 0 auto; padding: 0; list-style: none; color: var(--faint); font: 11px/1.4 var(--sans); letter-spacing: .1em; }
  .journey li { display: flex; align-items: center; gap: 9px; }
  .journey li + li::before { content: ""; width: 25px; height: 1px; margin-right: 14px; background: var(--line); }
  .journey b { font-weight: 400; font-variant-numeric: tabular-nums; }
  .journey [aria-current="step"] { color: var(--ink); }
  .journey [aria-current="step"] b { color: var(--gold); }
  .connection { display: flex; align-items: center; justify-content: flex-end; gap: 8px; min-height: 44px; margin-left: auto; padding: 4px 0 4px 10px; border: 0; background: transparent; color: var(--muted); font: 11px/1.4 var(--sans); }
  .connection-dot { width: 5px; height: 5px; flex: 0 0 5px; border: 1px solid currentColor; border-radius: 50%; }
  .connection[data-state="online"] .connection-dot { background: var(--gold); border-color: var(--gold); }
  .connection[data-state="offline"] { color: var(--error); }
  .staff-label { border-left: 1px solid var(--line-strong); padding-left: 14px; margin-left: 10px; }
  .connection:hover .staff-label { color: var(--ink); }
  .fullscreen-return { min-height: 44px; padding: 7px 12px; border: 1px solid var(--line-strong); background: rgba(18,16,14,.82); color: var(--ink); font: 12px/1.4 var(--sans); }
  .portrait { position: absolute; z-index: -1; inset: 0; margin: 0; overflow: hidden; background: var(--bg); }
  .portrait img, .portrait video { display: block; width: 100%; height: 100%; object-fit: cover; }
  .portrait::after { content: ""; position: absolute; pointer-events: none; inset: 0; background: linear-gradient(90deg,var(--bg),rgba(9,8,7,.97) 28%,rgba(9,8,7,.83) 44%,rgba(9,8,7,.1) 75%),linear-gradient(0deg,var(--bg),transparent 35%,transparent 80%,rgba(9,8,7,.5)); }
  #entranceImage { object-position: 76% center; }
  .stage:not(.is-briefing) #doctorImage, .stage:not(.is-briefing) #doctorVideo, .stage.is-briefing #entranceImage { display: none; }
  .content { position: relative; z-index: 2; align-self: center; width: 56%; max-width: 800px; padding: 16px 36px 12px var(--gutter); min-width: 0; }
  h1 { margin: 0 0 25px; font-size: clamp(30px,3.3vw,48px); font-weight: 400; line-height: 1.3; letter-spacing: .12em; text-wrap: balance; scroll-margin-top: 24px; }
  .surface { opacity: 1; transition: opacity .26s var(--ease),transform .38s var(--ease); }
  .surface:not(.is-active) { position: absolute; inset: 16px 36px 12px var(--gutter); opacity: 0; transform: translateY(8px); pointer-events: none; }
  .notice { margin-bottom: 24px; padding: 17px 0 18px; border-top: 1px solid var(--line-strong); border-bottom: 1px solid var(--line); }
  .eyebrow { display: block; margin-bottom: 10px; color: var(--gold); font: 10px/1.4 var(--sans); text-transform: uppercase; letter-spacing: .18em; }
  .notice-body { margin: 0; max-width: 42em; color: var(--muted); font: 16px/1.75 var(--sans); white-space: pre-line; overflow-wrap: anywhere; }
  .system-note { margin: 0 0 18px; padding: 10px 14px; border-left: 2px solid var(--gold); background: rgba(215,194,155,.07); font: 14px/1.6 var(--sans); }
  .settings { margin: 0; }
  fieldset { min-width: 0; margin: 0; padding: 0; border: 0; }
  fieldset + fieldset { margin-top: 20px; }
  legend { width: 100%; margin: 0 0 10px; padding: 0; color: var(--muted); font: 11px/1.5 var(--sans); letter-spacing: .13em; }
  .choices { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 8px; }
  .choices.two { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .choice { position: relative; display: flex; align-items: center; gap: 8px; min-width: 0; min-height: 56px; padding: 12px 15px; border: 1px solid var(--line); background: rgba(9,8,7,.45); cursor: pointer; transition: background-color .2s,border-color .2s,transform .2s var(--ease); }
  .choice:hover { border-color: var(--line-strong); background: rgba(232,220,196,.07); }
  .choice:active { transform: scale(.985); }
  .choice::after { content: ""; position: absolute; height: 2px; bottom: -1px; left: -1px; right: -1px; background: var(--gold); transform: scaleX(0); transform-origin: left; transition: transform .28s var(--ease); }
  .choice:has(input:checked) { background: rgba(111,45,41,.22); border-color: rgba(215,194,155,.5); }
  .choice:has(input:checked)::after { transform: scaleX(1); }
  .choice:has(input:focus-visible) { outline: 2px solid var(--gold); outline-offset: 4px; }
  .choice input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .choice-text { min-width: 0; font-size: 18px; letter-spacing: .025em; overflow-wrap: anywhere; }
  .choice-mark { display: grid; place-items: center; width: 13px; height: 13px; margin-left: auto; flex: 0 0 13px; border: 1px solid var(--line-strong); border-radius: 50%; }
  .choice-mark::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--gold); transform: scale(0); transition: transform .22s var(--ease); }
  input:checked ~ .choice-mark { border-color: var(--gold); }
  input:checked ~ .choice-mark::before { transform: scale(1); }
  .relief-description { min-height: 3em; margin: 10px 0 0; color: var(--muted); font: 13px/1.5 var(--sans); white-space: pre-line; opacity: 0; transform: translateY(-3px); transition: opacity .2s,transform .25s var(--ease); }
  .relief-description.is-visible { opacity: 1; transform: none; }
  .footer { position: relative; z-index: 4; display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 28px; padding: 23px var(--gutter) max(30px,env(safe-area-inset-bottom)); }
  .subtitle { justify-self: start; align-self: center; width: min(100%,800px); min-height: 3.4em; position: relative; font-size: clamp(16px,1.55vw,21px); line-height: 1.7; letter-spacing: .04em; text-wrap: balance; text-shadow: 0 2px 10px var(--bg); }
  .subtitle-reserve { visibility: hidden; }
  .subtitle-typed { position: absolute; inset: 0; }
  .primary, .title-start { position: relative; display: inline-flex; align-items: center; gap: 28px; min-height: 60px; padding: 15px 24px; border: 1px solid var(--line-strong); background: rgba(9,8,7,.7); text-align: left; transition: border-color .2s,background-color .2s,transform .2s var(--ease); }
  .primary { max-width: 340px; font-size: 17px; line-height: 1.5; letter-spacing: .07em; border-left: 3px solid var(--red); }
  .primary::after, .title-start::after { content: ""; display: block; flex: 0 0 8px; width: 8px; height: 8px; border-top: 1px solid var(--gold); border-right: 1px solid var(--gold); transform: rotate(45deg); transition: transform .25s var(--ease); }
  .primary:hover, .title-start:hover { border-color: var(--gold); background: rgba(100,28,34,.3); }
  .primary:hover::after, .title-start:hover::after { transform: translateX(4px) rotate(45deg); }
  .primary:active, .title-start:active { transform: scale(.985); }
  .result { padding: 30px 0; }
  .result-state { display: grid; grid-template-columns: 48px minmax(0,1fr); align-items: center; gap: 10px 22px; margin: 0 0 42px; }
  .status-glyph { position: relative; grid-row: span 2; display: grid; place-items: center; width: 42px; height: 42px; border: 1px solid var(--line-strong); transform: rotate(45deg); color: var(--gold); }
  .status-glyph span { font: 20px/1 var(--sans); transform: rotate(-45deg); }
  .result[data-tone="ok"] .status-glyph { border-color: var(--gold); background: rgba(215,194,155,.07); }
  .result[data-tone="error"] .status-glyph { color: var(--error); border-color: var(--error); }
  .result[data-tone="wait"] .status-glyph::after { content: ""; position: absolute; inset: -6px; border: 1px solid transparent; border-top-color: var(--gold); animation: turn 2s linear infinite; }
  @keyframes turn { to { transform: rotate(360deg); } }
  .result-title { margin: 0; font-size: clamp(24px,2.7vw,38px); font-weight: 400; line-height: 1.4; letter-spacing: .05em; text-wrap: balance; overflow-wrap: anywhere; }
  .result-detail { margin: 0; color: var(--muted); font: 14px/1.65 var(--sans); }
  .values { width: 100%; table-layout: fixed; border-collapse: collapse; }
  .values th, .values td { padding: 17px 8px; border-bottom: 1px solid var(--line); text-align: left; overflow-wrap: anywhere; }
  .values thead th, .values tbody th { color: var(--muted); font: 11px/1.5 var(--sans); font-weight: 400; }
  .values thead th:first-child { width: 27%; }
  .values td { font-size: 19px; font-variant-numeric: tabular-nums; }
  .result[data-tone="ok"] .values td:last-child { color: var(--gold); }
  .result-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
  .secondary, .retry, .briefing-control { min-height: 46px; padding: 10px 17px; border: 1px solid var(--line-strong); background: rgba(9,8,7,.7); font: 13px/1.5 var(--sans); letter-spacing: .035em; transition: border-color .2s,background-color .2s,transform .2s var(--ease); }
  .secondary:hover, .retry:hover, .briefing-control:hover:not(:disabled) { background: rgba(215,194,155,.08); border-color: var(--gold); }
  .secondary:active, .retry:active, .briefing-control:active:not(:disabled) { transform: scale(.97); }
  .retry { border-color: var(--error); }
  .stage.is-result-ready .result, .stage.is-result-ready .portrait, .stage.is-result-ready .footer { cursor: pointer; }
  .stage.is-result-ready .subtitle { padding-right: 30px; }
  .stage.is-result-ready .subtitle::after { content: ""; position: absolute; right: 0; top: 11px; width: 7px; height: 7px; border: solid var(--gold); border-width: 1px 1px 0 0; transform: rotate(45deg); }
  .stage.is-title { height: 100svh; }
  .stage.is-title .topbar, .stage.is-title .content, .stage.is-title .footer { visibility: hidden; }
  .title-view { position: absolute; z-index: 10; inset: 0; display: flex; align-items: center; min-height: 100svh; overflow: hidden; cursor: pointer; background: var(--bg); transition: opacity .52s var(--ease); }
  .title-view::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg,rgba(9,8,7,.45),transparent 75%),linear-gradient(0deg,rgba(9,8,7,.65),transparent 30%),url("./asset/entrance-doll-v1.png") 76% center / cover no-repeat; transition: transform .8s var(--ease),opacity .5s var(--ease); }
  .title-view::after { content: ""; position: absolute; inset: 22px; border: 1px solid rgba(232,220,196,.16); pointer-events: none; }
  .title-lockup { position: absolute; z-index: 1; inset: 0; transition: opacity .35s var(--ease),transform .55s var(--ease); }
  .title-brand { position: absolute; left: 6%; top: 30%; width: min(47%,900px); margin: 0; line-height: 1; }
  .title-brand img { display: block; width: 100%; height: auto; filter: drop-shadow(0 4px 24px rgba(0,0,0,.42)); }
  .title-rule { display: none; }
  .title-start { position: absolute; left: 6%; bottom: max(13%,env(safe-area-inset-bottom)); border: 0; padding: 10px 0; gap: 42px; background: transparent; }
  .title-start:hover { background: transparent; }
  .title-start-copy { display: grid; gap: 7px; }
  .title-start-main { font-size: 17px; letter-spacing: .12em; }
  .title-start-alt { font: 10px/1.5 var(--sans); color: var(--muted); letter-spacing: .05em; }
  .title-view.is-leaving { opacity: 0; }
  .title-view.is-leaving::before { transform: scale(1.035); opacity: .3; }
  .title-view.is-leaving .title-lockup { opacity: 0; transform: translateY(-12px); }
  .stage.is-briefing { height: 100svh; min-height: 640px; grid-template-rows: auto minmax(300px,1fr) auto; }
  .stage.is-briefing .content { min-height: 0; align-self: stretch; width: 64%; max-width: none; padding-top: 18px; padding-bottom: 18px; }
  .stage.is-briefing .portrait { top: 88px; bottom: 165px; left: 62%; right: 0; }
  .stage.is-briefing .portrait img, .stage.is-briefing .portrait video { position: absolute; left: 50%; bottom: 0; height: 100%; width: auto; max-width: none; transform: translateX(calc(0% - var(--doctor-anchor))); mask-image: linear-gradient(90deg,transparent,#000 10%,#000 86%,transparent); }
  .stage.is-briefing .portrait::after { background: linear-gradient(90deg,var(--bg),transparent 18%,transparent 84%,var(--bg)),linear-gradient(0deg,var(--bg),transparent 20%,transparent 85%,var(--bg)); }
  .briefing { height: 100%; display: grid; grid-template-rows: auto minmax(150px,1fr) auto; gap: 20px; }
  .briefing-copy { min-width: 0; }
  .briefing-chapter { display: grid; grid-template-columns: auto auto minmax(20px,1fr) auto; gap: 15px; align-items: center; color: var(--gold); font: 10px/1.3 var(--sans); letter-spacing: .13em; }
  .briefing-chapter-number { font-size: 29px; font-weight: 300; line-height: 1; }
  .briefing-chapter-number, .briefing-cue-number { font-variant-numeric: tabular-nums; }
  .briefing-chapter .eyebrow { margin: 0; font-size: 11px; }
  .briefing-chapter-line { height: 1px; background: var(--line); transform-origin: left; }
  .briefing-title { margin: 20px 0 0; font-size: clamp(24px,2.5vw,36px); font-weight: 400; line-height: 1.4; letter-spacing: .09em; text-wrap: balance; }
  .briefing-caption { margin: 7px 0 0; font: 12px/1.6 var(--sans); color: var(--muted); }
  .briefing-visual { position: relative; min-height: 150px; margin: 0; overflow: hidden; border: 1px solid var(--line); background: var(--bg); }
  .briefing-visual::after { content: ""; position: absolute; pointer-events: none; inset: 8px; border: 1px solid rgba(232,220,196,.08); }
  .briefing-image { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity .38s var(--ease); }
  .briefing-image.is-visible { opacity: 1; }
  .briefing-visual.is-loop-playing .briefing-image { opacity: 0; }
  .briefing-loop-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; pointer-events: none; transition: opacity .38s var(--ease); }
  .briefing-loop-video.is-visible { opacity: 1; }
  .briefing-loop-video[hidden] { display: none; }
  .briefing-intro { display: none; }
  .briefing-progress { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 16px; color: var(--faint); font: 10px/1.4 var(--sans); font-variant-numeric: tabular-nums; letter-spacing: .12em; }
  .briefing-progress progress { appearance: none; width: 100%; height: 2px; border: 0; background: var(--line); color: var(--gold); }
  progress::-webkit-progress-bar { background: var(--line); }
  progress::-webkit-progress-value { background: var(--gold); }
  progress::-moz-progress-bar { background: var(--gold); }
  .stage.is-briefing .footer { grid-template-columns: 1fr; gap: 16px; padding-top: 20px; background: var(--bg); border-top: 1px solid var(--line); }
  .stage.is-briefing .subtitle { justify-self: center; width: min(100%,1040px); min-height: 3.4em; font-size: clamp(18px,1.8vw,25px); text-align: center; }
  .briefing-controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; }
  .briefing-control { background: transparent; }
  #briefingSettings { margin-right: auto; order: -2; border-color: transparent; color: var(--muted); padding-left: 0; }
  #briefingToggle { order: -1; margin-right: 8px; border-color: transparent; color: var(--muted); }
  #briefingToggle[aria-pressed="true"] { color: var(--gold); border-color: var(--line-strong); }
  #briefingNext { border-color: var(--gold); min-width: 112px; }
  #briefingNext::after { content: "›"; margin-left: 20px; color: var(--gold); }
  .briefing-replay { border-color: var(--gold); }
  .stage.is-briefing .briefing, .stage.is-briefing .portrait, .stage.is-briefing .subtitle { cursor: pointer; touch-action: manipulation; }
  .stage.is-doctor-only .content { width: 100%; padding-right: var(--gutter); }
  .stage.is-doctor-only .portrait { left: 0; right: 0; }
  .stage.is-doctor-only .briefing { grid-template-rows: auto 1fr auto; }
  .stage.is-doctor-only .briefing-copy { width: min(100%,350px); }
  .stage.is-doctor-only .briefing-title { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .stage.is-doctor-only .briefing-caption { margin-top: 13px; }
  .stage.is-doctor-only .briefing-progress { grid-row: 3; }
  .briefing.is-chapter-changing .briefing-copy { animation: chapter-in .48s var(--ease); }
  .briefing.is-chapter-changing .briefing-visual { animation: reference-in .55s var(--ease); }
  .briefing.is-chapter-changing .briefing-chapter-line { animation: chapter-line .6s var(--ease); }
  @keyframes chapter-in { from { opacity: 0; transform: translateX(var(--chapter-shift,12px)); } to { opacity: 1; transform: none; } }
  @keyframes reference-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes chapter-line { from { transform: scaleX(.1); } to { transform: scaleX(1); } }
  .media-notice { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px 16px; padding: 8px 0; color: var(--muted); font: 12px/1.5 var(--sans); }
  .media-notice button { min-height: 44px; padding: 8px 12px; background: transparent; border: 1px solid var(--line-strong); font-size: 12px; }
  .staff-dialog { width: min(92vw,520px); max-height: 86svh; padding: 30px; border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink); box-shadow: 0 25px 90px rgba(0,0,0,.65); overscroll-behavior: contain; }
  .staff-dialog[open] { animation: reference-in .24s var(--ease); }
  .staff-dialog::backdrop { background: rgba(0,0,0,.8); }
  .staff-dialog h2 { margin: 0 45px 22px 0; font-size: 22px; font-weight: 400; }
  .staff-close { position: absolute; right: 17px; top: 17px; width: 44px; height: 44px; border: 1px solid var(--line); background: transparent; }
  .staff-summary { min-height: 8em; margin: 0 0 18px; padding: 16px 0; border-block: 1px solid var(--line); color: var(--muted); font: 13px/1.9 ui-monospace,Consolas,monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  .staff-message { min-height: 1.6em; color: var(--gold); font: 13px/1.6 var(--sans); }
  .staff-clear { min-height: 48px; width: 100%; padding: 10px 14px; border: 1px solid var(--red); background: rgba(168,50,57,.12); }
  .staff-fullscreen { min-height: 48px; width: 100%; margin-bottom: 10px; padding: 10px 14px; border: 1px solid var(--line-strong); background: transparent; }
  @media (min-width:1600px) { .content { width: 52%; } .stage.is-briefing { grid-template-rows: auto minmax(440px,1fr) auto; } .notice-body { font-size: 18px; } }
  @media (min-width:761px) and (max-height:800px) {
    .topbar { min-height: 74px; padding-top: 14px; padding-bottom: 10px; }
    .content { padding-top: 8px; padding-bottom: 0; }
    h1 { font-size: 34px; margin-bottom: 17px; }
    .notice { padding-block: 12px; margin-bottom: 18px; }
    .notice-body { font-size: 15px; line-height: 1.6; }
    .eyebrow { margin-bottom: 7px; }
    .choice { min-height: 50px; padding-block: 9px; }
    fieldset + fieldset { margin-top: 16px; }
    .footer { padding-top: 16px; padding-bottom: 24px; }
    .stage.is-briefing { grid-template-rows: auto minmax(300px,1fr) auto; }
    .stage.is-briefing .portrait { top: 74px; bottom: 178px; }
    .stage.is-briefing .footer { gap: 12px; padding-top: 16px; }
    .stage.is-briefing .subtitle { font-size: 20px; }
    .briefing { gap: 14px; }
    .briefing-title { margin-top: 14px; }
  }

    h1 { font-size: 34px; margin-bottom: 24px; }
    .notice { margin-bottom: 25px; }
    .notice-body { font-size: 16px; }

    .choice-text { font-size: 17px; }
    .footer { grid-template-columns: 1fr; gap: 14px; padding: 22px var(--gutter) max(30px,env(safe-area-inset-bottom)); }
    .subtitle { text-align: center; justify-self: center; font-size: 16px; }
    .primary { width: 100%; max-width: none; justify-content: space-between; }
    .title-view { align-items: flex-end; }
    .title-view::before { background: linear-gradient(0deg,var(--bg),rgba(9,8,7,.9) 18%,transparent 68%),url("./asset/entrance-doll-v1.png") 77% 35% / cover no-repeat; }
    .title-view::after { inset: 14px; }
    .title-lockup { inset: 0; }
    .title-brand { left: 8%; right: 8%; top: max(10%,env(safe-area-inset-top)); width: auto; max-width: 620px; margin: 0 auto; }

  @media (max-width:760px) and (min-aspect-ratio:1/1) {

  }
  @media (max-width:420px) {
    :root { --gutter: 22px; }
    .topbar { gap: 8px; }
    .staff-label { padding-left: 10px; margin-left: 4px; }

    .journey li { gap: 6px; }
    .journey li + li::before { width: 10px; }
    h1 { font-size: 30px; }
    .choice { padding-inline: 9px; gap: 5px; }

<body>
<a class="skip" href="#main" hidden>設定へ移動</a>
<div class="stage is-title">
  <section class="title-view is-active" id="titleView" aria-labelledby="titleBrand">
    <div class="title-lockup">
      <h1 class="title-brand" id="titleBrand" translate="no"><img src="./asset/title-logo-v2.png" alt="廻リ視" width="1210" height="531" draggable="false"></h1>
      <span class="title-rule" aria-hidden="true"></span>
      <button class="title-start" id="titleStart" type="button" aria-label="タップして始める。Tap to begin. Touchez pour commencer.">
        <span class="title-start-copy">
        <span class="title-start-main">タップして始める</span>
        <span class="title-start-alt"><span lang="en">Tap to begin</span> · <span lang="fr">Touchez pour commencer</span></span>
        </span>
      </button>
    </div>
  </section>
  <header class="topbar">
    <p class="brand" translate="no"><img src="./asset/title-logo-v2.png" alt="廻リ視" width="1210" height="531" draggable="false"></p>
    <button class="fullscreen-return" id="fullscreenBtn" type="button" hidden>全画面</button>
    <ol class="journey" id="journey" aria-label="体験の準備">
      <li id="journeySettings" aria-current="step"><b>01</b><span id="journeySettingsLabel">設定</span></li>
      <li id="journeyBriefing"><b>02</b><span id="journeyBriefingLabel">調査説明</span></li>
      <li id="journeyWear"><b>03</b><span id="journeyWearLabel">装着</span></li>
    </ol>
    <button class="connection" id="staffToggle" data-state="checking" type="button" aria-haspopup="dialog" aria-label="スタッフ情報を開く">
      <span class="connection-dot" aria-hidden="true"></span>
      <span id="connectionText" role="status" aria-live="polite">接続を確認中…</span>
      <span class="staff-label" id="staffLabel">スタッフ</span>
    </button>
  </header>

  <figure class="portrait" aria-hidden="true">
    <img id="entranceImage" src="./asset/entrance-doll-v1.png" alt="" width="1672" height="941" draggable="false" fetchpriority="high">
    <img id="doctorImage" alt="" width="1672" height="941" draggable="false">
    <video id="doctorVideo" playsinline preload="metadata" disablepictureinpicture hidden></video>
  </figure>

  <main class="content" id="main">
    <section class="surface settings" id="settingsView" aria-labelledby="pageTitle" aria-hidden="true" hidden inert>
      <h1 id="pageTitle">体験の前に</h1>
      <div class="notice" id="notice">
        <span class="eyebrow" id="noticeLabel">注意</span>
        <p class="notice-body" id="noticeBody"></p>
      </div>
      <p class="system-note" id="restartNotice" role="status" hidden></p>

      <form class="settings" id="settingsForm">
        <fieldset>
          <legend id="languageLegend">言語</legend>
          <div class="choices">
            <label class="choice">
              <input type="radio" name="lang" value="ja" checked>
              <span class="choice-text">日本語</span>
              <span class="choice-mark" aria-hidden="true"></span>
            </label>
            <label class="choice">
              <input type="radio" name="lang" value="en">
              <span class="choice-text">English</span>
              <span class="choice-mark" aria-hidden="true"></span>
            </label>
            <label class="choice">
              <input type="radio" name="lang" value="fr">
              <span class="choice-text">Français</span>
              <span class="choice-mark" aria-hidden="true"></span>
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend id="reliefLegend">ホラー軽減</legend>
          <div class="choices two">
            <label class="choice">
              <input type="radio" name="relief" value="off" checked>
              <span class="choice-text" id="reliefOff">なし</span>
              <span class="choice-mark" aria-hidden="true"></span>
            </label>
            <label class="choice">
              <input type="radio" name="relief" value="on">
              <span class="choice-text" id="reliefOn">あり</span>
              <span class="choice-mark" aria-hidden="true"></span>
            </label>
          </div>
          <p class="relief-description" id="reliefDesc" aria-hidden="true"></p>
        </fieldset>
      </form>
    </section>

    <section class="surface result" id="resultView" aria-labelledby="resultTitle" aria-hidden="true" hidden inert>
      <div class="result-state" role="status" aria-live="polite" aria-atomic="true">
        <div class="status-glyph" aria-hidden="true"><span id="resultGlyph">…</span></div>
        <h2 class="result-title" id="resultTitle" tabindex="-1">送信中</h2>
        <p class="result-detail" id="resultDetail"></p>
      </div>
      <table class="values">
        <thead>
          <tr>
            <th scope="col"><span class="sr-only" id="itemHeading">項目</span></th>
            <th scope="col" id="selectedHeading">選んだ設定</th>
            <th scope="col" id="headsetHeading">ヘッドセット</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row" id="resultLanguageLabel">言語</th>
            <td id="selectedLanguage">日本語</td>
            <td id="headsetLanguage">—</td>
          </tr>
          <tr>
            <th scope="row" id="resultReliefLabel">ホラー軽減</th>
            <td id="selectedRelief">なし</td>
            <td id="headsetRelief">—</td>
          </tr>
        </tbody>
      </table>
      <div class="result-actions">
        <button class="retry" id="retryBtn" type="button" hidden>もう一度送る</button>
        <button class="retry" id="briefingRetryBtn" type="button" hidden>説明資料を再読み込み</button>
        <button class="secondary" id="editBtn" type="button" hidden>設定を変える</button>
      </div>
    </section>

    <section class="surface briefing" id="briefingView" role="region" tabindex="0" aria-labelledby="briefingTitle" aria-describedby="briefingAdvanceHint" aria-hidden="true" hidden inert>
      <span class="sr-only" id="briefingAdvanceHint">次の文へ進む</span>
      <div class="briefing-copy">
        <div class="briefing-chapter">
          <span class="briefing-chapter-number" id="briefingChapterNumber"></span>
          <span class="eyebrow" id="briefingEyebrow"></span>
          <span class="briefing-chapter-line" aria-hidden="true"></span>
          <span class="briefing-cue-number" id="briefingCueNumber"></span>
        </div>
        <h2 class="briefing-title" id="briefingTitle" tabindex="-1"></h2>
        <p class="briefing-caption" id="briefingCaption"></p>
      </div>
      <figure class="briefing-visual">
        <img class="briefing-image" id="briefingImage" alt="" draggable="false" width="1600" height="900" hidden>
        <video class="briefing-loop-video" id="briefingLoopVideo" playsinline muted loop preload="none" disablepictureinpicture aria-hidden="true" hidden></video>
        <div class="reference-fallback" id="referenceFallback" hidden>
          <p id="referenceDescription"></p><span id="referenceUnavailable"></span>
        </div>
        <div class="briefing-intro" id="briefingIntro" hidden>
          <p class="briefing-role" id="briefingRole"></p>
          <p class="briefing-intro-text" id="briefingIntroText"></p>
        </div>
      </figure>
      <div class="briefing-progress">
        <span id="sceneCounter"></span>
        <progress id="sceneProgress" value="0" max="1"></progress>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="subtitle" id="subtitle" aria-hidden="true">
      <span class="subtitle-reserve" id="subtitleReserve"></span>
      <span class="subtitle-typed"><span id="subtitleTyped"></span></span>
    </div>
    <p class="sr-only" id="subtitleAnnouncement" role="status" aria-live="polite" aria-atomic="true"></p>
    <button class="primary" id="sendBtn" type="submit" form="settingsForm">
      <span id="submitLabel">この設定で始める</span>
    </button>
    <div class="briefing-controls" id="briefingControls" hidden>
      <button class="briefing-control" id="briefingMute" type="button" aria-pressed="false" hidden>音声 ON</button>
      <button class="briefing-control" id="briefingToggle" data-action="toggle" type="button" aria-pressed="false">AUTO OFF</button>
      <button class="briefing-control" id="briefingPrevious" type="button">前の文</button>
      <button class="briefing-control" id="briefingNext" type="button">次の文</button>
      <button class="briefing-control" id="briefingSettings" type="button">設定に戻る</button>
      <button class="briefing-control briefing-replay" id="briefingReplay" type="button" hidden>もう一度説明を見る</button>
    </div>
    <div class="media-notice" id="mediaNotice" hidden>
      <span id="mediaMessage" role="status" aria-live="polite"></span>
      <button id="mediaRetry" type="button">再読み込み</button>
    </div>
  </footer>
</div>

<dialog class="staff-dialog" id="staff">
  <button class="staff-close" id="staffClose" type="button" aria-label="閉じる">×</button>
  <h2>スタッフ情報</h2>
  <div class="staff-summary" id="staffSummary">読み込み中…</div>
  <p class="staff-message" id="staffMessage" role="status" aria-live="polite"></p>
  <button class="staff-fullscreen" id="staffFullscreenBtn" type="button" hidden>全画面にする</button>
  <button class="staff-clear" id="clearBtn" type="button">予約を取り消す</button>
</dialog>

  const tabletSessionId = (() => {

      && /^[A-Za-z0-9_-]{1,128}$/.test(restoreCandidate.tabletSessionId)) {

    }
    const bytes = new Uint8Array(16);
    if (globalThis.crypto?.getRandomValues) globalThis.crypto.getRandomValues(bytes);
    else for (let i = 0; i < bytes.length; i++) bytes[i] = Math.floor(Math.random() * 256);
    return Array.from(bytes, (byte) => byte.toString(16).padStart(2, '0')).join('');

  function clearSavedProgress() {

  function saveBriefingProgress() {
    if (state.view !== 'briefing' || !state.sent || state.sent.seq <= 0) return;
    const progress = {
      tabletSessionId,
      portalSessionId: state.sent.portalSessionId,
      seq: state.sent.seq,

      sceneIndex: state.briefing.sceneIndex,

  function savedProgressMatches(progress, status) {
    return progress?.tabletSessionId === tabletSessionId
      && progress.portalSessionId === status.portalSessionId
      && validSequence(progress.seq, false)
      && Object.hasOwn(LANG_NAME, progress.lang)
      && typeof progress.relief === 'boolean'
      && status.lastRequest?.tabletSessionId === progress.tabletSessionId
      && status.lastRequest.seq === progress.seq
      && status.lastRequest.lang === progress.lang
      && status.lastRequest.relief === progress.relief
      && status.appliedSeq === progress.seq
      && status.lang === progress.lang
      && status.relief === progress.relief
      && status.pending?.seq === progress.seq
      && status.pending.lang === progress.lang
      && status.pending.relief === progress.relief;
  }

  function tryRestoreBriefing() {
    const progress = restoreCandidate;
    if (!progress || state.restored || state.briefing.loadState !== 'ready' || !state.status) return false;
    restoreCandidate = null;
    if (!savedProgressMatches(progress, state.status)) {
      clearSavedProgress();
      return false;
    }
    const scene = state.briefing.data?.scenes[progress.sceneIndex];
    if (!scene || !Number.isSafeInteger(progress.cueIndex)
      || progress.cueIndex < 0 || progress.cueIndex >= scene.cues[progress.lang].length) {
      clearSavedProgress();
      return false;
    }
    state.restored = true;
    setDraft(progress.lang, progress.relief);
    state.sent = { lang: progress.lang, relief: progress.relief, seq: progress.seq, portalSessionId: progress.portalSessionId };
    state.ui = 'sent';
    state.appliedSeen = true;
    state.briefing.triggered = true;
    state.briefing.sceneIndex = progress.sceneIndex;
    state.briefing.cueIndex = progress.cueIndex;
    state.briefing.ended = Boolean(progress.ended);
    state.briefing.auto = false;
    setSurface('briefing');
    renderText();
    configureBriefingMedia(scene);
    setSubtitle(scene.cues[state.lang][state.briefing.cueIndex].text,
      `briefing:${scene.id}:${state.lang}:${state.briefing.cueIndex}`);

  async function requestWakeLock() {
    if (wakeLock?.released) wakeLock = null;
    if (document.hidden || wakeLock || !globalThis.navigator?.wakeLock?.request) return;
    try {
      wakeLock = await globalThis.navigator.wakeLock.request('screen');
      wakeLock.addEventListener?.('release', () => { wakeLock = null; });
    } catch (error) {
      console.warn('wake lock unavailable', error);

  }

  function syncFullscreenControls() {
    const supported = Boolean(document.fullscreenEnabled && document.documentElement.requestFullscreen);

    $('fullscreenBtn').textContent = T[state.lang].fullscreen;
    $('staffFullscreenBtn').hidden = !supported;

  }

  function enterFullscreen() {
    if (!document.fullscreenEnabled || !document.documentElement.requestFullscreen || document.fullscreenElement) return;
    try {
      const result = document.documentElement.requestFullscreen({ navigationUI: 'hide' });
      result?.catch?.((error) => console.warn('fullscreen unavailable', error));
    } catch (error) {
      console.warn('fullscreen unavailable', error);
    }
  }

  function animateElement(element, keyframes, duration) {
    activeAnimations.get(element)?.cancel();
    if (reducedMotion.matches || !element.animate) return;
    const animation = element.animate(keyframes, { duration, easing: 'cubic-bezier(.2,.8,.2,1)' });
    activeAnimations.set(element, animation);
    animation.finished.then(() => {
      if (activeAnimations.get(element) === animation) activeAnimations.delete(element);
    }).catch(() => {});
  }

  function cancelVisualChange() {
    for (const animation of activeAnimations.values()) animation.cancel();
    activeAnimations.clear();
  }

  function changeVisual(update) {
    cancelVisualChange();
    update();
    // The live controls are interactive immediately. No snapshot overlay.
    animateElement(document.querySelector('.content'), [{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], 340);
    animateElement(document.querySelector('.portrait'), [{ opacity: .15 }, { opacity: 1 }], 420);
    return true;
  }

  function renderJourney() {
    const t = T[state.lang].journey;
    $('journey').setAttribute('aria-label', t[0]);
    const step = state.view !== 'briefing' ? 0 : (state.briefing.sceneIndex === state.briefing.data?.scenes.length - 1 ? 2 : 1);

      setText(`journey${name}Label`, t[index + 1]);
      if (step === index) $(`journey${name}`).setAttribute('aria-current', 'step');

  function syncViewChrome(view) {

  function setSurface(view, focusTarget) {
    const surfaces = { title: $('titleView'), edit: $('settingsView'), result: $('resultView'), briefing: $('briefingView') };
    const current = surfaces[view];
    syncViewChrome(view);
    if (state.view === view && !current.hidden) {
      if (view === 'title') {
        current.classList.remove('is-leaving');

        state.titleTransitioning = false;

      if (focusTarget) focusTarget.focus();

    }
    const oldSurface = surfaces[state.view];
    const newSurface = surfaces[view];
    for (const surface of Object.values(surfaces)) {
      if (surface !== oldSurface && surface !== newSurface) {
        surface.hidden = true;
        surface.inert = true;
        surface.classList.remove('is-active');
        surface.setAttribute('aria-hidden', 'true');

    oldSurface.classList.remove('is-active');

    oldSurface.setAttribute('aria-hidden', 'true');
    oldSurface.inert = true;
    newSurface.hidden = false;
    newSurface.removeAttribute('aria-hidden');
