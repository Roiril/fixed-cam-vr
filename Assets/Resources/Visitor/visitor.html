<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>廻リ視 — 体験の前に</title>
<!--
  タブレットで開く「体験の前に」の面（2026-09-11・canon/LEDGER.md 0185 / 0186 / 0187）。
  ⚠ この面は **Quest 自身が配る**（VisitorPortal・:8090）。PC も卓も経由しない。
    α 用のタブレットは α の機、β 用は β の機の URL を開く:
      http://192.168.10.31:8090/   http://192.168.10.32:8090/  （現地の静的割当・docs/onsite/network-setup.md）
    どの機に繋いでいるかは、この面のヘッダ（機の IP）とスタッフ欄で分かる。

  ⚠ 最初の画面は注意書きと設定だけ（0186）。導入の文は置かない。
  ⚠ 注意書きの 3 言語は HMD の TitleNotice と同じ文（安全の掲示なので、受付とヘッドセットで食い違わせない）。
  ⚠ 「反映されたか」は GET /status が返す実値（lang / relief）で判定する。送った値を表示しない。
  ⚠ 外部の CDN と Web フォントは使わない（会場に外の回線が無い）。
  ⚠ Unity は .html を TextAsset として取り込む。Resources.Load("Visitor/visitor") で読まれる。
    文を直したら APK を焼き直す（卓の静的配信と違い、ファイルを置き換えても届かない）。
-->
<style>
  :root{
    --bg:#000; --fg:#fffaf0; --accent:#ffdead;
    --ok:#5ad19a; --warn:#ffae5e; --ng:#ff6b5e;
    --line:rgba(255,250,240,.18); --mute:.55; --sub:.75;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; padding:0 20px calc(28px + env(safe-area-inset-bottom));
    background:radial-gradient(circle at top left,#1a1a1a 0%,var(--bg) 100%) fixed;
    color:var(--fg);
    font:20px/1.7 "Noto Sans JP",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-text-size-adjust:100%;
    max-width:900px; margin-inline:auto;
  }
  header{
    position:sticky; top:0; z-index:5; padding:16px 0 10px;
    background:linear-gradient(#000 70%,rgba(0,0,0,0));
    display:flex; align-items:baseline; gap:12px;
  }
  h1{font-size:20px; margin:0; letter-spacing:.14em; border-bottom:2px solid var(--accent); padding-bottom:2px}
  .who{margin-left:auto; font-size:14px; opacity:var(--sub); letter-spacing:.06em; font-family:ui-monospace,Consolas,monospace}
  .who.ng{color:var(--ng); opacity:1}
  h2{
    font-size:12px; letter-spacing:.16em; text-transform:uppercase;
    opacity:var(--mute); margin:28px 0 10px; font-weight:600;
  }
  button{
    font:inherit; color:var(--fg); background:transparent;
    border:1px solid var(--line); border-radius:0;
    min-height:64px; padding:12px 18px; width:100%; text-align:left;
    touch-action:manipulation;
  }
  button:active{border-color:var(--accent); color:var(--accent)}
  button:disabled{opacity:.35}
  .big{border-color:var(--accent); color:var(--accent); font-weight:600; text-align:center; font-size:22px; min-height:76px}
  .row{display:flex; gap:10px; margin-bottom:10px}
  .row>*{flex:1}
  .lang button{text-align:center; font-size:22px}
  .lang button.on{border-color:var(--accent); color:var(--accent); background:rgba(255,222,173,.08)}
  .lang button.on::before{content:"［"} .lang button.on::after{content:"］"}
  .notice{
    border:1px solid var(--line); padding:18px 20px; margin:0 0 12px;
    white-space:pre-line; font-size:19px;
  }
  .toggle{
    display:flex; align-items:center; gap:16px; text-align:left; min-height:96px;
  }
  .toggle .box{
    flex:0 0 40px; height:40px; border:2px solid var(--line); display:flex;
    align-items:center; justify-content:center; font-size:26px; color:var(--accent);
  }
  .toggle.on{border-color:var(--accent)} .toggle.on .box{border-color:var(--accent)}
  .toggle .t{font-size:21px; font-weight:600}
  .toggle .d{font-size:15px; opacity:var(--sub); margin-top:2px; line-height:1.5}

  /* ---- 送る前の 1 行 ---- */
  .status{border:1px solid var(--line); padding:14px 18px; margin:10px 0 0; font-size:17px}
  .status.ng{border-color:var(--ng)} .status.ng .h{color:var(--ng)}
  .status .h{font-weight:600; font-size:19px}
  .status .d{opacity:var(--sub); font-size:15px; margin-top:4px}

  /* ---- 送った後: ヘッドセットが実際に持っている値を、送った値と並べて出す ----
     色は 3 つだけ。緑 = 反映された / 橙 = 待っている / 赤 = 届かない */
  .result{border:2px solid var(--line); padding:18px 20px; margin:12px 0 0}
  .result.ok{border-color:var(--ok)} .result.warn{border-color:var(--warn)} .result.ng{border-color:var(--ng)}
  .result .rh{display:flex; align-items:center; gap:14px; font-size:24px; font-weight:600; line-height:1.3}
  .result .rh .glyph{font-size:44px; line-height:1; width:52px; text-align:center; flex:0 0 52px}
  .result.ok .rh{color:var(--ok)} .result.warn .rh{color:var(--warn)} .result.ng .rh{color:var(--ng)}
  .result .rd{opacity:var(--sub); font-size:15px; margin:6px 0 0 66px; line-height:1.5}
  .cmp{margin:16px 0 0; border-top:1px solid var(--line)}
  .cmp .r{display:grid; grid-template-columns:5.5em 1fr 1.4em 1fr 2em; align-items:center; gap:8px;
          padding:12px 0; border-bottom:1px solid var(--line); font-size:20px}
  .cmp .k{opacity:var(--sub); font-size:15px}
  .cmp .sent{opacity:var(--sub)}
  .cmp .arrow{opacity:var(--mute); text-align:center}
  .cmp .got{font-weight:600}
  .cmp .mark{text-align:center; font-size:24px; font-weight:700}
  .cmp .r.hit .got,.cmp .r.hit .mark{color:var(--ok)}
  .cmp .r.miss .mark{color:var(--warn)}
  .cmp .r.stale .got{opacity:.4}
  .cmp .caphead{display:grid; grid-template-columns:5.5em 1fr 1.4em 1fr 2em; gap:8px; font-size:12px;
                letter-spacing:.12em; opacity:var(--mute); padding:8px 0 0; text-transform:uppercase}
  .note{font-size:14px; opacity:var(--mute); line-height:1.55; margin:6px 0 0}
  details{margin-top:40px; border-top:1px solid var(--line); padding-top:6px}
  summary{font-size:13px; letter-spacing:.14em; opacity:var(--mute); cursor:pointer; padding:10px 0; list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸ "} details[open] summary::before{content:"▾ "}
  .staff{font-size:15px}
  .staff button{min-height:48px; font-size:15px; padding:8px 12px}
  .dev{border:1px solid var(--line); padding:10px 12px; margin-bottom:8px}
  .dev .id{font-family:ui-monospace,Consolas,monospace; font-size:16px}
  .dev .lamp{display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--ng); margin-right:8px; vertical-align:middle}
  .dev .lamp.ok{background:var(--ok)}
  .dev .meta{opacity:var(--sub); font-size:13px; margin:2px 0 8px; line-height:1.6}
  .busy{opacity:.5; pointer-events:none}
</style>
</head>
<body>

<header>
  <h1>廻リ視</h1>
  <span class="who" id="who">—</span>
</header>

<h2 id="hLang">言語 / Language / Langue</h2>
<div class="row lang" id="langRow">
  <button data-lang="ja">日本語</button>
  <button data-lang="en">English</button>
  <button data-lang="fr">Français</button>
</div>

<h2 id="hNotice">注意</h2>
<div class="notice" id="noticeText"></div>

<h2 id="hRelief">設定</h2>
<button class="toggle" id="reliefBtn">
  <span class="box" id="reliefBox"></span>
  <span>
    <div class="t" id="reliefTitle"></div>
    <div class="d" id="reliefDesc"></div>
  </span>
</button>

<div style="margin-top:14px">
  <button class="big" id="sendBtn"></button>
</div>
<div class="status" id="status"><div class="h" id="stH">—</div><div class="d" id="stD"></div></div>
<div class="result" id="result" hidden>
  <div class="rh"><span class="glyph" id="rG">…</span><span id="rH">—</span></div>
  <div class="rd" id="rD"></div>
  <div class="cmp">
    <div class="caphead"><span></span><span id="capSent">選んだ</span><span></span><span id="capGot">ヘッドセット</span><span></span></div>
    <div class="r" id="rowLang"><span class="k" id="kLang">言語</span><span class="sent" id="sLang">—</span><span class="arrow">→</span><span class="got" id="gLang">—</span><span class="mark" id="mLang">…</span></div>
    <div class="r" id="rowRelief"><span class="k" id="kRelief">軽減</span><span class="sent" id="sRelief">—</span><span class="arrow">→</span><span class="got" id="gRelief">—</span><span class="mark" id="mRelief">…</span></div>
  </div>
</div>
<div class="row" style="margin-top:10px">
  <button id="resetBtn" style="text-align:center"></button>
</div>

<details class="staff" id="staff">
  <summary>スタッフ</summary>
  <p class="note">この面はスタッフだけが触る。体験者に見せる文は上の 3 言語のところ。
    この面はヘッドセット自身が配っている（PC も卓も経由しない）。α 用のタブレットは α の機の URL を開く。</p>

  <h2>このヘッドセット</h2>
  <div id="dev" class="dev"><p class="note">読み込み中…</p></div>
  <div class="row"><button id="clearBtn">枠を空にする（次の人は日本語・軽減なしから）</button></div>
  <p class="note">
    体験者が A を押して始めた瞬間に、ヘッドセットが枠を空にする。送ったまま帰った人の設定が残っていたら上のボタン。
    枠が空でも、いま出ている値（言語・軽減）はそのまま。戻すのはランのやり直し（タイトルの出し直し）。
  </p>
</details>

<script>
(() => {
  'use strict';
  // ---- 文言（体験者が読む面。3 言語）----------------------------------------
  // ⚠ 注意書きは HMD の TitleNotice と同じ文。片方だけ直すと受付とヘッドセットで食い違う。
  const T = {
    ja: {
      hNotice: '注意',
      notice: '本作品にはホラー表現および、\n不安や恐怖を感じる演出が含まれます\n\n体験中に気分が悪くなった場合は、\nその場で立ち止まり、ヘッドセットを外して\nスタッフにお声がけください',
      hRelief: '設定',
      reliefTitle: 'ホラー軽減モード',
      reliefDesc: '音が半分になり、陽気な曲が流れます。映像と時間は変わりません。',
      send: 'この設定で始める',
      reset: 'はじめから',
      kLang: '言語', kRelief: '軽減', capSent: '選んだ', capGot: 'ヘッドセット',
      reliefOn: 'あり', reliefOff: 'なし',
      pre: {
        idle: ['まだ送っていません', '言語と設定を選んで、「この設定で始める」を押してください'],
        noserver: ['ヘッドセットに繋がっていません', 'スタッフを呼んでください'],
      },
      post: {
        sending: ['送っています…', ''],
        applied: ['ヘッドセットに反映されました', 'スタッフの案内でヘッドセットを着けてください'],
        waiting: ['ヘッドセットの反映を待っています…', '注意書きの画面になると反映されます'],
        later: ['いまヘッドセットは体験中です', '次の体験の開始時に反映されます'],
        noserver: ['ヘッドセットに繋がっていません', 'スタッフを呼んでください'],
        fail: ['送れませんでした', 'もう一度押してください'],
      },
    },
    en: {
      hNotice: 'Notice',
      notice: 'This work contains horror imagery and\nscenes meant to unsettle or frighten.\n\nIf you feel unwell at any point, stop\nwhere you are, remove the headset and\nlet a member of staff know.',
      hRelief: 'Settings',
      reliefTitle: 'Reduced-horror mode',
      reliefDesc: 'Sound is halved and a cheerful tune plays. The visuals and timing do not change.',
      send: 'Start with these settings',
      reset: 'Start over',
      kLang: 'Language', kRelief: 'Reduced', capSent: 'Chosen', capGot: 'Headset',
      reliefOn: 'on', reliefOff: 'off',
      pre: {
        idle: ['Not sent yet', 'Choose a language and settings, then press "Start with these settings"'],
        noserver: ['Not connected to the headset', 'Please call a member of staff'],
      },
      post: {
        sending: ['Sending…', ''],
        applied: ['Applied on the headset', 'Put on the headset when staff guide you'],
        waiting: ['Waiting for the headset…', 'It applies once the headset shows the notice screen'],
        later: ['The headset is in use right now', 'It will apply when the next session starts'],
        noserver: ['Not connected to the headset', 'Please call a member of staff'],
        fail: ['Could not send', 'Please press again'],
      },
    },
    fr: {
      hNotice: 'Avertissement',
      notice: "Cette expérience contient des scènes\nd'horreur, conçues pour inquiéter\nou effrayer.\n\nSi vous vous sentez mal, arrêtez-vous,\nretirez le casque et prévenez\nun membre du personnel.",
      hRelief: 'Réglages',
      reliefTitle: 'Mode horreur atténuée',
      reliefDesc: 'Le son est réduit de moitié et une musique gaie est diffusée. Les images et la durée ne changent pas.',
      send: 'Commencer avec ces réglages',
      reset: 'Recommencer',
      kLang: 'Langue', kRelief: 'Atténué', capSent: 'Choisi', capGot: 'Casque',
      reliefOn: 'oui', reliefOff: 'non',
      pre: {
        idle: ['Pas encore envoyé', 'Choisissez une langue et des réglages, puis appuyez sur « Commencer »'],
        noserver: ['Non connecté au casque', 'Appelez un membre du personnel'],
      },
      post: {
        sending: ['Envoi…', ''],
        applied: ['Appliqué sur le casque', 'Mettez le casque quand le personnel vous guide'],
        waiting: ['En attente du casque…', 'Appliqué dès que le casque affiche l’avertissement'],
        later: ['Le casque est en cours d’utilisation', 'Appliqué au début de la prochaine session'],
        noserver: ['Non connecté au casque', 'Appelez un membre du personnel'],
        fail: ['Envoi impossible', 'Appuyez de nouveau'],
      },
    },
  };
  const LANG_NAME = { ja: '日本語', en: 'English', fr: 'Français' };
  const GLYPH = { applied: '✓', waiting: '…', sending: '…', later: '⏳', noserver: '✕', fail: '✕' };
  const TONE = { applied: 'ok', waiting: 'warn', sending: 'warn', later: 'warn', noserver: 'ng', fail: 'ng' };

  const $ = (id) => document.getElementById(id);
  const state = {
    lang: 'ja', relief: false,
    sent: null,          // {lang, relief, seq} 最後に送ったもの
    ui: 'idle',          // idle | sending | sent | fail
    st: null,            // GET /status の直近（ヘッドセットの実値）
    online: false,
  };

  // ---- 描画 ---------------------------------------------------------------
  function renderText() {
    const t = T[state.lang];
    $('hNotice').textContent = t.hNotice;
    $('noticeText').textContent = t.notice;
    $('hRelief').textContent = t.hRelief;
    $('reliefTitle').textContent = t.reliefTitle;
    $('reliefDesc').textContent = t.reliefDesc;
    $('sendBtn').textContent = t.send;
    $('resetBtn').textContent = t.reset;
    $('kLang').textContent = t.kLang; $('kRelief').textContent = t.kRelief;
    $('capSent').textContent = t.capSent; $('capGot').textContent = t.capGot;
    document.querySelectorAll('#langRow button').forEach((b) => {
      b.classList.toggle('on', b.dataset.lang === state.lang);
    });
    $('reliefBtn').classList.toggle('on', state.relief);
    $('reliefBox').textContent = state.relief ? '✓' : '';
    const who = $('who');
    if (state.online && state.st) {
      who.className = 'who';
      who.textContent = (state.st.model || 'Quest') + '  ' + (state.st.ip || location.hostname);
    } else {
      who.className = 'who ng';
      who.textContent = location.hostname + ' — 応答なし';
    }
  }

  // 送った後。**ヘッドセットが実際に返している値**で決める（送ったつもりを出さない）。
  function postKey() {
    if (state.ui === 'sending' || state.ui === 'fail') return state.ui;
    if (!state.online || !state.st) return 'noserver';
    const s = state.st;
    const hit = s.lang === state.sent.lang && s.relief === state.sent.relief
      && s.appliedSeq >= state.sent.seq && state.sent.seq > 0;
    if (hit) return 'applied';
    if (s.phase === 'RUN' || s.phase === 'END') return 'later';
    return 'waiting';
  }

  function renderStatus() {
    const t = T[state.lang];
    if (!state.sent && state.ui !== 'sending' && state.ui !== 'fail') {
      const key = state.online ? 'idle' : 'noserver';
      const s = t.pre[key];
      $('status').hidden = false; $('result').hidden = true;
      $('status').className = 'status ' + (key === 'idle' ? '' : 'ng');
      $('stH').textContent = s[0]; $('stD').textContent = s[1];
      $('sendBtn').disabled = false;
      return;
    }
    const key = postKey();
    const s = t.post[key];
    $('status').hidden = true; $('result').hidden = false;
    $('result').className = 'result ' + (TONE[key] || '');
    $('rG').textContent = GLYPH[key] || '…';
    $('rH').textContent = s[0]; $('rD').textContent = s[1];
    $('sendBtn').disabled = key === 'sending';

    // 2 行の比較。右列はヘッドセットが返した値そのもの。
    const dev = state.online ? state.st : null;
    const sent = state.sent || { lang: state.lang, relief: state.relief };
    const gotLang = dev ? dev.lang : null;
    const gotRelief = dev ? dev.relief : null;
    const alive = !!dev;
    const settled = key === 'applied';
    const holding = key === 'later';   // いまの体験者の値が出ている（比べても意味が無い）
    row('rowLang', 'sLang', 'gLang', 'mLang', LANG_NAME[sent.lang],
        gotLang == null ? '—' : LANG_NAME[gotLang] || gotLang,
        alive && gotLang === sent.lang && settled, alive, holding);
    row('rowRelief', 'sRelief', 'gRelief', 'mRelief', sent.relief ? t.reliefOn : t.reliefOff,
        gotRelief == null ? '—' : (gotRelief ? t.reliefOn : t.reliefOff),
        alive && gotRelief === sent.relief && settled, alive, holding);
  }
  function row(rowId, sId, gId, mId, sentText, gotText, hit, alive, holding) {
    $(sId).textContent = sentText;
    $(gId).textContent = gotText;
    const r = $(rowId);
    r.className = 'r ' + (hit ? 'hit' : (alive && !holding ? 'miss' : 'stale'));
    $(mId).textContent = hit ? '✓' : (holding ? '⏳' : (alive ? '…' : '—'));
  }

  function renderStaff() {
    const box = $('dev');
    const s = state.st;
    if (!state.online || !s) {
      box.innerHTML = `<span class="lamp"></span><span class="id">${location.host}</span>
        <div class="meta">応答がありません。ヘッドセットが起動しているか、同じ Wi-Fi か、URL の IP が合っているかを見る。</div>`;
      return;
    }
    const pend = s.pending ? `${LANG_NAME[s.pending.lang] || s.pending.lang} ・ 軽減 ${s.pending.relief ? 'あり' : 'なし'}（受理 ${s.pending.seq}）` : '空';
    box.innerHTML = `<span class="lamp ok"></span><span class="id">${s.model || '?'}  ${s.ip || location.hostname}:${s.port || ''}</span>
      <div class="meta">${s.phase || '—'}${s.titleStage ? '／' + s.titleStage : ''} ・ いま ${LANG_NAME[s.lang] || s.lang} ・ 軽減 ${s.relief ? 'あり' : 'なし'}<br>
      枠: ${pend} ・ 書いた受理番号 ${s.appliedSeq} ・ 書いた回数 ${s.applyCount} ・ 受けた累計 ${s.received}${s.rejected ? ' ・ 読めなかった ' + s.rejected : ''}</div>`;
    $('clearBtn').disabled = !s.pending;
  }

  function render() { renderText(); renderStatus(); renderStaff(); }

  // ---- ヘッドセットとの通信（この面を配っている機そのもの）--------------------------
  async function post(path, body) {
    const r = await fetch(path, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body == null ? '' : JSON.stringify(body),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || j.ok === false) throw new Error(j.error || `HTTP ${r.status}`);
    return j;
  }

  async function send() {
    state.ui = 'sending'; renderStatus();
    try {
      const j = await post('./set', { lang: state.lang, relief: state.relief });
      state.sent = { lang: state.lang, relief: state.relief, seq: j.seq || 0 };
      state.ui = 'sent';
      await poll();
      $('result').scrollIntoView({ behavior: 'smooth', block: 'center' });
    } catch (e) {
      console.warn('set failed', e);
      state.ui = 'fail';
    }
    render();
  }

  async function poll() {
    try {
      const r = await fetch('./status', { cache: 'no-store' });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      state.st = await r.json();
      state.online = !!state.st.ok;
    } catch (e) {
      state.online = false;
    }
    renderText(); renderStatus(); renderStaff();
  }

  // ---- 操作 ---------------------------------------------------------------
  $('langRow').addEventListener('click', (ev) => {
    const b = ev.target.closest('button[data-lang]');
    if (!b) return;
    state.lang = b.dataset.lang;
    render();
  });
  $('reliefBtn').addEventListener('click', () => { state.relief = !state.relief; render(); });
  $('sendBtn').addEventListener('click', send);
  $('resetBtn').addEventListener('click', () => {
    // 面だけ戻す（枠は体験者が始めた瞬間にヘッドセットが空にする。送ったまま帰った人の分はスタッフ欄で空にする）
    state.lang = 'ja'; state.relief = false; state.sent = null; state.ui = 'idle';
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  $('clearBtn').addEventListener('click', async () => {
    $('clearBtn').classList.add('busy');
    try { await post('./clear'); } catch (e) { console.warn('clear failed', e); }
    $('clearBtn').classList.remove('busy');
    await poll();
  });

  render();
  poll();
  setInterval(poll, 2000);
})();
</script>
</body>
</html>
