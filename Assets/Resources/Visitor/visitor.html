<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080604">
<title>廻リ視 — 体験の前に</title>
<!--
  Quest 自身が :8090 で配る来場者用の面。PC とウェブ卓は経由しない。
  注意書きは HMD の TitleNotice と同文。外部 CDN と Web フォントは使わない。
  博士の静止画は ./asset/doctor.jpg。GET /status の実値で反映を判定する。
-->
<style>
  :root {
    color-scheme: dark;
    --bg: #080604;
    --ink: #f2e8d7;
    --muted: #c4b8a5;
    --faint: #817669;
    --line: rgba(242, 232, 215, .2);
    --line-strong: rgba(242, 232, 215, .42);
    --red: #a82229;
    --red-deep: #611419;
    --gold: #e7cf9f;
    --error: #e1847e;
    --serif: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "Noto Serif JP", "Noto Serif CJK JP", Georgia, serif;
    --sans: "Segoe UI", "Helvetica Neue", Arial, "Noto Sans JP", "Hiragino Sans", sans-serif;
    --ease: cubic-bezier(.16, 1, .3, 1);
  }
  * { box-sizing: border-box; }
  html { min-height: 100%; background: var(--bg); }
  body {
    min-height: 100%;
    margin: 0;
    background:
      radial-gradient(circle at 26% 18%, rgba(107, 53, 30, .11), transparent 32rem),
      var(--bg);
    color: var(--ink);
    font: 16px/1.55 var(--serif);
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }
  button, input { font: inherit; }
  button, label {
    touch-action: manipulation;
    -webkit-tap-highlight-color: rgba(168, 34, 41, .22);
  }
  button { color: inherit; }
  button:focus-visible, input:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 4px;
  }
  .skip {
    position: fixed;
    z-index: 20;
    left: 12px;
    top: 12px;
    padding: 10px 14px;
    background: var(--ink);
    color: var(--bg);
    transform: translateY(-160%);
    transition: transform .2s var(--ease);
  }
  .skip:focus { transform: none; }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .stage {
    min-height: 100svh;
    display: grid;
    grid-template-columns: minmax(540px, 52%) minmax(0, 48%);
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas:
      "header portrait"
      "content portrait"
      "footer footer";
    overflow: clip;
  }
  .topbar {
    grid-area: header;
    z-index: 2;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    padding: max(20px, env(safe-area-inset-top)) 38px 12px max(38px, env(safe-area-inset-left));
  }
  .brand {
    margin: 0;
    font-size: clamp(17px, 1.8vw, 23px);
    font-weight: 500;
    letter-spacing: .32em;
    white-space: nowrap;
  }
  .brand::after {
    content: "";
    display: block;
    width: 54px;
    height: 5px;
    margin-top: 7px;
    background: repeating-linear-gradient(120deg, var(--red) 0 5px, transparent 5px 9px);
  }
  .connection {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 44px;
    color: var(--muted);
    font: 11px/1.3 var(--sans);
    letter-spacing: .08em;
    text-align: right;
    border: 0;
    background: transparent;
    cursor: pointer;
  }
  .connection-dot {
    width: 8px;
    height: 8px;
    flex: 0 0 8px;
    border: 1px solid currentColor;
    transform: rotate(45deg);
  }
  .connection[data-state="online"] { color: var(--gold); }
  .connection[data-state="online"] .connection-dot { background: currentColor; }
  .connection[data-state="offline"] { color: var(--error); }
  .staff-label { margin-left: 6px; padding-left: 12px; border-left: 1px solid var(--line); color: var(--muted); }

  .portrait {
    grid-area: portrait;
    position: relative;
    min-width: 0;
    min-height: 0;
    margin: 0;
    background: #0d0907;
    overflow: hidden;
  }
  .portrait img {
    width: 100%;
    height: 100%;
    min-height: 560px;
    display: block;
    object-fit: cover;
    object-position: 95% center;
    filter: saturate(.84) contrast(1.04) brightness(.92);
  }
  .portrait::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(90deg, var(--bg) 0, rgba(8, 6, 4, .22) 12%, transparent 35%),
      linear-gradient(180deg, rgba(8, 6, 4, .18), transparent 25%, transparent 70%, rgba(8, 6, 4, .7));
  }

  .content {
    grid-area: content;
    position: relative;
    z-index: 2;
    width: min(100%, 760px);
    min-width: 0;
    padding: 8px 42px 28px max(38px, env(safe-area-inset-left));
    align-self: center;
  }
  h1 {
    margin: 0 0 20px;
    font-size: clamp(27px, 3vw, 42px);
    font-weight: 500;
    line-height: 1.18;
    letter-spacing: .12em;
    text-wrap: balance;
    scroll-margin-top: 24px;
  }
  .notice {
    margin-bottom: 22px;
    padding: 14px 0 15px;
    border-top: 1px solid var(--line-strong);
    border-bottom: 1px solid var(--line);
  }
  .eyebrow {
    display: block;
    margin-bottom: 7px;
    color: var(--gold);
    font: 11px/1.3 var(--sans);
    text-transform: uppercase;
    letter-spacing: .22em;
  }
  .notice-body {
    margin: 0;
    max-width: 44em;
    color: var(--ink);
    font-size: clamp(16px, 1.45vw, 19px);
    line-height: 1.65;
    letter-spacing: .025em;
    white-space: pre-line;
    overflow-wrap: anywhere;
  }
  .system-note {
    margin: -8px 0 18px;
    padding: 10px 12px;
    border-left: 2px solid var(--gold);
    background: rgba(231, 207, 159, .07);
    color: var(--ink);
    font-size: 15px;
  }

  .surface {
    transition: opacity .34s var(--ease), transform .34s var(--ease);
  }
  .surface:not(.is-active) {
    position: absolute;
    inset: 8px 42px 28px max(38px, env(safe-area-inset-left));
    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;
  }
  .surface[hidden] { display: none; }
  .settings { margin: 0; }
  fieldset {
    min-width: 0;
    margin: 0;
    padding: 0 0 17px;
    border: 0;
  }
  fieldset + fieldset {
    padding-top: 15px;
    border-top: 1px solid var(--line);
  }
  legend {
    width: 100%;
    margin: 0 0 9px;
    padding: 0;
    color: var(--muted);
    font: 12px/1.3 var(--sans);
    letter-spacing: .16em;
  }
  .choices {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }
  .choices.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .choice {
    position: relative;
    min-width: 0;
    min-height: 54px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid transparent;
    border-bottom-color: var(--line-strong);
    background: rgba(242, 232, 215, .02);
    cursor: pointer;
    transition:
      color .25s var(--ease),
      background-color .25s var(--ease),
      border-color .25s var(--ease),
      transform .25s var(--ease);
  }
  .choice:hover {
    border-color: var(--line-strong);
    background: rgba(242, 232, 215, .055);
  }
  .choice:active { transform: translateY(1px); }
  .choice::after {
    content: "";
    position: absolute;
    left: -1px;
    top: 12px;
    bottom: 12px;
    width: 3px;
    background: var(--red);
    transform: scaleY(0);
    transition: transform .35s var(--ease);
  }
  .choice:has(input:checked)::after { transform: scaleY(1); }
  .choice:focus-within { outline: 2px solid var(--gold); outline-offset: 3px; }
  .choice input {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    overflow: hidden;
  }
  .choice-text {
    min-width: 0;
    font-size: clamp(16px, 1.55vw, 20px);
    line-height: 1.2;
    letter-spacing: .035em;
    overflow-wrap: anywhere;
  }
  .choice-mark {
    width: 16px;
    height: 16px;
    margin-left: auto;
    flex: 0 0 16px;
    display: grid;
    place-items: center;
    border: 1px solid transparent;
    color: transparent;
    font: 11px/1 var(--sans);
    transform: rotate(45deg);
    transition:
      color .25s var(--ease),
      background-color .25s var(--ease),
      border-color .25s var(--ease);
  }
  .choice-mark::before { content: ""; width: 7px; height: 4px; border: solid currentColor; border-width: 0 0 1px 1px; transform: rotate(-90deg); }
  .choice:has(input:checked) {
    border-bottom-color: var(--gold);
    background: linear-gradient(100deg, rgba(168, 34, 41, .20), rgba(242, 232, 215, .035));
    color: #fff9ee;
  }
  .choice input:checked ~ .choice-mark {
    border-color: var(--gold);
    background: var(--red-deep);
    color: var(--ink);
  }
  .relief-description {
    min-height: 3.25em;
    margin: 9px 0 0 2px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-line;
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity .28s var(--ease), transform .28s var(--ease);
  }
  .relief-description.is-visible { opacity: 1; transform: none; }

  .result { padding-top: 2px; }
  .result-state {
    display: grid;
    grid-template-columns: 38px minmax(0, 1fr);
    gap: 12px 14px;
    align-items: center;
    margin-bottom: 22px;
  }
  .status-glyph {
    grid-row: 1 / span 2;
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border: 1px solid var(--line-strong);
    color: var(--ink);
    font: 17px/1 var(--sans);
    transform: rotate(45deg);
  }
  .status-glyph span { transform: rotate(-45deg); }
  .result[data-tone="ok"] .status-glyph {
    border-color: var(--gold);
    background: rgba(231, 207, 159, .11);
    color: var(--gold);
  }
  .result[data-tone="error"] .status-glyph {
    border-color: var(--error);
    color: var(--error);
  }
  .result-title {
    margin: 0;
    font-size: clamp(22px, 2.4vw, 32px);
    font-weight: 500;
    line-height: 1.25;
    letter-spacing: .07em;
    overflow-wrap: anywhere;
  }
  .result-detail {
    margin: 0;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.5;
    overflow-wrap: anywhere;
  }
  .values {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  .values th, .values td {
    padding: 11px 10px;
    border-bottom: 1px solid var(--line);
    text-align: left;
    overflow-wrap: anywhere;
  }
  .values thead th {
    color: var(--muted);
    font: 11px/1.3 var(--sans);
    letter-spacing: .12em;
  }
  .values thead th:first-child { width: 29%; }
  .values tbody th {
    color: var(--muted);
    font: 12px/1.3 var(--sans);
    font-weight: 400;
    letter-spacing: .08em;
  }
  .values td {
    color: var(--ink);
    font-size: clamp(16px, 1.7vw, 21px);
    font-variant-numeric: tabular-nums;
  }
  .result-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 20px;
  }
  .secondary, .retry {
    min-height: 50px;
    padding: 10px 17px;
    border: 1px solid var(--line-strong);
    background: rgba(242, 232, 215, .035);
    font-size: 16px;
    letter-spacing: .06em;
    cursor: pointer;
    transition:
      color .25s var(--ease),
      background-color .25s var(--ease),
      border-color .25s var(--ease),
      transform .25s var(--ease);
  }
  .secondary:hover, .retry:hover {
    border-color: var(--gold);
    background: rgba(242, 232, 215, .08);
  }
  .secondary:active, .retry:active { transform: translateY(1px); }
  .retry {
    border-color: var(--red);
    background: rgba(168, 34, 41, .16);
  }

  .footer {
    grid-area: footer;
    position: relative;
    z-index: 3;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: end;
    gap: 30px;
    min-height: 126px;
    padding:
      20px
      max(38px, env(safe-area-inset-right))
      max(26px, env(safe-area-inset-bottom))
      max(38px, env(safe-area-inset-left));
    background: linear-gradient(180deg, transparent, rgba(8, 6, 4, .94) 43%);
  }
  .subtitle {
    justify-self: center;
    align-self: center;
    width: min(100%, 760px);
    min-height: 3.2em;
    position: relative;
    text-align: center;
    font-size: clamp(16px, 1.65vw, 21px);
    line-height: 1.6;
    letter-spacing: .04em;
    text-wrap: balance;
    text-shadow: 0 2px 14px #000;
  }
  .subtitle-reserve { visibility: hidden; }
  .subtitle-typed { position: absolute; inset: 0; }
  .subtitle-dash { color: var(--gold); margin-right: .45em; }
  .primary {
    min-height: 62px;
    max-width: 320px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 13px;
    padding: 12px 19px;
    border: 1px solid var(--line-strong);
    background: rgba(8, 6, 4, .72);
    font-size: clamp(16px, 1.55vw, 20px);
    line-height: 1.25;
    letter-spacing: .08em;
    text-align: left;
    cursor: pointer;
    transition:
      color .28s var(--ease),
      background-color .28s var(--ease),
      border-color .28s var(--ease),
      transform .28s var(--ease);
  }
  .primary::before {
    content: "";
    width: 19px;
    height: 19px;
    flex: 0 0 19px;
    border: 1px solid var(--gold);
    background: var(--red-deep);
    transform: rotate(45deg);
  }
  .primary:hover {
    border-color: var(--gold);
    background: rgba(97, 20, 25, .36);
  }
  .primary:active { transform: translateY(1px); }
  .primary[disabled] { cursor: wait; opacity: .52; }
  .primary[hidden] { display: none; }

  .staff-dialog {
    width: min(92vw, 520px);
    max-height: min(86vh, 700px);
    padding: 26px;
    border: 1px solid var(--line-strong);
    background: #0d0a07;
    color: var(--ink);
    box-shadow: 0 28px 80px rgba(0, 0, 0, .7);
    overscroll-behavior: contain;
  }
  .staff-dialog::backdrop { background: rgba(0, 0, 0, .72); }
  .staff-dialog h2 {
    margin: 0 42px 18px 0;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: .08em;
  }
  .staff-close {
    position: absolute;
    top: 15px;
    right: 15px;
    width: 44px;
    height: 44px;
    border: 1px solid var(--line);
    background: transparent;
    cursor: pointer;
  }
  .staff-summary {
    min-height: 8em;
    margin: 0 0 16px;
    padding: 14px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    color: var(--muted);
    font: 13px/1.8 ui-monospace, Consolas, monospace;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .staff-message {
    min-height: 1.6em;
    margin: 10px 0;
    color: var(--gold);
    font: 13px/1.6 var(--sans);
  }
  .staff-clear {
    min-height: 48px;
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--red);
    background: rgba(168, 34, 41, .14);
    color: var(--ink);
    cursor: pointer;
  }
  .staff-clear[disabled] { opacity: .45; cursor: default; }

  @media (max-width: 980px) {
    .stage { grid-template-columns: minmax(500px, 58%) minmax(0, 42%); }
    .topbar { padding-left: 26px; padding-right: 22px; }
    .content { padding-left: 26px; padding-right: 28px; }
    .surface:not(.is-active) { left: 26px; right: 28px; }
    .choice { padding-inline: 9px; }
    .footer { padding-left: 26px; padding-right: 26px; }
  }

  @media (max-aspect-ratio: 4/5), (max-width: 720px) {
    .stage {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto clamp(190px, 30vh, 330px) auto auto;
      grid-template-areas:
        "header"
        "portrait"
        "content"
        "footer";
      overflow: visible;
    }
    .topbar {
      padding:
        max(15px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        12px
        max(20px, env(safe-area-inset-left));
    }
    .portrait img {
      min-height: 0;
      object-position: 54% 31%;
    }
    .portrait::after {
      background: linear-gradient(180deg, rgba(8, 6, 4, .15), transparent 46%, var(--bg));
    }
    .content {
      width: 100%;
      padding:
        8px
        max(24px, env(safe-area-inset-right))
        26px
        max(24px, env(safe-area-inset-left));
    }
    .surface:not(.is-active) {
      inset:
        0
        max(24px, env(safe-area-inset-right))
        0
        max(24px, env(safe-area-inset-left));
    }
    h1 { margin-bottom: 16px; }
    .notice { margin-bottom: 18px; }
    .footer {
      grid-template-columns: minmax(0, 1fr);
      gap: 14px;
      min-height: 0;
      padding:
        18px
        max(24px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(24px, env(safe-area-inset-left));
      background: var(--bg);
    }
    .subtitle {
      justify-self: stretch;
      min-height: 3.2em;
    }
    .primary {
      width: 100%;
      max-width: none;
      justify-self: stretch;
    }
  }

  @media (max-width: 500px) {
    .brand { font-size: 16px; }
    .connection { max-width: 46%; font-size: 10px; }
    .stage { grid-template-rows: auto 180px auto auto; }
    .content {
      padding-left: max(18px, env(safe-area-inset-left));
      padding-right: max(18px, env(safe-area-inset-right));
    }
    .surface:not(.is-active) {
      left: max(18px, env(safe-area-inset-left));
      right: max(18px, env(safe-area-inset-right));
    }
    h1 { font-size: 27px; }
    .notice-body { font-size: 16px; line-height: 1.58; }
    .choices {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
    }
    .choice { min-height: 62px; padding: 10px 5px; justify-content: center; gap: 5px; flex-wrap: wrap; }
    .choice-mark { position: absolute; bottom: -1px; right: -1px; width: 9px; height: 3px; transform: none; border: 0; }
    .choice-mark::before { content: none; }
    .choice input:checked ~ .choice-mark { width: 100%; background: var(--gold); }
    .relief-description { min-height: 3.2em; }
    .values th, .values td { padding-inline: 6px; }
    .values thead th:first-child { width: 26%; }
    .footer {
      padding-left: max(18px, env(safe-area-inset-left));
      padding-right: max(18px, env(safe-area-inset-right));
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      scroll-behavior: auto !important;
      transition-duration: .01ms !important;
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
</head>
<body>
<a class="skip" href="#main">設定へ移動</a>
<div class="stage">
  <header class="topbar">
    <p class="brand" translate="no">廻リ視</p>
    <button class="connection" id="staffToggle" data-state="checking" type="button" aria-haspopup="dialog" aria-label="スタッフ情報を開く">
      <span class="connection-dot" aria-hidden="true"></span>
      <span id="connectionText" role="status" aria-live="polite">接続を確認中…</span>
      <span class="staff-label" id="staffLabel">スタッフ</span>
    </button>
  </header>

  <figure class="portrait" aria-hidden="true">
    <img src="./asset/doctor.jpg" alt="" width="1672" height="941" draggable="false" fetchpriority="high">
  </figure>

  <main class="content" id="main">
    <section class="surface settings is-active" id="settingsView" aria-labelledby="pageTitle">
      <h1 id="pageTitle">体験の前に</h1>
      <div class="notice" id="notice">
        <span class="eyebrow" id="noticeLabel">注意</span>
        <p class="notice-body" id="noticeBody"></p>
      </div>
      <p class="system-note" id="restartNotice" role="status" hidden></p>

      <form class="settings" id="settingsForm">
        <fieldset>
          <legend id="languageLegend">言語</legend>
          <div class="choices">
            <label class="choice">
              <input type="radio" name="lang" value="ja" checked>
              <span class="choice-text">日本語</span>
              <span class="choice-mark" aria-hidden="true"></span>
            </label>
            <label class="choice">
              <input type="radio" name="lang" value="en">
              <span class="choice-text">English</span>
              <span class="choice-mark" aria-hidden="true"></span>
            </label>
            <label class="choice">
              <input type="radio" name="lang" value="fr">
              <span class="choice-text">Français</span>
              <span class="choice-mark" aria-hidden="true"></span>
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend id="reliefLegend">ホラー軽減</legend>
          <div class="choices two">
            <label class="choice">
              <input type="radio" name="relief" value="off" checked>
              <span class="choice-text" id="reliefOff">なし</span>
              <span class="choice-mark" aria-hidden="true"></span>
            </label>
            <label class="choice">
              <input type="radio" name="relief" value="on">
              <span class="choice-text" id="reliefOn">あり</span>
              <span class="choice-mark" aria-hidden="true"></span>
            </label>
          </div>
          <p class="relief-description" id="reliefDesc" aria-hidden="true"></p>
        </fieldset>
      </form>
    </section>

    <section class="surface result" id="resultView" aria-labelledby="resultTitle" aria-hidden="true" hidden inert>
      <div class="result-state" role="status" aria-live="polite" aria-atomic="true">
        <div class="status-glyph" aria-hidden="true"><span id="resultGlyph">…</span></div>
        <h2 class="result-title" id="resultTitle" tabindex="-1">送信中</h2>
        <p class="result-detail" id="resultDetail"></p>
      </div>
      <table class="values">
        <thead>
          <tr>
            <th scope="col"><span class="sr-only" id="itemHeading">項目</span></th>
            <th scope="col" id="selectedHeading">選んだ設定</th>
            <th scope="col" id="headsetHeading">ヘッドセット</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row" id="resultLanguageLabel">言語</th>
            <td id="selectedLanguage">日本語</td>
            <td id="headsetLanguage">—</td>
          </tr>
          <tr>
            <th scope="row" id="resultReliefLabel">ホラー軽減</th>
            <td id="selectedRelief">なし</td>
            <td id="headsetRelief">—</td>
          </tr>
        </tbody>
      </table>
      <div class="result-actions">
        <button class="retry" id="retryBtn" type="button" hidden>もう一度送る</button>
        <button class="secondary" id="editBtn" type="button" hidden>設定を変える</button>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="subtitle" id="subtitle" aria-hidden="true">
      <span class="subtitle-reserve" id="subtitleReserve"></span>
      <span class="subtitle-typed"><span class="subtitle-dash">―</span><span id="subtitleTyped"></span></span>
    </div>
    <p class="sr-only" id="subtitleAnnouncement" role="status" aria-live="polite" aria-atomic="true"></p>
    <button class="primary" id="sendBtn" type="submit" form="settingsForm">
      <span id="submitLabel">この設定で始める</span>
    </button>
  </footer>
</div>

<dialog class="staff-dialog" id="staff">
  <button class="staff-close" id="staffClose" type="button" aria-label="閉じる">×</button>
  <h2>スタッフ情報</h2>
  <div class="staff-summary" id="staffSummary">読み込み中…</div>
  <p class="staff-message" id="staffMessage" role="status" aria-live="polite"></p>
  <button class="staff-clear" id="clearBtn" type="button">予約を取り消す</button>
</dialog>

<script>
(() => {
  'use strict';

  const T = {
    ja: {
      pageTitle: '体験の前に', noticeLabel: '注意', language: '言語', relief: 'ホラー軽減',
      reliefOn: 'あり', reliefOff: 'なし',
      reliefDesc: 'すべての演出の音量が半分になり、\n陽気な曲が流れます。',
      ask: '使う言語と、恐怖を和らげるかどうかを、教えてください。',
      notice: '本作品にはホラー表現および、\n不安や恐怖を感じる演出が含まれます\n\n体験中に気分が悪くなった場合は、\nその場で立ち止まり、ヘッドセットを外して\nスタッフにお声がけください',
      send: 'この設定で始める', edit: '設定を変える', retry: 'もう一度送る',
      selected: '選んだ設定', headset: 'ヘッドセット', item: '項目',
      restarted: 'ヘッドセットが再起動しました。設定を選び直してください。',
      staff: 'スタッフ', staffOpen: 'スタッフ情報を開く', skip: '設定へ移動',
      connection: { checking: '接続を確認中…', online: '接続済み', offline: '接続を確認できません' },
      post: {
        sending: ['送信中', 'ヘッドセットへ設定を送っています'],
        applied: ['反映済み', 'スタッフの案内でヘッドセットを着けてください'],
        waiting: ['反映待ち', '注意書きの画面になると反映されます'],
        later: ['次回の開始待ち', 'いまの体験が終わると、次の開始時に反映されます'],
        noserver: ['ヘッドセットを確認できません', '通信の回復を待っています。スタッフを呼んでください'],
        fail: ['送信を確認できませんでした', '設定が届いたか確認できません。もう一度送れます'],
      },
    },
    en: {
      pageTitle: 'Before the experience', noticeLabel: 'Notice', language: 'Language', relief: 'Reduced horror',
      reliefOn: 'on', reliefOff: 'off',
      reliefDesc: 'All sound is halved,\nand a cheerful tune plays.',
      ask: 'Tell me your language, and whether you would like the horror softened.',
      notice: 'This work contains horror imagery and\nscenes meant to unsettle or frighten.\n\nIf you feel unwell at any point, stop\nwhere you are, remove the headset and\nlet a member of staff know.',
      send: 'Start with these settings', edit: 'Change settings', retry: 'Send again',
      selected: 'Selected settings', headset: 'Headset', item: 'Item',
      restarted: 'The headset restarted. Please choose the settings again.',
      staff: 'Staff', staffOpen: 'Open staff information', skip: 'Skip to settings',
      connection: { checking: 'Checking connection…', online: 'Headset connected', offline: 'Connection unknown' },
      post: {
        sending: ['Sending', 'Sending the settings to the headset'],
        applied: ['Settings applied', 'Put on the headset when staff guide you'],
        waiting: ['Waiting to apply', 'They will apply when the notice screen appears'],
        later: ['Waiting for the next session', 'They will apply when the next session starts'],
        noserver: ['Connection unknown', 'The headset connection cannot be confirmed. Please call a member of staff'],
        fail: ['Could not confirm delivery', 'Delivery could not be confirmed. You can send the settings again'],
      },
    },
    fr: {
      pageTitle: 'Avant l’expérience', noticeLabel: 'Attention', language: 'Langue', relief: 'Horreur atténuée',
      reliefOn: 'oui', reliefOff: 'non',
      reliefDesc: 'Tout le son est réduit de moitié,\net une musique gaie est diffusée.',
      ask: 'Dites-moi votre langue, et si vous souhaitez que l’horreur soit atténuée.',
      notice: "Cette expérience contient des scènes\nd'horreur, conçues pour inquiéter\nou effrayer.\n\nSi vous vous sentez mal, arrêtez-vous,\nretirez le casque et prévenez\nun membre du personnel.",
      send: 'Commencer avec ces réglages', edit: 'Modifier les réglages', retry: 'Renvoyer',
      selected: 'Réglages choisis', headset: 'Casque', item: 'Élément',
      restarted: 'Le casque a redémarré. Veuillez choisir de nouveau les réglages.',
      staff: 'Personnel', staffOpen: 'Ouvrir les informations du personnel', skip: 'Aller aux réglages',
      connection: { checking: 'Vérification de la connexion…', online: 'Casque connecté', offline: 'Connexion non vérifiable' },
      post: {
        sending: ['Envoi en cours', 'Envoi des réglages au casque'],
        applied: ['Réglages appliqués', 'Mettez le casque quand le personnel vous guide'],
        waiting: ['En attente d’application', 'Ils seront appliqués à l’écran d’avertissement'],
        later: ['En attente de la prochaine session', 'Ils seront appliqués au début de la prochaine session'],
        noserver: ['Connexion non vérifiable', 'La connexion au casque ne peut pas être confirmée. Appelez un membre du personnel'],
        fail: ['Envoi non confirmé', 'La réception n’a pas pu être confirmée. Vous pouvez renvoyer les réglages'],
      },
    },
  };

  const LANG_NAME = { ja: '日本語', en: 'English', fr: 'Français' };
  const CPS = { ja: 12, en: 18, fr: 18 };
  const $ = (id) => document.getElementById(id);
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const state = {
    lang: 'ja',
    relief: false,
    sent: null,
    ui: 'idle',
    view: 'edit',
    status: null,
    connection: 'checking',
    subtitleKey: '',
    appliedSeen: false,
    leftWaitAfterApplied: false,
    restartMessage: false,
    lastReceived: null,
    clearing: false,
  };
  let typeTimer = null;
  let surfaceTimer = null;
  let pollInFlight = null;
  let pollController = null;
  function setText(id, text) {
    if ($(id).textContent !== text) $(id).textContent = text;
  }

  function setSubtitle(text, key) {
    if (state.subtitleKey === key) return;
    state.subtitleKey = key;
    if (typeTimer) clearInterval(typeTimer);
    typeTimer = null;
    $('subtitleReserve').textContent = `―${text}`;
    $('subtitleAnnouncement').textContent = text;
    const target = $('subtitleTyped');
    target.textContent = '';
    if (reducedMotion.matches) {
      target.textContent = text;
      return;
    }
    const started = performance.now();
    const cps = CPS[state.lang];
    const step = () => {
      const count = Math.min(text.length, Math.floor((performance.now() - started) * cps / 1000));
      target.textContent = text.slice(0, count);
      if (count >= text.length) {
        clearInterval(typeTimer);
        typeTimer = null;
      }
    };
    step();
    typeTimer = setInterval(step, 40);
  }

  function setSurface(view, focusTarget) {
    const current = view === 'edit' ? $('settingsView') : $('resultView');
    if (state.view === view && !current.hidden) {
      if (focusTarget) focusTarget.focus();
      return;
    }
    if (surfaceTimer) clearTimeout(surfaceTimer);
    const oldSurface = state.view === 'edit' ? $('settingsView') : $('resultView');
    const newSurface = view === 'edit' ? $('settingsView') : $('resultView');
    state.view = view;
    $('sendBtn').hidden = view !== 'edit';
    oldSurface.classList.remove('is-active');
    oldSurface.setAttribute('aria-hidden', 'true');
    oldSurface.inert = true;
    newSurface.hidden = false;
    newSurface.removeAttribute('aria-hidden');
    newSurface.inert = false;
    void newSurface.offsetWidth;
    newSurface.classList.add('is-active');
    surfaceTimer = setTimeout(() => { oldSurface.hidden = true; }, reducedMotion.matches ? 0 : 360);
    if (focusTarget) focusTarget.focus();
  }

  function setFormDisabled(disabled) {
    $('settingsForm').querySelectorAll('input, button').forEach((control) => { control.disabled = disabled; });
    $('sendBtn').disabled = disabled;
  }

  function setDraft(lang, relief) {
    state.lang = lang;
    state.relief = relief;
    document.querySelector(`input[name="lang"][value="${lang}"]`).checked = true;
    document.querySelector(`input[name="relief"][value="${relief ? 'on' : 'off'}"]`).checked = true;
  }

  function renderText() {
    const t = T[state.lang];
    document.documentElement.lang = state.lang;
    document.title = `廻リ視 — ${t.pageTitle}`;
    document.querySelector('.skip').textContent = t.skip;
    $('staffLabel').textContent = t.staff;
    $('staffToggle').setAttribute('aria-label', t.staffOpen);
    $('pageTitle').textContent = t.pageTitle;
    $('noticeLabel').textContent = t.noticeLabel;
    $('noticeBody').textContent = t.notice.split('\n\n').map(paragraph => paragraph.replace(/\n/g, state.lang === 'ja' ? '' : ' ')).join('\n\n');
    $('languageLegend').textContent = t.language;
    $('reliefLegend').textContent = t.relief;
    $('reliefOff').textContent = t.reliefOff;
    $('reliefOn').textContent = t.reliefOn;
    $('reliefDesc').textContent = t.reliefDesc;
    $('submitLabel').textContent = t.send;
    $('editBtn').textContent = t.edit;
    $('retryBtn').textContent = t.retry;
    $('selectedHeading').textContent = t.selected;
    $('headsetHeading').textContent = t.headset;
    $('itemHeading').textContent = t.item;
    $('resultLanguageLabel').textContent = t.language;
    $('resultReliefLabel').textContent = t.relief;
    $('connectionText').textContent = t.connection[state.connection];
    $('restartNotice').textContent = t.restarted;
    $('restartNotice').hidden = !state.restartMessage;
    setSubtitle(t.ask, `ask:${state.lang}`);
  }

  function renderReliefDescription() {
    $('reliefDesc').classList.toggle('is-visible', state.relief);
    $('reliefDesc').setAttribute('aria-hidden', String(!state.relief));
  }

  function resultKey() {
    if (state.ui === 'sending' || state.ui === 'fail') return state.ui;
    if (state.connection !== 'online' || !state.status) return 'noserver';
    const actual = state.status;
    const sent = state.sent;
    if (sent && sent.seq > 0 && actual.lang === sent.lang && actual.relief === sent.relief && actual.appliedSeq >= sent.seq) return 'applied';
    if (actual.phase === 'RUN' || actual.phase === 'END') return 'later';
    return 'waiting';
  }

  function renderResult() {
    if (!state.sent) return;
    const t = T[state.lang];
    const key = resultKey();
    const copy = t.post[key];
    const actual = state.connection === 'online' ? state.status : null;
    const glyph = { sending: '…', waiting: '…', later: '⌛', applied: '✓', fail: '×', noserver: '?' }[key];
    const tone = key === 'applied' ? 'ok' : (key === 'fail' || key === 'noserver' ? 'error' : 'wait');
    $('resultView').dataset.tone = tone;
    setText('resultGlyph', glyph);
    setText('resultTitle', copy[0]);
    setText('resultDetail', copy[1]);
    $('selectedLanguage').textContent = LANG_NAME[state.sent.lang];
    $('selectedRelief').textContent = state.sent.relief ? t.reliefOn : t.reliefOff;
    $('headsetLanguage').textContent = actual && actual.lang ? (LANG_NAME[actual.lang] || actual.lang) : '—';
    $('headsetRelief').textContent = actual && typeof actual.relief === 'boolean' ? (actual.relief ? t.reliefOn : t.reliefOff) : '—';
    $('retryBtn').hidden = key !== 'fail';
    $('editBtn').hidden = key === 'sending';
    setFormDisabled(key === 'sending');
  }

  function renderConnection() {
    $('staffToggle').dataset.state = state.connection;
    setText('connectionText', T[state.lang].connection[state.connection]);
  }

  function renderStaff() {
    const status = state.connection === 'online' ? state.status : null;
    if (!status) {
      $('staffSummary').textContent = `接続先: ${location.host}\n応答: なし\n受信回数: —\n反映回数: —\n現在設定: —\n予約: —`;
      $('clearBtn').disabled = true;
      return;
    }
    const pending = status.pending
      ? `${LANG_NAME[status.pending.lang]} / ホラー軽減 ${status.pending.relief ? 'あり' : 'なし'} / 受理 ${status.pending.seq}`
      : 'なし';
    $('staffSummary').textContent =
      `接続先: ${location.host}\n`
      + `画面: ${status.phase} / ${status.titleStage}\n`
      + `受信回数: ${status.received}\n`
      + `反映回数: ${status.applyCount}\n`
      + `現在設定: ${LANG_NAME[status.lang]} / ホラー軽減 ${status.relief ? 'あり' : 'なし'}\n`
      + `予約: ${pending}`;
    $('clearBtn').disabled = state.clearing || state.ui === 'sending' || status.pending == null;
  }

  function render() {
    renderText();
    renderReliefDescription();
    renderConnection();
    renderStaff();
    if (state.view === 'result') renderResult();
  }

  function observeVisitorCycle(status) {
    if (!state.sent) return;
    const applied = state.sent.seq > 0
      && status.lang === state.sent.lang
      && status.relief === state.sent.relief
      && status.appliedSeq >= state.sent.seq;
    if (applied) state.appliedSeen = true;
    if (state.appliedSeen && status.pending == null && status.titleStage !== 'Wait') {
      state.leftWaitAfterApplied = true;
    }
    if (!state.leftWaitAfterApplied || status.titleStage !== 'Wait') return;
    state.sent = null;
    state.ui = 'idle';
    state.appliedSeen = false;
    state.leftWaitAfterApplied = false;
    if (state.view !== 'edit') {
      setDraft('ja', false);
      setFormDisabled(false);
      setSurface('edit');
      render();
    }
  }

  function validSequence(value, allowZero = true) {
    return Number.isSafeInteger(value) && value >= (allowZero ? 0 : 1);
  }

  function validateStatus(status) {
    if (!status || typeof status !== 'object') return false;
    const pendingValid = status.pending == null || (
      typeof status.pending === 'object'
      && Object.hasOwn(LANG_NAME, status.pending.lang)
      && typeof status.pending.relief === 'boolean'
      && validSequence(status.pending.seq, false)
    );
    return status && status.ok === true
      && Object.hasOwn(LANG_NAME, status.lang)
      && typeof status.relief === 'boolean'
      && typeof status.phase === 'string'
      && typeof status.titleStage === 'string'
      && validSequence(status.appliedSeq)
      && validSequence(status.applyCount)
      && validSequence(status.received)
      && pendingValid;
  }

  async function fetchWithTimeout(path, options = {}, controller = new AbortController()) {
    const timeout = setTimeout(() => controller.abort(), 6000);
    try {
      const response = await fetch(path, { ...options, signal: controller.signal });
      const json = await response.json();
      if (!response.ok || json?.ok !== true) throw new Error(`HTTP ${response.status}`);
      return json;
    } finally {
      clearTimeout(timeout);
    }
  }

  async function post(path, body) {
    return await fetchWithTimeout(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: body == null ? '' : JSON.stringify(body),
    });
  }

  async function send() {
    if (state.ui === 'sending') return;
    if (pollController) pollController.abort();
    state.sent = { lang: state.lang, relief: state.relief, seq: 0 };
    state.restartMessage = false;
    state.appliedSeen = false;
    state.leftWaitAfterApplied = false;
    state.ui = 'sending';
    setSurface('result', $('resultTitle'));
    render();
    try {
      const response = await post('./set', { lang: state.sent.lang, relief: state.sent.relief });
      if (response.ok !== true || !validSequence(response.seq, false)) throw new Error('invalid set response');
      state.sent.seq = response.seq;
      state.ui = 'sent';
      if (pollInFlight) await pollInFlight;
      await poll();
    } catch (error) {
      console.warn('set failed', error);
      if (error.name === 'AbortError' || error instanceof TypeError) state.connection = 'offline';
      state.ui = 'fail';
    }
    render();
  }

  function poll() {
    if (pollInFlight) return pollInFlight;
    if (state.ui === 'sending') return Promise.resolve();
    pollController = new AbortController();
    pollInFlight = (async () => {
      try {
        const status = await fetchWithTimeout('./status', { cache: 'no-store' }, pollController);
        if (!validateStatus(status)) throw new Error('invalid status response');
        if (state.lastReceived != null && status.received < state.lastReceived) {
          const wasEditing = state.view === 'edit';
          state.sent = null;
          state.ui = 'idle';
          state.appliedSeen = false;
          state.leftWaitAfterApplied = false;
          state.restartMessage = true;
          if (!wasEditing) {
            setDraft('ja', false);
            setFormDisabled(false);
            setSurface('edit');
          }
          render();
        }
        state.lastReceived = status.received;
        state.status = status;
        state.connection = 'online';
        observeVisitorCycle(status);
      } catch (error) {
        state.connection = 'offline';
      }
      renderConnection();
      renderStaff();
      if (state.view === 'result') renderResult();
    })().finally(() => {
      pollInFlight = null;
      pollController = null;
    });
    return pollInFlight;
  }

  $('settingsForm').addEventListener('submit', (event) => {
    event.preventDefault();
    send();
  });
  $('settingsForm').addEventListener('change', (event) => {
    if (event.target.name === 'lang') {
      state.lang = event.target.value;
      render();
    }
    if (event.target.name === 'relief') {
      state.relief = event.target.value === 'on';
      renderReliefDescription();
    }
  });
  $('editBtn').addEventListener('click', () => {
    state.ui = 'idle';
    setFormDisabled(false);
    setSurface('edit', document.querySelector(`input[name="lang"][value="${state.lang}"]`));
    render();
  });
  $('retryBtn').addEventListener('click', send);
  $('staffToggle').addEventListener('click', () => {
    $('staffMessage').textContent = '';
    renderStaff();
    $('staff').showModal();
  });
  $('staffClose').addEventListener('click', () => $('staff').close());
  $('clearBtn').addEventListener('click', async () => {
    if (state.clearing || state.ui === 'sending') return;
    state.clearing = true;
    $('clearBtn').disabled = true;
    $('staffMessage').textContent = '予約を取り消しています…';
    try {
      const response = await post('./clear');
      if (response.ok !== true) throw new Error('invalid clear response');
      state.sent = null;
      state.ui = 'idle';
      state.appliedSeen = false;
      state.leftWaitAfterApplied = false;
      setFormDisabled(false);
      setSurface('edit');
      $('staffMessage').textContent = '予約の取消を送信しました。';
      await poll();
    } catch (error) {
      $('staffMessage').textContent = '予約を取り消せませんでした。通信を確認してください。';
    } finally {
      state.clearing = false;
      renderStaff();
    }
  });
  reducedMotion.addEventListener?.('change', () => {
    state.subtitleKey = '';
    setSubtitle(T[state.lang].ask, `motion:${state.lang}:${reducedMotion.matches}`);
  });
  render();
  poll();
  setInterval(poll, 2000);
})();
</script>
</body>
</html>
