<text x="146.53" y="52.20" class="zn">C</text>
<line x1="42.00" y1="26.00" x2="65.32" y2="53.00" class="lead"/>
<text x="41" y="25.4" class="thing" text-anchor="end">配信スマートフォン</text>
<text x="41" y="28.6" class="spec" text-anchor="end">×3（領域ごとに 1 台）・高さ 1.35m</text>
<line x1="120.00" y1="24.00" x2="115.65" y2="59.53" class="lead"/>
<text x="121" y="23.4" class="thing">パーテーション</text>
<text x="121" y="26.6" class="spec">L 字・高さ 1.8m</text>
<line x1="36.00" y1="68.00" x2="76.58" y2="85.93" class="lead"/>
<text x="35" y="67.4" class="thing" text-anchor="end">位置合わせの 2 点</text>
<text x="35" y="70.6" class="spec" text-anchor="end">壁の両端の床。順にタッチ</text>
<line x1="137.00" y1="90.00" x2="104.25" y2="91.45" class="lead"/>
<text x="138" y="89.4" class="thing">導入が始まる線</text>
<text x="138" y="92.6" class="spec">被った体験者が横切ると始まる</text>
<text x="82.82" y="101.13" class="thing" text-anchor="middle">開始位置</text>
<text x="85" y="113" class="cap" text-anchor="middle">図 1. 現場の配置。破線の矢印は体験者が歩く順路（A→B→C を 3 周）。</text>
</svg>