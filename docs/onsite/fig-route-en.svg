<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 103 99" width="84.0mm" height="80.7mm" role="img" aria-labelledby="rt rd">
<title id="rt">Route</title>
<desc id="rd">A plan view of the wall. An L-shaped wall is drawn with a dashed route running once around it. The entrance is at the east end of the horizontal arm. From there the route runs west along the inside of the wall, south along the east face of the vertical arm, around its south end, north along the outside, then east along the north side back to the entrance. The arrows point one way only.</desc>
<style>
  text  { font-family: "Yu Gothic", "Noto Sans JP", Meiryo, sans-serif; }
  .thing{ font-size: 4.6px; font-weight: bold; fill: #000; }
  .sub  { font-size: 4.6px; font-weight: bold; fill: #1a1a1a; }
  .wall { fill: none; stroke: #000; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
  .flow { fill: none; stroke: #333; stroke-width: 1.2; stroke-dasharray: 3.6 2.6; stroke-linecap: butt; }
  .lead { fill: none; stroke: #000; stroke-width: .35; }
</style>
