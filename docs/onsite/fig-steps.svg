<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 92" width="170mm" height="92mm"
     role="img" aria-labelledby="t d">
<title id="t">到着してからの手順 4 段</title>
<desc id="d">配信スマートフォンと卓を立ち上げ、HMD で壁の両端の上 1m の 2 点をタッチして位置を合わせ、1 周通して動きを見る。人形の合成がずれていたら、卓でカメラを手で合わせる。段のあいだの矢印は、前の段が次の段へ渡すものを示す。</desc>
<style>
  text   { font-family: Helvetica, Arial, "Yu Gothic", sans-serif; fill: #000; }
  .step  { font-size: 3.2px; font-weight: bold; }
  .num   { font-size: 2.6px; font-weight: bold; fill: #6a6a6a; }
  .op    { font-size: 2.4px; }
  .desc  { font-size: 2.2px; fill: #444; }
  .pass  { font-size: 2.2px; font-style: italic; fill: #333; }
  .cap   { font-family: "Times New Roman", "Yu Mincho", serif; font-size: 3.4px; font-weight: bold; }
  .sep   { stroke: #b8b8b8; stroke-width: .25; stroke-dasharray: 1.6 1.4; }
  .ln    { fill: none; stroke: #000; stroke-width: .3; }
  .lnt   { fill: none; stroke: #000; stroke-width: .22; }
  .fl    { fill: none; stroke: #333; stroke-width: .3; }
  .f0 { fill: #fcfcfc; } .f1 { fill: #ededed; } .f2 { fill: #d8d8d8; }
  .acc  { fill: none; stroke: #CC79A7; stroke-width: .5; }
  .accf { fill: #CC79A7; }
</style>
<defs><marker id="ar" viewBox="0 0 2 1.6" refX="2" refY=".8" markerWidth="2" markerHeight="1.6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L2,.8 L0,1.6 z" fill="#333"/></marker></defs>
<text x="16.0" y="9" class="num">1</text>
<text x="21.0" y="9.4" class="step">立ち上げる</text>
<text x="16.0" y="70.0" class="op">配信スマホ 3 台を起動</text>
<text x="16.0" y="74.2" class="op">Quest を 5GHz に繋ぐ</text>
<text x="16.0" y="78.4" class="op">卓は起動済み</text>
<line x1="52.2" y1="20" x2="52.2" y2="78" class="sep"/>
<text x="55.5" y="9" class="num">2</text>
<text x="60.5" y="9.4" class="step">位置を合わせる</text>
<text x="55.5" y="70.0" class="op">右トリガー 2 秒長押し</text>
<text x="55.5" y="74.2" class="op">壁の両端を A で 2 点</text>
<text x="55.5" y="78.4" class="op">B で確定</text>
<line x1="91.7" y1="20" x2="91.7" y2="78" class="sep"/>
<text x="95.0" y="9" class="num">3</text>
<text x="100.0" y="9.4" class="step">通してみる</text>
<text x="95.0" y="70.0" class="op">線を横切ると導入</text>
<text x="95.0" y="74.2" class="op">A→B→C を 3 周</text>
<text x="95.0" y="78.4" class="op">3 分ほどで終わる</text>
<line x1="131.2" y1="20" x2="131.2" y2="78" class="sep"/>
<text x="134.5" y="9" class="num">4</text>
<text x="139.5" y="9.4" class="step">カメラを合わせる</text>
<text x="134.5" y="70.0" class="op">卓の 🎯 から</text>
<text x="134.5" y="74.2" class="op">傾き→位置→向き</text>
<text x="134.5" y="78.4" class="op">💾 このカメラに保存</text>
<rect x="17.5" y="26" width="4.6" height="8.2" rx=".5" class="f0" stroke="#000" stroke-width=".3"/>
<circle cx="19.8" cy="28" r=".5" fill="#333"/>
<path d="M19.8,24.6 q2.4,-2.4 4.8,0" class="lnt"/>
<rect x="24.0" y="26" width="4.6" height="8.2" rx=".5" class="f0" stroke="#000" stroke-width=".3"/>
<circle cx="26.3" cy="28" r=".5" fill="#333"/>
<path d="M26.3,24.6 q2.4,-2.4 4.8,0" class="lnt"/>
<rect x="30.5" y="26" width="4.6" height="8.2" rx=".5" class="f0" stroke="#000" stroke-width=".3"/>
<circle cx="32.8" cy="28" r=".5" fill="#333"/>
<path d="M32.8,24.6 q2.4,-2.4 4.8,0" class="lnt"/>
<text x="17.5" y="39.5" class="desc">A ・ B ・ C</text>
<path d="M19.0,58 L40.0,58 L42.0,61 L17.0,61 Z" class="f1" stroke="#000" stroke-width=".3"/>
<rect x="21.0" y="45" width="17" height="13" class="f0" stroke="#000" stroke-width=".3"/>
<rect x="22.6" y="46.6" width="13.8" height="7.4" class="f2"/>
<text x="21.0" y="64.2" class="desc">オペレータ卓（PC）</text>
<path d="M28.0,41 q3,3 1.5,4" class="lnt"/>
<path d="M61.5,26 q10,-3 20,0 q1.6,.6 1.2,3.4 q-.5,3.4 -3,3.4 q-3.4,0 -5,-2.2 q-1.6,-2 -3.2,-2 q-1.6,0 -3.2,2 q-1.6,2.2 -5,2.2 q-2.5,0 -3,-3.4 q-.4,-2.8 1.2,-3.4 Z" class="f1" stroke="#000" stroke-width=".35"/>
<text x="63.5" y="39.5" class="desc">かぶる</text>
<path d="M57.5,58 L77.5,58 L86.5,48 L66.5,48 Z" class="f0" stroke="#000" stroke-width=".3"/>
<path d="M68.5,51.7 L70.0,54.6 L67.0,54.6 Z" class="accf"/>
<text x="68.5" y="50.4" class="desc" text-anchor="middle">1</text>
<path d="M79.5,51.7 L81.0,54.6 L78.0,54.6 Z" class="accf"/>
<text x="79.5" y="50.4" class="desc" text-anchor="middle">2</text>
<path d="M70.0,52 q5,-3.4 9,0" class="acc"/>
<text x="57.5" y="64.2" class="desc">両端の上 1m を順にタッチ</text>
<rect x="101.0" y="24" width="21" height="12.4" class="f2" stroke="#000" stroke-width=".3"/>
<text x="111.5" y="31.4" class="desc" text-anchor="middle">固定カメラの映像</text>
<text x="101.0" y="39.5" class="desc">目の前に出る画面</text>
<path d="M97.0,58 L117.0,58 L126.0,48 L106.0,48 Z" class="f0" stroke="#000" stroke-width=".3"/>
<g transform="translate(107.0,50.6)"><path d="M-1.5,5.4 L-1.9,2.2 Q-1.9,.6 0,.6 Q1.9,.6 1.9,2.2 L1.5,5.4 Z" fill="#1a1a1a"/><circle cx="0" cy="-1.2" r="1.5" fill="#1a1a1a"/></g>
<path d="M110.0,55.4 q6,-1.6 10,-4.4" class="fl" marker-end="url(#ar)"/>
<text x="97.0" y="64.2" class="desc">歩くと領域ごとに切り替わる</text>
<rect x="135.5" y="24" width="31" height="23" class="f2" stroke="#000" stroke-width=".3"/>
<path d="M138.5,43 L163.5,43 L158.5,34 L143.5,34 Z" class="acc"/>
<line x1="140.2" y1="40.0" x2="161.8" y2="40.0" class="acc" stroke-width=".25"/>
<line x1="141.8" y1="37.0" x2="160.2" y2="37.0" class="acc" stroke-width=".25"/>
<g transform="translate(151.5,36.4)"><path d="M-1.4,4.8 L-1.7,2.0 Q-1.7,.6 0,.6 Q1.7,.6 1.7,2.0 L1.4,4.8 Z" fill="#1a1a1a"/><circle cx="0" cy="-1.1" r="1.4" fill="#1a1a1a"/></g>
<text x="135.5" y="51.5" class="desc">実映像に部屋の線と人形を重ねる</text>
<path d="M139.5,57 l3,-2.6 l0,1.3 l7,0 l0,2.6 l-7,0 l0,1.3 Z" class="f1" stroke="#000" stroke-width=".25"/>
<path d="M162.5,57 l-3,-2.6 l0,1.3 l-7,0 l0,2.6 l7,0 l0,1.3 Z" class="f1" stroke="#000" stroke-width=".25"/>
<text x="135.5" y="64.2" class="desc">線が実物に重なるまでドラッグ</text>
<path d="M49.8,17 L54.6,17" class="fl" marker-end="url(#ar)"/>
<text x="52.2" y="14.2" class="pass" text-anchor="middle">3 台とも映っている</text>
<path d="M89.3,17 L94.1,17" class="fl" marker-end="url(#ar)"/>
<text x="91.7" y="14.2" class="pass" text-anchor="middle">原点と床の高さ</text>
<path d="M128.8,17 L133.6,17" class="fl" marker-end="url(#ar)"/>
<text x="131.2" y="14.2" class="pass" text-anchor="middle">合成のずれ</text>
<text x="85.0" y="88" class="cap" text-anchor="middle">図 2. 到着してからの手順。矢印は前の段が次の段へ渡すもの。</text>
</svg>