<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="design-mode" content="expressive">
<title>廻リ視 ポスター</title>
<link rel="stylesheet" href="poster.css">
<style>
  .ground { object-position: 50% 62%; filter: contrast(1.05) brightness(1.12); }

  /* 上の闇に浮かぶ顔。明るい所だけを残して幕へ溶かす */
  .face {
    left: 34mm; top: -77mm; width: 142mm;
    mix-blend-mode: lighten;
    opacity: .78;
    filter: saturate(.55) contrast(1.1) brightness(.92);
    -webkit-mask-image: radial-gradient(ellipse 46% 34% at 50% 57%, #000 50%, transparent 100%);
            mask-image: radial-gradient(ellipse 46% 34% at 50% 57%, #000 50%, transparent 100%);
  }

  .shade-top { inset: 0 0 auto 0; height: 60mm; background: linear-gradient(#0d0b09 0%, rgba(13,11,9,0) 100%); opacity: .55; }
  .shade-bottom { inset: auto 0 0 0; height: 112mm; background: linear-gradient(rgba(13,11,9,0) 0%, rgba(13,11,9,.12) 38%, rgba(13,11,9,.86) 80%, rgba(13,11,9,.96) 100%); }
  .vignette { inset: 0; background: radial-gradient(ellipse 78% 70% at 50% 48%, transparent 55%, rgba(8,6,5,.7) 100%); }

  /* テレビ。作中の増えるスクリーンと同じく、闇の奥から頭を囲む */
  .stage { inset: 0; perspective: 420mm; perspective-origin: 50% 46%; }
  .tv {
    position: absolute;
    border-radius: 7% / 9%;
    overflow: hidden;
    transform-style: preserve-3d;
    box-shadow: 0 0 9mm rgba(190, 205, 215, .16), 0 3mm 8mm rgba(0, 0, 0, .7);
    background: #000;
  }
  .tv img { display: block; width: 100%; height: auto; }
  .tv.far { filter: brightness(.6) blur(.22mm); box-shadow: 0 0 5mm rgba(190, 205, 215, .1); }
  .tv.mid { filter: brightness(.82); }
  .tv.warn { border-radius: 0; box-shadow: none; background: none; mix-blend-mode: lighten; overflow: visible; }

  .paper {
    box-shadow: 0 2mm 6mm rgba(0,0,0,.7);
    filter: brightness(.78) sepia(.25);
  }
  .paper img { display: block; width: 100%; }
  .tablet { border: 1.1mm solid #0b0a09; border-radius: 1.8mm; overflow: hidden; box-shadow: 0 2mm 7mm rgba(0,0,0,.75), 0 0 6mm rgba(200,170,120,.12); }
  .tablet img { display: block; width: 100%; }

  .laurel { display: flex; align-items: center; gap: 3.2mm; }
  .laurel .rule { width: 13mm; position: static; }

  .billing { font-size: 2.55mm; letter-spacing: .16em; line-height: 2.05; white-space: nowrap; color: var(--cream-dim); }
  .billing b { font-weight: 600; font-size: 3.7mm; letter-spacing: .2em; color: var(--cream); margin: 0 .6em 0 .5em; }
  .billing i { font-style: normal; color: var(--cream); letter-spacing: .12em; }
</style>
</head>
<body>
<div class="sheet">
  <img class="ground" src="assets/ground.png" alt="">
  <div class="shade-top"></div>
  <img class="face" src="assets/face.png" alt="">
  <div class="vignette"></div>

  <div class="stage">
    <!-- 奥 -->
    <div class="tv far" style="left:9mm;  top:17mm; width:27mm; transform:rotateY(34deg) rotateZ(-2deg);"><img src="assets/tv-tv-power.jpg" alt=""></div>
    <div class="tv far" style="left:174mm; top:15mm; width:27mm; transform:rotateY(-34deg) rotateZ(2deg);"><img src="assets/tv-warp.jpg" alt=""></div>
    <div class="tv far" style="left:31mm; top:11mm;  width:21mm; transform:rotateY(20deg);"><img src="assets/tv-farewell.jpg" alt=""></div>
    <div class="tv far" style="left:158mm; top:10mm;  width:21mm; transform:rotateY(-20deg);"><img src="assets/tv-return.jpg" alt=""></div>
            <!-- 中 -->
    <div class="tv mid" style="left:-9mm; top:40mm; width:47mm; transform:rotateY(32deg) rotateZ(-4deg);"><img src="assets/tv-handprint.jpg" alt=""></div>
    <div class="tv mid" style="left:171mm; top:38mm; width:47mm; transform:rotateY(-32deg) rotateZ(4deg);"><img src="assets/tv-pov-chase.jpg" alt=""></div>
    <div class="tv mid" style="left:10mm; top:131mm; width:49mm; transform:rotateY(24deg) rotateZ(2deg);"><img src="assets/tv-backrooms.jpg" alt=""></div>
    <div class="tv mid" style="left:154mm; top:133mm; width:49mm; transform:rotateY(-24deg) rotateZ(-2deg);"><img src="assets/tv-stain.jpg" alt=""></div>
    <!-- 手前 -->
    <div class="tv" style="left:5mm; top:79mm; width:66mm; transform:rotateY(20deg) rotateZ(-3deg);"><img src="assets/tv-stain-face.jpg" alt=""></div>
    <div class="tv" style="left:141mm; top:83mm; width:63mm; transform:rotateY(-20deg) rotateZ(3deg);"><img src="assets/tv-final-enter.jpg" alt=""></div>
  </div>

  <div class="laurel award" style="left:0; right:0; top:6.5mm; justify-content:center;">
    <span class="rule"></span><span>IVRC2026 <b>総合優勝</b>　／　<b>DCEXPO賞</b></span><span class="rule"></span>
  </div>

  <p class="catch vertical" style="left:129mm; top:109mm; font-size:4.5mm;">廻るたびに狂う世界、<br>あなたは生きて戻れるか。</p>

  <div class="shade-bottom"></div>

  <img class="warn" src="assets/tv-takeover.jpg" alt="" style="left:-22mm; top:152mm; width:112mm; mix-blend-mode:lighten; filter:contrast(1.15) brightness(1.1);">
  <div class="tablet" style="left:151mm; top:176mm; width:47mm; transform:rotate(-4deg);"><img src="../../website/assets/doctor-briefing.webp" alt=""></div>
  <div class="paper" style="left:174mm; top:209mm; width:27mm; transform:rotate(7deg);"><img src="../../website/assets/investigation-request.webp" alt=""></div>

  <p class="genre" style="left:36mm; width:122mm; top:258.5mm; text-align:center; font-size:3.7mm;">実世界 <span class="red">×</span> 固定視点ホラー</p>

  <div class="title" style="left:36mm; top:205mm; width:122mm; height:52.4mm;">
    <img src="assets/title-sub.png" alt="">
    <img src="assets/title-white.png" alt="廻リ">
    <img src="assets/title-red.png" alt="視">
  </div>

  <div class="billing" style="left:12mm; top:268mm;">
    <div><i>監視カメラに映る自分を見ながら現実空間を歩く、固定視点のホラー体験。</i></div>
    <div>企画・監督・制作リーダー<b>白石大晴</b></div>
    <div>チーム：Roil Studio　<i>白石大晴 ／ Kim Hyunmin ／ 堀越 康平 ／ 五島 慶人</i></div>
  </div>

  <div class="qr" style="left:168mm; top:255mm;"><img src="assets/qr.svg" alt="公式サイトの QR コード"></div>
  <p class="url" style="left:118mm; width:46mm; top:280.4mm; text-align:right;">mawarimi.vercel.app</p>
  <p class="small" style="left:118mm; width:46mm; top:275.6mm; text-align:right; color:var(--cream);">公式サイト</p>

  <div class="grain"></div>
</div>
</body>
</html>
