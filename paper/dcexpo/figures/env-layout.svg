<svg xmlns="http://www.w3.org/2000/svg" width="76mm" height="54mm" viewBox="0 0 76 54" role="img" aria-labelledby="t d">
<title id="t">現場の配置：L字の壁のまわりの3区間と，固定カメラ3台</title>
<desc id="d">床1.8 m四方の中央に，高さ1.8 mで手すり付きのL字の壁がある。L字の口の側に三脚のカメラA，縦の辺の外側に床置きのカメラB，横の辺の外側に棚のアームに付けたカメラCがある。体験者は区間1でL字の口を横切り，区間2で縦の辺の外側，区間3で横の辺の外側を，時計回りに歩く。</desc>
