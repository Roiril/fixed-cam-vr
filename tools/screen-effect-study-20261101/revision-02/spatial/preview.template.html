<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>空間の変形・独立試作</title><style>
:root{color-scheme:light dark;--paper:#f7f7f5;--ink:#242424;--line:#c9c9c5;--dim:#666;--panel:#eaeae7;--black:#000}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.7 system-ui,"Yu Gothic",sans-serif}main{max-width:960px;margin:32px auto;padding:0 20px}h1{font-size:25px;font-weight:600}p{max-width:62ch}canvas{display:block;width:min(100%,720px);height:auto;background:var(--black);border:1px solid var(--line)}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:16px 0}.seek{width:min(100%,560px)}button,select{font:inherit;padding:5px 10px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:0}label{display:inline-flex;gap:6px;align-items:center}.note{font-size:13px;color:var(--dim)}@media(prefers-color-scheme:dark){:root{--paper:#191919;--ink:#e7e7e4;--line:#4a4a46;--dim:#b1b1ab;--panel:#292927}}
</style><main><h1>床と仕切りが曲がる</h1><p>元の写真を仮の空間へ投影し、形を変えて同じカメラから見ています。カメラは固定です。表示のガラスと走査線は画面に固定した独立近似です。</p><canvas></canvas><div class="controls"><button id="play">再生</button><select id="mode"><option value="local">空間の変形</option><option value="global">従来の全体運動</option><option value="none">変形なし</option></select><span id="clock"></span></div><input class="seek" id="time" type="range" min="0" max="15.6" step=".01" value="0"><div class="controls"><label>強さ<input id="strength" type="range" min="0" max="2" step=".01" value="1"></label><label><input id="display" type="checkbox" checked>固定表示</label><label><input id="showHoles" type="checkbox">未撮影領域</label><select id="diagnostic"><option value="beauty">写真</option><option value="surface">面の区分</option><option value="depth">奥行</option><option value="wire">分割した面</option><option value="holes">未撮影領域の検査</option></select></div><p class="note">カメラと L 字の仕切りは既存 sim の手動設定です。外室は 9m × 9m × 2.7m の sim 仮面です。棚・モニタ群と金属フレームは写真を手で囲った仮形状です。実測した復元形状ではありません。覆われていた背後と写真の外側は未撮影領域として残ります。輪郭の一致には限界があります。</p></main><script type="module">/*BUNDLE*/</script></html>
