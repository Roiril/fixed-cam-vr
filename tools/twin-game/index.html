<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>廻り視 デジタルツイン</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main id="stage" aria-label="固定カメラの映像">
  <div id="screen">
    <video id="v0" muted playsinline preload="auto"></video>
    <video id="v1" muted playsinline preload="auto"></video>
    <video id="v2" muted playsinline preload="auto"></video>
    <canvas id="overlay"></canvas>
    <div id="dim"></div>
    <div id="osd"><span id="osd-cam">CAM A</span><span id="osd-rec">●</span><span id="osd-time">00:00.0</span></div>
    <div id="nofeed" hidden>この経路の動画はまだ焼かれていません。線の表示だけで確かめられます。</div>
  </div>
  <video id="pov" muted playsinline preload="auto" hidden></video>
  <canvas id="map" width="320" height="320"></canvas>
  <section id="panel" hidden aria-label="検証">
    <h2>検証</h2>
    <dl id="readout"></dl>
    <h3>機材の配置</h3>
    <ul id="rigcheck"></ul>
    <h3>出来事</h3>
    <ol id="events"></ol>
  </section>
</main>
<footer id="bar">
  <button id="play" aria-label="再生">▶</button>
  <canvas id="timeline" height="34"></canvas>
  <select id="route" aria-label="経路">
    <option value="forward">順回り</option>
    <option value="reverse">逆回り</option>
    <option value="backtrack">引き返し</option>
  </select>
  <div id="cams" role="group" aria-label="カメラ">
    <button data-cam="auto" class="on">自動</button>
    <button data-cam="0">A</button>
    <button data-cam="1">B</button>
    <button data-cam="2">C</button>
  </div>
  <button id="b-overlay" aria-pressed="false">線</button>
  <button id="b-map" aria-pressed="true">地図</button>
  <button id="b-pov" aria-pressed="false">HMD</button>
  <button id="b-panel" aria-pressed="false">検証</button>
  <button id="b-sound" aria-pressed="false">音</button>
</footer>
<div id="title">
  <h1>廻り視</h1>
  <p>デジタルツイン</p>
  <button id="start">見る</button>
  <p class="keys">Space 再生 ／ ← → コマ送り ／ 1 2 3 カメラ ／ 0 自動 ／ L 線 ／ M 地図 ／ H HMD ／ D 検証</p>
</div>
<script src="app.js"></script>
</body>
</html>
