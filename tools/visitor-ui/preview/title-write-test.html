<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>title-write 試験</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  body { display: flex; align-items: center; justify-content: center; }
  .title-view { display: block; }
  .title-view.hidden { display: none; }
  #titleBrand { margin: 0; position: relative; line-height: 0; }
  #titleBrand img { width: min(80vw, 900px); height: auto; display: block; }
  #ctl { position: fixed; left: 8px; bottom: 8px; font: 12px sans-serif; color: #888; }
  #ctl button { margin-right: 4px; }
</style>
</head>
<body>
<section id="titleView" class="title-view is-active"><h1 id="titleBrand"><img src="../../../tablet/app/src/main/assets/web/asset/title-logo-v2.png"></h1></section>
<div id="ctl">
  <button onclick="TitleWrite.play()">play</button>
  <button onclick="var v=document.getElementById('titleView');v.classList.remove('is-active');v.classList.add('hidden');setTimeout(function(){v.classList.remove('hidden');v.classList.add('is-active')},400)">hide/show</button>
  <span id="mode"></span>
</div>
<script src="../../../tablet/app/src/main/assets/web/title-write.js"></script>
<script>
  // ?p=0.45&wet=1 で任意の 1 コマを止めて見る（撮影用）。無指定なら通常再生
  (function () {
    var q = new URLSearchParams(location.search);
    var tick = setInterval(function () {
      document.getElementById('mode').textContent = window.TitleWrite.mode + (window.TitleWrite.ready ? ' ready' : '');
      if (!window.TitleWrite.ready) return;
      clearInterval(tick);
      if (q.has('p')) window.TitleWrite.seek(parseFloat(q.get('p')), q.has('wet') ? parseFloat(q.get('wet')) : 1);
    }, 50);
  })();
</script>
</body>
</html>
