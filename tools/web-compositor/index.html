<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#16181b">
  <title>準備 — 廻リ視 当日</title>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('mawarimi-day-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')}catch(e){}</script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2316181b'/%3E%3Crect x='5' y='5' width='6' height='6' fill='%23c0444c'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="ops/ops.css">
  <script type="module" src="ops/main.js"></script>
</head>
<body>
  <a class="skip" href="#main">本文へ移動</a>
  <header class="bar">
    <a class="mark" href="#ready" translate="no"><span class="mark-name">廻リ視</span><span class="mark-role">当日</span></a>
    <nav class="tabs" aria-label="画面">
      <a href="#ready" data-view="ready">準備</a>
      <a href="#shoot" data-view="shoot">素材</a>
      <a href="#live" data-view="live">本番</a>
      <a href="#help" data-view="help">困ったとき</a>
    </nav>
    <div class="bar-end">
      <div id="lamps" class="lamps" role="group" aria-label="機器のいまの状態"></div>
      <p id="age" class="age" role="status">確認中…</p>
      <button id="theme" class="icon-button" type="button" aria-label="明るい表示にする"><span aria-hidden="true"></span></button>
    </div>
  </header>
  <div id="demo" class="strip" hidden>表示の見本です。実機の状態ではありません。操作は実行されません。</div>
  <div id="outage" class="outage" role="alert" hidden><p class="outage-title"></p><p class="outage-detail"></p></div>
  <main id="main">
    <section id="view-ready" class="view" aria-labelledby="ready-heading" hidden></section>
    <section id="view-shoot" class="view" aria-labelledby="shoot-heading" hidden></section>
    <section id="view-live" class="view" aria-labelledby="live-heading" hidden></section>
    <section id="view-help" class="view" aria-labelledby="help-heading" hidden></section>
  </main>
  <nav class="dock" aria-label="画面（下）">
    <a href="#ready" data-view="ready">準備</a>
    <a href="#shoot" data-view="shoot">素材</a>
    <a href="#live" data-view="live">本番</a>
    <a href="#help" data-view="help">困ったとき</a>
  </nav>
  <div id="announce" class="visually-hidden" role="status"></div>
  <noscript><p class="outage">この画面には JavaScript が必要です。ブラウザで有効にして読み込み直してください。</p></noscript>
</body>
</html>
