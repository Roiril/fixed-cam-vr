<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>撮影コンソール — 接近の素材（廻リ視）</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .sh-wrap { display: grid; grid-template-columns: 300px 1fr; gap: 0; min-height: 100vh; }
    .sh-list { border-right: 1px solid var(--line); padding: 0; }
    .sh-main { padding: 16px 20px; min-width: 0; }

    .sh-shot {
      display: block; width: 100%; text-align: left; padding: 12px 14px;
      background: none; border: 0; border-bottom: 1px solid var(--line);
      color: var(--fg); cursor: pointer; font: inherit;
    }
    .sh-shot:hover { background: rgba(255,222,173,.06); }
    .sh-shot.on { background: rgba(255,222,173,.12); border-left: 3px solid var(--accent); }
    .sh-shot .n { display: block; font-size: 13px; }
    .sh-shot .s { display: block; font-size: 11px; color: var(--dim); margin-top: 3px; }
    .sh-shot .mark { float: right; font-size: 14px; }

    .sh-hint {
      background: rgba(255,255,255,.04); border-left: 3px solid var(--accent);
      padding: 10px 14px; margin: 0 0 14px; font-size: 13px; line-height: 1.7;
    }
    .sh-row { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
    .sh-col { flex: 1 1 340px; min-width: 300px; }
    .sh-live, .sh-prev { width: 100%; background: #000; border: 1px solid var(--line); display: block; }
    .sh-big {
      font-size: 18px; padding: 14px 28px; letter-spacing: .06em;
    }
    .sh-big.rec { background: #b03028; border-color: #b03028; color: #fff; }
    .sh-takes { width: 100%; font-size: 12px; border-collapse: collapse; margin-top: 8px; }
    .sh-takes th, .sh-takes td { border: 1px solid var(--line); padding: 4px 7px; text-align: left; }
    .sh-takes tr.adopted { background: rgba(255,222,173,.12); }
    .sh-dev { font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
    .sh-dev span { white-space: nowrap; }
    .sh-warn { color: #ffb37a; }
    .sh-ng { color: #ff8a7a; }
    .sh-ok { color: #9fd6a6; }
    .sh-note { font-size: 11px; color: var(--dim); line-height: 1.7; margin-top: 6px; }
    label.sh-f { font-size: 12px; color: var(--dim); display: inline-flex; gap: 6px; align-items: center; }
    label.sh-f input, label.sh-f select { width: 5em; }
    label.sh-f select { width: auto; }
  </style>
</head>
<body>
  <div class="sh-wrap">
    <aside class="sh-list">
      <header style="border:0">
        <h1 style="font-size:15px">🎬 撮影コンソール</h1>
        <span class="status">2 周目 B・C の接近（当日の素材撮り）</span>
      </header>
      <div id="shotList"></div>
      <div class="sh-note" style="padding:10px 14px">
        撮る順は上から。白衣を着せてから始める。<br>
        照明が本番と違う素材は何度撮っても使えない。
      </div>
    </aside>

    <main class="sh-main">
      <div class="sh-dev" id="devices">端末を調べています…</div>

      <h2 id="shotTitle" style="margin:0 0 6px">—</h2>
      <div class="sh-hint" id="shotHint"></div>
      <div id="shotState" style="font-size:13px;margin-bottom:14px"></div>

      <div class="sh-row">
        <div class="sh-col">
          <h3 style="margin:0 0 6px;font-size:13px">① 撮る</h3>
          <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px">
            <label class="sh-f">端末
              <select id="devSel"></select>
            </label>
            <label class="sh-f">尺
              <input id="maxSec" type="number" min="0" max="600" step="1">秒
            </label>
            <label class="sh-f">構える
              <input id="countSec" type="number" min="0" max="10" step="1">秒
            </label>
          </div>
          <button id="recBtn" class="sh-big">⏺ 撮る</button>
          <span id="recState" style="margin-left:10px;font-size:13px"></span>
          <img class="sh-live" id="live" alt="ライブ映像">
          <div class="sh-note">
            構える秒数を入れると、その間 1 秒ごとに端末が短く振動し、録り始めで長く振動する。<br>
            尺で自動停止するので ⏹ を数えなくてよい。
          </div>
        </div>

        <div class="sh-col">
          <h3 style="margin:0 0 6px;font-size:13px">② 画に出る所だけ見る</h3>
          <video class="sh-prev" id="prev" muted playsinline></video>
          <div class="sh-note" id="prevNote">テイクを選ぶと、実機で画に出る頭の窓だけをループ再生する。</div>
          <div style="margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
            <label class="sh-f">頭を送る
              <input id="inPoint" type="number" min="0" max="60" step="0.05" value="0">秒
            </label>
            <button id="adoptBtn">この頭で採用</button>
          </div>
          <div class="sh-note">
            頭を送ると、その位置から切り出した別ファイルを作って採用する（元のテイクは残る）。
          </div>
        </div>
      </div>

      <h3 style="margin:18px 0 4px;font-size:13px">③ テイク</h3>
      <table class="sh-takes" id="takes"><tbody></tbody></table>

      <div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap">
        <a href="index.html#preflight"><button>✅ 本番前チェックへ</button></a>
        <a href="index.html"><button>🎬 タイムラインへ（▶ 検証）</button></a>
      </div>
    </main>
  </div>
  <script type="module" src="shoot.js"></script>
</body>
</html>
