<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#100e0c">
    <meta name="description" content="監視カメラに映る自分を見ながら、現実の空間を歩く。固定視点のホラー体験『廻リ視』。">
    <title>廻リ視</title>
    <link rel="preload" href="assets/shippori-mincho.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/hero-desktop.webp" as="image" type="image/webp" media="(min-width: 601px)" imagesrcset="assets/hero-small.webp 1024w, assets/hero-desktop.webp 1672w" imagesizes="(min-width: 1800px) 1800px, 100vw" fetchpriority="high">
    <link rel="stylesheet" href="styles.css">
    <script src="main.js" defer></script>
  </head>
  <body id="top">
    <a class="skip-link" href="#main">本文へ移動</a>

    <header class="site-header">
      <a class="site-mark" href="#top" aria-label="廻リ視 ページ先頭へ">廻リ視</a>
      <nav class="site-nav" aria-label="ページ内">
        <a href="#fixed-view">固定視点</a>
        <a href="#scenario">調査依頼</a>
      </nav>
    </header>

    <main id="main">
      <section class="hero" aria-labelledby="hero-title">
        <h1 id="hero-title" class="sr-only">廻リ視</h1>
        <picture class="hero-picture">
          <source media="(max-width: 600px)" srcset="assets/hero-mobile.webp" width="900" height="1350">
          <source srcset="assets/hero-small.webp 1024w, assets/hero-desktop.webp 1672w" sizes="(min-width: 1800px) 1800px, 100vw">
          <img src="assets/hero-desktop.webp" width="1672" height="941" alt="黒い幕の前に並ぶ日本人形。廻リ視。" fetchpriority="high">
        </picture>
      </section>

      <section id="fixed-view" class="fixed-view" aria-labelledby="fixed-view-title">
        <div class="fixed-view-copy">
          <p class="section-number" aria-hidden="true">01</p>
          <h2 id="fixed-view-title">固定視点</h2>
          <p class="fixed-view-lead">監視カメラに映る自分を見ながら、<br class="desktop-break">現実の空間を歩く。</p>
        </div>

        <div class="camera-exhibit">
          <div class="crt">
            <img class="crt-body" src="assets/crt.webp" width="1448" height="1086" alt="ブラウン管テレビ">
            <div class="crt-screen">
              <img class="camera-feed is-active" src="assets/camera-01.webp" width="1152" height="864" alt="固定カメラ01の映像" data-camera-feed="1">
              <img class="camera-feed" src="assets/camera-02.webp" width="1152" height="864" alt="固定カメラ02の映像" data-camera-feed="2" aria-hidden="true">
              <img class="camera-feed" src="assets/camera-03.webp" width="1152" height="864" alt="固定カメラ03の映像" data-camera-feed="3" aria-hidden="true">
              <span class="screen-noise" aria-hidden="true"></span>
              <span class="screen-shade" aria-hidden="true"></span>
              <span id="camera-indicator" class="camera-indicator" aria-hidden="true">CAM 01</span>
            </div>
          </div>

          <div class="camera-console" role="group" aria-label="カメラを選択">
            <button class="camera-button is-active" type="button" data-camera-button="1" aria-pressed="true"><span class="button-led" aria-hidden="true"></span>カメラ 01</button>
            <button class="camera-button" type="button" data-camera-button="2" aria-pressed="false"><span class="button-led" aria-hidden="true"></span>カメラ 02</button>
            <button class="camera-button" type="button" data-camera-button="3" aria-pressed="false"><span class="button-led" aria-hidden="true"></span>カメラ 03</button>
          </div>
          <p id="camera-status" class="sr-only" aria-live="polite">カメラ 01</p>
        </div>
      </section>

      <section id="scenario" class="scenario" aria-labelledby="scenario-title">
        <div class="scenario-copy">
          <p class="section-number" aria-hidden="true">02</p>
          <h2 id="scenario-title">調査依頼</h2>
          <p>怪異調査員として、<br class="desktop-break">呪われた壁の調査に向かう。</p>
        </div>

        <div class="scenario-collage">
          <img class="wall-evidence" src="assets/wall-evidence.webp" width="1672" height="940" alt="調査対象の壁" loading="lazy">
          <a class="investigation-request" href="assets/investigation-request.webp" aria-label="調査依頼書を原寸で開く">
            <img src="assets/investigation-request.webp" width="1273" height="1800" alt="調査依頼書。壁面周辺の観測調査について。" loading="lazy">
          </a>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <span>廻リ視</span>
      <a href="#top">ページ先頭へ</a>
    </footer>
  </body>
</html>
